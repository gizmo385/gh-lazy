name: Rust checks

on:
  push:
    branches:
    - rust-main
  pull_request:
    # `rust/**` gives stacked PRs (a work branch based on another work branch) CI before their base merges.
    branches:
    - rust-main
    - 'rust/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to rust-main finish so each merge gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, so the workspace is built once per run (Linux only: macOS runners cost about 10x, PLAN §7; Windows joins
  # in M5). The name is kept from when this was only fmt/clippy/test, so the required check in branch protection still
  # matches; the job now also runs the parity gate (parity/README.md, "CI").
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    # Two commits deep: in a pull_request run the checkout is the PR's merge commit, and its first parent, HEAD^1, is
    # the base tip the parity plan diffs against.
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        fetch-depth: 2
    # rust-toolchain.toml is the single source of truth for the toolchain version and components.
    - name: Install toolchain
      run: rustup toolchain install
    # Pushes to rust-main still run the Rust checks, which keeps this cache warm for PRs (a PR can only restore caches
    # saved on its own ref or on rust-main).
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --workspace --locked

    # The parity gate: every scenario against both apps. It runs on PRs only: a squash merge's tree already passed it
    # on the PR, and on rust-main the Test step above still fails at once on a stale recorded reference. The exit code
    # of `cargo xtask parity` is the gate; the HTML report is uploaded for humans and the parity reviewer.
    #
    # Python's side comes from the recorded references in parity/references/ unless the PR changed something Python
    # depends on. xtask decides the plan from the same path lists that decide whether a reference is fresh
    # (parity/README.md, "CI"):
    #   live-python=all   the Python app, the capture harness, a Python-backed test, a golden's files or this
    #                     workflow changed: every scenario runs Python live, then the Python-backed tests run;
    #   live-python=a,b   only these scenarios' references changed: they run Python live, which checks that the
    #                     recording reproduces here;
    #   live-python=none  no uv and no Python: Rust runs against the references.
    - name: Plan the parity run
      id: plan
      if: github.event_name == 'pull_request'
      run: cargo xtask parity --all --live-python-since HEAD^1 --plan >> "$GITHUB_OUTPUT"
    - uses: astral-sh/setup-uv@v7
      if: steps.plan.outcome == 'success' && steps.plan.outputs.live-python != 'none'
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
        python-version: "3.11"
    - name: Install the Python app
      id: sync
      if: steps.plan.outcome == 'success' && steps.plan.outputs.live-python != 'none'
      run: uv sync --frozen
    # Two jobs when every scenario runs Python live: four Textual apps on the runner's four cores start dropping and
    # misrouting keys (missed captures, timeouts that repeat on the retry). Rust-only and partial runs keep four.
    - name: Parity scenarios
      if: github.event_name == 'pull_request'
      env:
        PARITY_JOBS: ${{ steps.plan.outputs.live-python == 'all' && '2' || '4' }}
      run: cargo xtask parity --all --ci --no-sync --jobs "$PARITY_JOBS" --live-python-since HEAD^1
    # Runs even when the parity step fails, so a PR that breaks both reports both.
    - name: Python-backed integration tests
      if: ${{ !cancelled() && steps.plan.outputs.live-python == 'all' && steps.sync.outcome == 'success' }}
      run: cargo test --locked -p fake-gh -p xtask -p lazy-github-tui -p lazy-github-core -p lazy-github -- --ignored
    - name: Job summary
      if: ${{ always() && github.event_name == 'pull_request' }}
      shell: bash
      env:
        LIVE_PYTHON: ${{ steps.plan.outputs.live-python }}
      run: |
        if [ -n "$LIVE_PYTHON" ]; then
          printf 'Parity plan: %s\n\n' "\`live-python=$LIVE_PYTHON\`" >> "$GITHUB_STEP_SUMMARY"
        else
          printf 'Parity plan failed (see log).\n\n' >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f parity/reports/latest/summary.md ]; then
          cat parity/reports/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Parity harness produced no summary (see log)." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload report
      id: upload
      if: ${{ always() && github.event_name == 'pull_request' }}
      uses: actions/upload-artifact@v6
      with:
        name: parity-report-${{ matrix.os }}
        path: parity/reports/latest
        retention-days: 14
        if-no-files-found: warn
    - name: Link report
      if: always() && steps.upload.outputs.artifact-url != ''
      shell: bash
      run: echo "Report [parity-report-${{ matrix.os }}](${{ steps.upload.outputs.artifact-url }}); download and open index.html." >> "$GITHUB_STEP_SUMMARY"
