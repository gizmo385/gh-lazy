name: Rust checks

on:
  push:
    branches:
    - rust-main
  pull_request:
    # `rust/**` gives stacked PRs (a work branch based on another work branch) CI before their base merges.
    branches:
    - rust-main
    - 'rust/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to rust-main finish so each merge gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows joins in M5 (docs/rust-rewrite/PLAN.md §7).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    # rust-toolchain.toml is the single source of truth for the toolchain version and components.
    - name: Install toolchain
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --workspace --locked
