[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# Plain `cargo run` / `cargo build` target the app; CI uses `--workspace`.
default-members = ["crates/lazy-github"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/gizmo385/gh-lazy"
homepage = "https://github.com/gizmo385/gh-lazy"
authors = ["Chris (Gizmo) <gizmo385@users.noreply.github.com>"]
# The default, so fake-gh and xtask stay unpublishable; the three crates published to crates.io (#204) opt in.
publish = false

# Shared versions for the crates chosen in docs/rust-rewrite/PLAN.md §4. Declaring a dependency here doesn't build
# it; each crate opts in with `foo = { workspace = true }` only for what it uses.
[workspace.dependencies]
# Internal crates. The published ones pin the workspace version exactly, since the three only ever release together
# (#204): a version bump changes `[workspace.package] version` and these two lines, and `cargo xtask release-plan`
# fails a release whose pins don't match. fake-gh stays path-only: it's only a dev-dependency, which cargo strips on
# publish.
lazy-github-core = { path = "crates/lazy-github-core", version = "=0.1.0" }
lazy-github-tui = { path = "crates/lazy-github-tui", version = "=0.1.0" }
fake-gh = { path = "crates/fake-gh" }

# TUI
ratatui = "0.30"
crossterm = "0.29"
# `StreamExt` over crossterm's `EventStream` in the event loop (#72).
futures-util = { version = "0.3", default-features = false }
# Grapheme clusters and their cell widths for the shared width and truncation helpers (#327), the same crates and
# versions ratatui measures text with.
unicode-segmentation = "1.13"
unicode-width = "0.2"
# The multi-line editor's buffer (lines, cursor, selection, edits); the app draws it and maps Textual's keys (#256).
# `default-features = false`: no `crossterm` feature, since the app never calls `TextArea::input`.
ratatui-textarea = { version = "0.9", default-features = false }
# `default-features = false`: the markdown renderer (#215) uses only the event iterator, not the HTML writer.
pulldown-cmark = { version = "0.13", default-features = false }
# `default-features = false`: crates pick the pure-Rust regex engine (`regex-fancy`) rather than Oniguruma's C library.
syntect = { version = "5.3", default-features = false }
# bat's grammars, a superset of syntect's (TOML, Dockerfile, ...), for the diff viewer's file types (#237).
two-face = { version = "0.5", default-features = false }

# Runtime, serialization, CLI, errors
tokio = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps unknown config keys and `bindings.overrides` in file order across a load/save round trip.
serde_json = { version = "1", features = ["preserve_order"] }
# Dotted field paths (`issues.state_filter`) in config load errors.
serde_path_to_error = "0.1"
indexmap = { version = "2", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
form_urlencoded = "1"
# Fixture recipes for `cargo xtask record-fixtures`, and parity scenarios (`toml::Spanned` gives file:line errors).
toml = "1"
# Secret and email patterns in the fixture scrubber, and parity `wait.regex` steps.
regex = "1"
# Canonical HTTP reason phrases for fake-gh's `-i` status line.
http = "1"
color-eyre = "0.6"
# The global allocator on musl targets only (#357): musl's allocator misses the 50 ms frame budget on large bodies and
# diffs. It builds C code, so glibc, macOS and Windows keep the system allocator and `cargo install` needs no C
# compiler there. `default-features = false`: no `secure` hardening, which costs speed.
mimalloc = { version = "0.1.52", default-features = false }

# Logging
tracing = "0.1"
# `default-features = false` so crates opt into only the features they use (no `env-filter`, no `tracing-log`).
tracing-subscriber = { version = "0.3", default-features = false }
tracing-appender = "0.2"

# Platform integration
etcetera = "0.11"
# `$BROWSER` entries with `%s`, split as Python's `webbrowser` splits them (`lazy_github_core::browser`, #338).
shlex = "1"
open = "5"
arboard = "3"
jiff = "0.2"

# Testing and the parity harness
insta = "1"
rstest = "0.28"
assert_cmd = "2"
portable-pty = "0.9"
vt100 = "0.18"
# Per-run temp dirs in the parity harness.
tempfile = "3"
# Property tests that the markdown renderer, the diff parser and the width helpers take any text (#327).
proptest = { version = "1", default-features = false, features = ["std"] }
# Unified text diffs of the two apps' captures in the parity report (#69, #94).
similar = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch in an application workspace.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# The release workflow's builds (#203): `cargo build --profile dist`. Local `--release` builds and `cargo install` keep
# the default release profile.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
