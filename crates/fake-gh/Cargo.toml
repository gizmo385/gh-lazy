[package]
name = "fake-gh"
description = "Test double for the gh CLI that replays recorded fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# Not named `gh`: `target/debug/gh` would shadow the real gh for anyone with `target/debug` on `PATH`. The parity
# harness copies this binary to `<tmp>/bin/gh` instead.
[[bin]]
name = "fake-gh"
path = "src/main.rs"

# The SSH program git runs (`GIT_SSH`) in parity scenarios with a local remote; installed as `<run>/bin/fake-ssh`.
[[bin]]
name = "fake-ssh"
path = "src/bin/fake-ssh.rs"

# The browser `$BROWSER` names in parity runs: it logs the URLs the app opens. Installed as `<run>/bin/fake-browser`.
[[bin]]
name = "fake-browser"
path = "src/bin/fake-browser.rs"

[dependencies]
http = { workspace = true }
serde = { workspace = true }
# `preserve_order` keeps fixture bodies' key order when fake-gh re-serializes them.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
# Throwaway logs in the fake-browser tests.
tempfile = { workspace = true }
# tests/rust_client.rs drives the Rust app's `GhCli` against this binary.
lazy-github-core = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
