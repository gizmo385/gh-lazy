[package]
name = "lazy-github-core"
description = "Models, config and the gh client for LazyGithub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `github::FakeGithub`, for other crates' tests: enable it from their `[dev-dependencies]`.
test-util = []

[dependencies]
etcetera = { workspace = true }
form_urlencoded = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
# GitHub reference expansion in issue, PR and comment bodies (`references::expand`, #231).
regex = { workspace = true }
serde ={ workspace = true }
# `$BROWSER` entries with `%s` (`browser`, #338).
shlex = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "sync", "time"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std"] }

[dev-dependencies]
# Snapshots of the debug info (`debug`).
insta = { workspace = true }
# Arbitrary text for the never-panics tests (#327).
proptest = { workspace = true }
rstest = { workspace = true }
# The diff `config_goldens_are_fresh` prints for a stale golden.
similar = { workspace = true }
# Throwaway git repos for the `GitCli` tests.
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
