[package]
name = "lazy-github-tui"
description = "The ratatui user interface for LazyGithub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `test_util::TestApp` for UI tests, including other crates' tests: enable it from their `[dev-dependencies]`.
test-util = ["lazy-github-core/test-util"]

[dependencies]
color-eyre = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures-util = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
lazy-github-core = { workspace = true }
# The markdown renderer's parser (PLAN §4, #215).
pulldown-cmark = { workspace = true }
# Fence syntax colors (PLAN §4, #217): the bundled grammars, parsed with the pure-Rust regex engine.
syntect = { workspace = true, features = ["default-syntaxes", "regex-fancy"] }
# Hunk pane syntax colors (PLAN §4, #237): bat's grammars, a superset of syntect's, which the fences share.
two-face = { workspace = true, features = ["syntect-fancy"] }
ratatui = { workspace = true }
ratatui-textarea = { workspace = true }
# Python's `str.isprintable` by general category, for the table search's `repr` of a row (#101).
regex = { workspace = true }
# The list sections' cache bounds (`Serialize + DeserializeOwned`) on their items (#228).
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "signal", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
lazy-github-core = { workspace = true, features = ["test-util"] }
rstest = { workspace = true }
serde_json = { workspace = true }
# The diff `bindings_goldens_are_fresh` prints for a stale golden.
similar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
# What a terminal makes of the bytes `backend::WideEmojiBackend` writes (#249).
vt100 = { workspace = true }

[lints]
workspace = true
