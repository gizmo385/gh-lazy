# Ansi Light: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Ansi Light"
appearance = "light"
terminal_colors = true

[surface]
screen = "default"
pane = "transparent"
header = "transparent"
raised = "transparent"
dialog = "transparent"
card = "transparent"
boost = "transparent"
scrim = "transparent"
focus_tint = "default"
hatch = "transparent"

[text]
normal = "default"
plain = "default"
muted = "default"
disabled = "default"
primary = "ansi:blue"
secondary = "ansi:cyan"
accent = "ansi:magenta"
success = "ansi:green"
warning = "ansi:bright-red"
error = "ansi:red"

[brand]
primary = "ansi:blue"
secondary = "ansi:cyan"
accent = "ansi:magenta"

[status]
success = "ansi:green"
warning = "ansi:bright-red"
error = "ansi:red"

[border]
pane_focused = "ansi:green"
section_title = "ansi:blue"
field_focused = "ansi:blue"
field = "ansi:white"
rule = "ansi:cyan"
status_bar = "ansi:cyan"
dialog = "default"
emphasis = "ansi:magenta"
conversation = "default"
review = "ansi:green"
help = "ansi:black"

[cursor]
hover_bg = "ansi:white"

[cursor.focused]
fg = "ansi:bright-white"
bg = "ansi:blue"
style = "bold"

[cursor.blurred]
fg = "default"
bg = "default"
style = "none"

[scrollbar]
thumb = "ansi:bright-blue"
track = "ansi:white"
corner = "default"

[input]
placeholder = "default"
placeholder_style = "dim"
invalid = "ansi:red"
invalid_blurred = "ansi:red"
terminal_colors = true

[input.cursor]
fg = "ansi:black"
bg = "ansi:white"
style = "none"

[input.editor_cursor]
fg = "ansi:black"
bg = "ansi:bright-white"
style = "reverse"

[input.selection]
fg = "ansi:white"
bg = "ansi:cyan"

[footer]
bar = "default"
item = "default"
hover = "ansi:white"

[footer.key]
fg = "ansi:magenta"
bg = "transparent"

[footer.description]
fg = "default"
bg = "default"

[button]
outlined = true
focus_style = "bold reverse"
disabled_border = "ansi:white"

[button.default]
bg = "transparent"
light = "transparent"
dark = "transparent"
border = "ansi:white"
label = "default"
label_disabled = "default"

[button.primary]
bg = "ansi:blue"
light = "ansi:blue"
dark = "ansi:blue"
border = "ansi:blue"
label = "ansi:blue"
label_disabled = "ansi:blue"

[button.success]
bg = "ansi:green"
light = "ansi:green"
dark = "ansi:green"
border = "ansi:green"
label = "ansi:green"
label_disabled = "ansi:green"

[button.warning]
bg = "ansi:bright-red"
light = "ansi:bright-red"
dark = "ansi:bright-red"
border = "ansi:bright-red"
label = "ansi:bright-red"
label_disabled = "ansi:bright-red"

[button.error]
bg = "ansi:red"
light = "ansi:red"
dark = "ansi:red"
border = "ansi:red"
label = "ansi:red"
label_disabled = "ansi:red"

[switch]
track = "transparent"
on = "ansi:green"
off = "ansi:blue"

[select]
muted = "default"
terminal_colors = true

[checkbox]
bg = "transparent"
off = "transparent"
on = "ansi:green"

[tree]
guide = "ansi:white"
guide_focused = "ansi:white"
guide_selected = "ansi:blue"

[tabs]
label = "default"
label_style = "dim"
label_active = "default"
label_active_style = "bold"
bar = "ansi:white"
bar_focused = "ansi:white"
bar_active = "ansi:blue"

[markdown]
fence_bg = "transparent"
fence_inset = false
code = "ansi:red"
code_bg = "transparent"
quote_bg = "transparent"
quote_bar = "ansi:cyan"
bullet = "ansi:cyan"
table_bg = "#FFFFFF 30%"
table_header = "ansi:blue"
table_line = "default"

[markdown.h1]
fg = "ansi:magenta"
bg = "transparent"
style = "bold"

[markdown.h2]
fg = "ansi:bright-blue"
bg = "transparent"
style = "underline"

[markdown.h3]
fg = "ansi:blue"
bg = "transparent"
style = "none"

[markdown.h4]
fg = "ansi:cyan"
bg = "transparent"
style = "bold"

[markdown.h5]
fg = "ansi:cyan"
bg = "transparent"
style = "none"

[markdown.h6]
fg = "ansi:cyan"
bg = "transparent"
style = "underline"

[markdown.link]
fg = "ansi:blue"
style = "underline"

[syntax]
text = "default"

[syntax.comment]
fg = "none"
bg = "none"
style = "dim italic"

[syntax.error]
fg = "none"
bg = "none"
style = "none"

[syntax.generic_strong]
fg = "none"
bg = "none"
style = "bold"

[syntax.generic_emph]
fg = "none"
bg = "none"
style = "italic"

[syntax.generic_heading]
fg = "ansi:blue"
bg = "none"
style = "underline"

[syntax.generic_subheading]
fg = "ansi:blue"
bg = "none"
style = "none"

[syntax.keyword]
fg = "ansi:magenta"
bg = "none"
style = "bold"

[syntax.keyword_constant]
fg = "ansi:cyan"
bg = "none"
style = "none"

[syntax.keyword_namespace]
fg = "ansi:magenta"
bg = "none"
style = "none"

[syntax.number]
fg = "ansi:blue"
bg = "none"
style = "bold"

[syntax.string]
fg = "none"
bg = "none"
style = "none"

[syntax.string_backtick]
fg = "ansi:bright-black"
bg = "none"
style = "none"

[syntax.string_doc]
fg = "ansi:green"
bg = "none"
style = "italic"

[syntax.string_double]
fg = "ansi:green"
bg = "none"
style = "none"

[syntax.name]
fg = "default"
bg = "none"
style = "none"

[syntax.name_attribute]
fg = "none"
bg = "none"
style = "none"

[syntax.name_builtin]
fg = "ansi:cyan"
bg = "none"
style = "none"

[syntax.name_builtin_pseudo]
fg = "none"
bg = "none"
style = "italic"

[syntax.name_class]
fg = "ansi:blue"
bg = "none"
style = "bold"

[syntax.name_constant]
fg = "ansi:red"
bg = "none"
style = "none"

[syntax.name_decorator]
fg = "ansi:blue"
bg = "none"
style = "bold"

[syntax.name_function]
fg = "ansi:blue"
bg = "none"
style = "none"

[syntax.name_tag]
fg = "ansi:blue"
bg = "none"
style = "bold"

[syntax.name_variable]
fg = "default"
bg = "none"
style = "none"

[syntax.operator]
fg = "default"
bg = "none"
style = "none"

[syntax.operator_word]
fg = "ansi:magenta"
bg = "none"
style = "none"

[syntax.plain]
fg = "none"
bg = "none"
style = "none"

[marks]
positive = "#ADFF2F"
negative = "#FF0000"
merged = "#DA70D6"
pending = "#FFFF00"
running = "#00FFFF"
warning = "#FFFF00"
name = "#ADFF2F"
count_added = "#ADFF2F"
count_removed = "#FF0000"
auth_border = "#FF0000"
auth_command = "#008000"
starred = "ansi:green"
job_failed = "ansi:red"
job_pending = "ansi:yellow"
job_running = "ansi:cyan"

[diff]
added_bg = "#0A3A0A"
removed_bg = "#3A0A0A"
added_current_bg = "#006400"
removed_current_bg = "#8B0000"
context_current_bg = "ansi:yellow"
stat_added = "ansi:green"
stat_removed = "ansi:red"
border_focused = "ansi:magenta"
border = "ansi:blue"
review_body = "transparent"
review_comment_border = "ansi:cyan"

[diff.indicator]
fg = "default"
bg = "ansi:magenta"

[diff.review_header]
fg = "default"
bg = "ansi:magenta"
style = "bold"

[command_palette]
band = "transparent"
input_rule = "#000000 50%"
list_rule = "#000000"
icon = "#000000"

[command_palette.highlight]
fg = "ansi:bright-white"
bg = "ansi:blue"
style = "bold"

[hints.label]
fg = "#000000"
bg = "ansi:bright-red"
style = "bold"

[table.header]
fg = "default"
bg = "ansi:bright-blue"

[disabled]
dimmed = true

[screenshot]
default_fg = "#1E1E1E"
default_bg = "#FFFFFF"
