[input.cursor]
fg = "#282C34"
bg = "#ABB2BF"
style = "none"

[input.editor_cursor]
fg = "#282C34"
bg = "#ABB2BF"
style = "none"

[input.selection]
fg = "#ABB2BF"
bg = "#77C3FF 40%"

[footer]
