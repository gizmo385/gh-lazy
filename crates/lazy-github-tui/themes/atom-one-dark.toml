# Atom One Dark: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Atom One Dark"
appearance = "dark"
terminal_colors = false

[surface]
screen = "#282C34"
pane = "#3B414D"
header = "#4F5666"
raised = "#616878"
dialog = "#707684"
card = "#4C525E"
boost = "#000000 0%"
scrim = "#282C34 60%"
focus_tint = "#ABB2BF 5%"
hatch = "#4F5666"

[text]
normal = "auto 87%"
plain = "#ABB2BF"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#96CAF4"
secondary = "#D9A5E8"
accent = "#C2A5D6"
success = "#97F597"
warning = "#E9CC92"
error = "#F59797"

[brand]
primary = "#61AFEF"
secondary = "#C678DD"
accent = "#A378C2"

[status]
