# Atom One Light, from its upstream palette (#392): https://github.com/atom/atom
# (packages/one-light-syntax/styles/colors.less) and https://github.com/atom/one-light-ui
# (styles/ui-variables-custom.less).
# Surfaces: screen level-3, pane level-2, header border, card level-1, raised level-1, dialog level-1.
# Text: normal and plain mono-1, muted mono-2, disabled mono-3.
# Seeds (brand, status and text colors): primary blue, secondary purple, accent cyan, success green, warning orange-2,
# error red-1.
# Syntax: keyword purple, string green, number orange-1, constant orange-1, function blue, type orange-2, variable
# red-1, name mono-1, builtin cyan, attribute orange-1, decorator blue, tag red-1, namespace purple, operator word
# purple, comment mono-3.
# Diff lines: success and error at 15% over the pane, 25% for the current line. The other shades (buttons, scrollbars,
# guides) are Textual 8.2.5's, derived from these seeds. The marks and diff stats are the app's own colors.
# Every role is required; what each one is for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax
# in src/theme/file.rs.
display_name = "Atom One Light"
appearance = "light"
terminal_colors = false

[surface]
screen = "#EAEAEB"
pane = "#FAFAFA"
header = "#DBDBDC"
raised = "#FFFFFF"
dialog = "#FFFFFF"
card = "#FFFFFF"
boost = "#000000 0%"
scrim = "#EAEAEB 60%"
