# Atom One Light: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Atom One Light"
appearance = "light"
terminal_colors = false

[surface]
screen = "#FAFAFA"
pane = "#E0E0E0"
header = "#CCCCCC"
raised = "#E1E1E1"
dialog = "#FFFFFF"
card = "#F5F5F5"
boost = "#000000 0%"
scrim = "#FAFAFA 60%"
focus_tint = "#383A42 5%"
hatch = "#CCCCCC"

[text]
normal = "auto 87%"
plain = "#383A42"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#2A4F9F"
secondary = "#6D196C"
accent = "#7E6021"
success = "#479F29"
warning = "#8E8F24"
error = "#9F2929"

[brand]
primary = "#4078F2"
secondary = "#A626A4"
accent = "#BE9232"

[status]
success = "#6BF23F"
warning = "#D7D938"
error = "#F13F3F"

[border]
pane_focused = "#6BF23F"
section_title = "#8DB2FF"
field_focused = "#4078F2"
field = "#D8D8D8"
rule = "#A626A4"
status_bar = "#A626A4"
dialog = "#FAFAFA 80%"
emphasis = "#BE9232"
conversation = "#A626A4"
review = "#B2FF80"
help = "#383A42 30%"

[cursor]
hover_bg = "#00000019"

[cursor.focused]
fg = "auto 87%"
bg = "#4078F2"
style = "bold"

[cursor.blurred]
fg = "#383A42"
bg = "#4078F24C"
style = "none"

[scrollbar]
thumb = "#A2B8E9"
track = "#E4E4E4"
corner = "#E4E4E4"

[input]
placeholder = "auto 38%"
placeholder_style = "none"
invalid = "#F13F3F"
invalid_blurred = "#F13F3F 60%"
terminal_colors = false

[input.cursor]
fg = "#FAFAFA"
bg = "#383A42"
style = "none"

[input.editor_cursor]
fg = "auto 78.3%"
bg = "#383A42 70%"
style = "none"

[input.selection]
fg = "#383A42"
bg = "#5C8AFF 40%"

[footer]
bar = "#CCCCCC"
item = "transparent"
hover = "#00000019"

[footer.key]
fg = "#BF9232"
bg = "transparent"

[footer.description]
fg = "#383A42"
bg = "transparent"

[button]
outlined = false
focus_style = "bold reverse"
disabled_border = "#D8D8D8"

[button.default]
bg = "#E0E0E0"
light = "#F5F5F5"
dark = "#CACACA"
border = "#D8D8D8"
label = "#383A42"
label_disabled = "#383A42 60%"

[button.primary]
bg = "#4078F2"
light = "#8DB2FF"
dark = "#0043B1"
border = "#4078F2"
label = "auto 87%"
label_disabled = "auto 52.2%"

[button.success]
bg = "#6BF23F"
light = "#9BFF6B"
dark = "#05B100"
border = "#6BF23F"
label = "auto 87%"
label_disabled = "auto 52.2%"

[button.warning]
bg = "#D7D938"
light = "#FFFF64"
dark = "#969B00"
border = "#D7D938"
label = "auto 87%"
label_disabled = "auto 52.2%"

[button.error]
bg = "#F13F3F"
light = "#FF6C62"
dark = "#A9000D"
border = "#F13F3F"
label = "auto 87%"
label_disabled = "auto 52.2%"

[switch]
track = "#A3A3A3"
on = "#6BF23F"
off = "#4078F2 15%"

[select]
muted = "#383A42 50%"
terminal_colors = false

[checkbox]
bg = "#CCCCCC"
off = "#A3A3A3"
on = "#479F29"

[tree]
guide = "#CACACA"
guide_focused = "#CACACA"
guide_selected = "#4078F2"

[tabs]
label = "#383A42 50%"
label_style = "none"
label_active = "#383A42"
label_active_style = "none"
bar = "#383A42 10%"
bar_focused = "#383A42 30%"
bar_active = "#4078F2"

[markdown]
fence_bg = "#FFFFFF 30%"
fence_inset = true
code = "#9F2929 95%"
code_bg = "#F13F3F 5%"
quote_bg = "#000000 0%"
quote_bar = "#6D196C"
bullet = "#6D196C"
table_bg = "#FFFFFF 30%"
table_header = "#4078F2"
table_line = "#383A42 20%"

[markdown.h1]
