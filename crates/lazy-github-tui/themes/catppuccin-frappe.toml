pane = "#414559"
header = "#51576D"
raised = "#63697F"
dialog = "#777B91"
card = "#52566B"
boost = "#000000 0%"
scrim = "#303446 60%"
focus_tint = "#C6D0F5 5%"
hatch = "#51576D"

[text]
normal = "auto 87%"
plain = "#C6D0F5"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#DCBEEE"
secondary = "#F4BFA4"
accent = "#F7D0ED"
success = "#C4E0B1"
warning = "#EDDAB5"
error = "#EFACAD"

[brand]
primary = "#CA9EE6"
secondary = "#EE9F76"
accent = "#F4B8E4"

[status]
