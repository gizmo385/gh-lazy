# Catppuccin Latte: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Catppuccin Latte"
appearance = "light"
terminal_colors = false

[surface]
screen = "#EFF1F5"
pane = "#E6E9EF"
header = "#CCD0DA"
raised = "#E1E5EF"
dialog = "#FFFFFF"
card = "#FBFEFF"
boost = "#000000 0%"
scrim = "#EFF1F5 60%"
focus_tint = "#4C4F69 5%"
hatch = "#CCD0DA"

[text]
normal = "auto 87%"
plain = "#4C4F69"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#59259D"
secondary = "#915B4F"
accent = "#A74207"
success = "#2A691C"
warning = "#935D13"
error = "#8A0925"

[brand]
primary = "#8839EF"
secondary = "#DB8A78"
accent = "#FD640B"

[status]
