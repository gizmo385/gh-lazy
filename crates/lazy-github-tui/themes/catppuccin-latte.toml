# Catppuccin Latte, from its upstream palette (#392): https://github.com/catppuccin/palette (palette.json) and the
# style guide, https://github.com/catppuccin/catppuccin/blob/main/docs/style-guide.md.
# Surfaces: screen mantle, pane base, header surface0, card surface0, raised surface0, dialog surface0.
# Text: normal and plain text, muted subtext0, disabled overlay1.
# Seeds (brand, status and text colors): primary mauve, secondary peach, accent pink, success green, warning yellow,
# error red.
# Syntax: keyword mauve, string green, number peach, constant peach, function blue, type yellow, variable text, name
# text, builtin red, attribute yellow, decorator yellow, tag blue, namespace mauve, operator word mauve, comment
# overlay2.
# Diff lines: success and error at 15% over the pane, 25% for the current line. The other shades (buttons, scrollbars,
# guides) are Textual 8.2.5's, derived from these seeds. The marks and diff stats are the app's own colors.
# Every role is required; what each one is for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax
# in src/theme/file.rs.
display_name = "Catppuccin Latte"
appearance = "light"
terminal_colors = false

[surface]
screen = "#E6E9EF"
pane = "#EFF1F5"
header = "#CCD0DA"
raised = "#CCD0DA"
dialog = "#CCD0DA"
card = "#CCD0DA"
boost = "#000000 0%"
scrim = "#E6E9EF 60%"
focus_tint = "#4C4F69 5%"
hatch = "#CCD0DA"

[text]
