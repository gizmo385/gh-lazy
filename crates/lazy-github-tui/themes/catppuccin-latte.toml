plain = "#4C4F69"
muted = "#6C6F85"
disabled = "#8C8FA1"
primary = "#8839EF"
secondary = "#FE640B"
accent = "#EA76CB"
success = "#40A02B"
warning = "#DF8E1D"
error = "#D20F39"

