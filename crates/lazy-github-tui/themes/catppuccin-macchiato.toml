raised = "#5A5E76"
dialog = "#6B6F86"
card = "#474B60"
boost = "#000000 0%"
scrim = "#24273A 60%"
focus_tint = "#CAD3F5 5%"
hatch = "#494D64"

[text]
normal = "auto 87%"
plain = "#CAD3F5"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#D9C0F9"
secondary = "#F8C6AA"
accent = "#F8D3EE"
success = "#C4E6B9"
warning = "#F3E2BF"
error = "#F3AFB9"

[brand]
