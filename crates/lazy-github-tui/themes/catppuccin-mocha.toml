terminal_colors = false

[input.cursor]
fg = "#11111B"
bg = "#F5E0DC"
style = "none"

[input.editor_cursor]
fg = "#11111B"
bg = "#F5E0DC"
style = "none"

[input.selection]
fg = "#CDD6F4"
bg = "#9399B2 30%"

[footer]
