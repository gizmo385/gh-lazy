# Catppuccin Mocha: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Catppuccin Mocha"
appearance = "dark"
terminal_colors = false

[surface]
screen = "#181825"
pane = "#313244"
header = "#45475A"
raised = "#56586C"
dialog = "#65667A"
card = "#414255"
boost = "#000000 0%"
scrim = "#181825 60%"
focus_tint = "#CDD6F4 5%"
hatch = "#45475A"

[text]
normal = "auto 87%"
plain = "#CDD6F4"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#F8D6EF"
secondary = "#DCC4F9"
accent = "#FBCCAF"
success = "#C7F0CC"
warning = "#FBECCA"
error = "#F6B5C8"

[brand]
primary = "#F5C2E7"
secondary = "#CBA6F7"
accent = "#F9B387"

[status]
success = "#ABE9B3"
warning = "#FAE3B0"
error = "#F28FAD"

[border]
pane_focused = "#ABE9B3"
section_title = "#FFFFFF"
field_focused = "#B4BEFE"
field = "#585B70"
rule = "#CBA6F7"
