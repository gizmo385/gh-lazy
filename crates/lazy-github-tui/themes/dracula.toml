# Dracula: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Dracula"
appearance = "dark"
terminal_colors = false

[surface]
screen = "#282A36"
pane = "#2B2E3B"
header = "#313442"
raised = "#414453"
dialog = "#5E6170"
card = "#3B3E4C"
boost = "#000000 0%"
scrim = "#282A36 60%"
focus_tint = "#F8F8F2 5%"
hatch = "#313442"

[text]
normal = "auto 87%"
plain = "#F8F8F2"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#D3B7FB"
secondary = "#97A1C2"
accent = "#FFA6D9"
success = "#8BFBA7"
warning = "#FFD09D"
error = "#FF8E8E"

[brand]
primary = "#BD93F9"
secondary = "#6272A4"
accent = "#FF79C6"

[status]
success = "#50FA7B"
warning = "#FEB86C"
error = "#FE5555"

[border]
pane_focused = "#50FA7B"
section_title = "#FED0FF"
field_focused = "#BD93F9"
field = "#252835"
rule = "#6272A4"
status_bar = "#6272A4"
dialog = "#282A36 80%"
emphasis = "#FF79C6"
conversation = "#4F5261"
review = "#9BFFB8"
help = "#F8F8F2 30%"

[cursor]
hover_bg = "#00000019"

[cursor.focused]
fg = "auto 87%"
bg = "#BD93F9"
style = "bold"

[cursor.blurred]
fg = "#F8F8F2"
bg = "#BD93F94C"
style = "none"

[scrollbar]
thumb = "#5A4A79"
track = "#181A25"
corner = "#181A25"

[input]
placeholder = "auto 38%"
placeholder_style = "none"
invalid = "#FE5555"
invalid_blurred = "#FE5555 60%"
terminal_colors = false

[input.cursor]
fg = "#282A36"
bg = "#F8F8F2"
style = "none"

[input.editor_cursor]
fg = "#282A36"
bg = "#F8F8F2"
style = "none"

[input.selection]
fg = "#F8F8F2"
bg = "#D2A7FF 40%"

[footer]
bar = "#313442"
item = "transparent"
hover = "#00000019"

[footer.key]
fg = "#FF79C6"
bg = "transparent"

[footer.description]
fg = "#F8F8F2"
bg = "transparent"

[button]
outlined = false
focus_style = "bold reverse"
disabled_border = "#252835"

[button.default]
bg = "#2B2E3B"
light = "#3B3E4C"
dark = "#1B1E2A"
border = "#252835"
label = "#F8F8F2"
label_disabled = "#F8F8F2 60%"

[button.primary]
bg = "#BD93F9"
light = "#FED0FF"
dark = "#7E59B9"
border = "#BD93F9"
label = "#282A36"
label_disabled = "#282A36 60%"

[button.success]
bg = "#50FA7B"
light = "#83FFA3"
dark = "#00B83F"
border = "#50FA7B"
label = "#282A36"
label_disabled = "#282A36 60%"

[button.warning]
bg = "#FEB86C"
light = "#FFE193"
dark = "#BB7C33"
border = "#FEB86C"
label = "#282A36"
label_disabled = "#282A36 60%"

[button.error]
bg = "#FE5555"
light = "#FF807A"
dark = "#B70022"
border = "#FE5555"
label = "#282A36"
label_disabled = "#282A36 60%"

[switch]
track = "#111421"
on = "#50FA7B"
off = "#313442"

[select]
muted = "#F8F8F2 50%"
terminal_colors = false

[checkbox]
bg = "#313442"
off = "#111421"
on = "#8BFBA7"

[tree]
