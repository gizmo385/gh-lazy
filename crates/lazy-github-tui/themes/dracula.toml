# Dracula, from its upstream palette (#392): https://draculatheme.com/spec (Dracula Classic, palette and UI colors).
# Surfaces: screen bg-dark, pane background, header bg-light, card bg-light, raised bg-lighter, dialog bg-light.
# Text: normal and plain foreground, muted comment, disabled comment.
# Seeds (brand, status and text colors): primary purple, secondary comment, accent pink, success green, warning
# orange, error red.
# Syntax: keyword pink, string yellow, number orange, constant purple, function green, type cyan, variable foreground,
# name foreground, builtin cyan, attribute green, decorator green, tag pink, namespace pink, operator word pink,
# comment comment.
# Diff lines: success and error at 15% over the pane, 25% for the current line. The other shades (buttons, scrollbars,
# guides) are Textual 8.2.5's, derived from these seeds. The marks and diff stats are the app's own colors.
# Every role is required; what each one is for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax
# in src/theme/file.rs.
display_name = "Dracula"
appearance = "dark"
terminal_colors = false

