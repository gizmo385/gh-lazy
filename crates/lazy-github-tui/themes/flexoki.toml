# Flexoki, from its upstream palette (#392): https://stephango.com/flexoki and https://github.com/kepano/flexoki
# (dark: base colors and the 400 accents).
# Surfaces: screen black, pane bg-2, header ui, card ui, raised ui-2, dialog ui.
# Text: normal and plain tx, muted tx-2, disabled tx-3.
# Seeds (brand, status and text colors): primary blue, secondary cyan, accent purple, success green, warning yellow,
# error red.
# Syntax: keyword green, string cyan, number orange, constant orange, function orange, type yellow, variable tx, name
# tx, builtin red, attribute blue, decorator blue, tag blue, namespace yellow, operator word green, comment tx-3.
# Diff lines: success and error at 15% over the pane, 25% for the current line. The other shades (buttons, scrollbars,
# guides) are Textual 8.2.5's, derived from these seeds. The marks and diff stats are the app's own colors.
# Every role is required; what each one is for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax
# in src/theme/file.rs.
display_name = "Flexoki"
appearance = "dark"
terminal_colors = false

