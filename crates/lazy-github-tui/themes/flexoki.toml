# Flexoki: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Flexoki"
appearance = "dark"
terminal_colors = false

[surface]
screen = "#100F0F"
pane = "#1C1B1A"
header = "#282726"
raised = "#383736"
dialog = "#4D4B4A"
card = "#2B2A29"
boost = "#000000 0%"
scrim = "#100F0F 60%"
focus_tint = "#FFFCF0 5%"
hatch = "#282726"

[text]
normal = "auto 87%"
plain = "#FFFCF0"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#6B94C4"
secondary = "#6EADA7"
accent = "#BDA4DA"
success = "#9AAB5D"
warning = "#C8AD57"
error = "#CA7671"

[brand]
primary = "#205EA6"
secondary = "#24837B"
accent = "#9B76C8"

[status]
success = "#65800B"
warning = "#AC8301"
error = "#AE3029"

[border]
pane_focused = "#65800B"
section_title = "#6996E4"
field_focused = "#205EA6"
field = "#171614"
rule = "#24837B"
status_bar = "#24837B"
dialog = "#100F0F 80%"
emphasis = "#9B76C8"
conversation = "#364140"
review = "#A3BB4C"
help = "#FFFCF0 30%"

[cursor]
hover_bg = "#00000019"

[cursor.focused]
fg = "auto 87%"
bg = "#205EA6"
style = "bold"

[cursor.blurred]
fg = "#FFFCF0"
bg = "#205EA64C"
style = "none"

[scrollbar]
thumb = "#0C2542"
track = "#000000"
corner = "#000000"

[input]
placeholder = "auto 38%"
placeholder_style = "none"
invalid = "#AE3029"
invalid_blurred = "#AE3029 60%"
terminal_colors = false

[input.cursor]
fg = "#5E409D"
bg = "#FFFCF0"
style = "none"

[input.editor_cursor]
fg = "#5E409D"
bg = "#FFFCF0"
style = "none"

[input.selection]
fg = "#FFFCF0"
bg = "#6F6E69 35%"

[footer]
bar = "#282726"
item = "transparent"
hover = "#00000019"

[footer.key]
fg = "#9B76C8"
bg = "transparent"

[footer.description]
fg = "#FFFCF0"
bg = "transparent"

[button]
outlined = false
focus_style = "bold reverse"
disabled_border = "#171614"

[button.default]
bg = "#1C1B1A"
light = "#2B2A29"
dark = "#0A0806"
border = "#171614"
label = "#FFFCF0"
label_disabled = "#FFFCF0 60%"

[button.primary]
bg = "#205EA6"
light = "#6996E4"
dark = "#002B6B"
border = "#205EA6"
label = "#FFFCF0"
label_disabled = "#FFFCF0 60%"

[button.success]
bg = "#65800B"
light = "#8EA738"
dark = "#2D4800"
border = "#65800B"
label = "#FFFCF0"
label_disabled = "#FFFCF0 60%"

[button.warning]
bg = "#AC8301"
light = "#D9AA37"
dark = "#6C4C00"
border = "#AC8301"
label = "#FFFCF0"
label_disabled = "#FFFCF0 60%"

[button.error]
bg = "#AE3029"
light = "#DD594B"
dark = "#6B0000"
border = "#AE3029"
label = "#FFFCF0"
label_disabled = "#FFFCF0 60%"

[switch]
track = "#040200"
on = "#65800B"
off = "#282726"

[select]
muted = "#FFFCF0 50%"
terminal_colors = false

[checkbox]
bg = "#282726"
off = "#040200"
on = "#9AAB5D"

[tree]
guide = "#3B3A39"
guide_focused = "#4D4B4A"
guide_selected = "#205EA6"

[tabs]
label = "#FFFCF0 50%"
label_style = "none"
label_active = "#FFFCF0"
label_active_style = "none"
bar = "#FFFCF0 10%"
bar_focused = "#FFFCF0 30%"
bar_active = "#205EA6"

[markdown]
fence_bg = "#000000 10%"
fence_inset = true
code = "#C8AD57 95%"
code_bg = "#AC8301 10%"
quote_bg = "#000000 0%"
quote_bar = "#6B94C4 50%"
bullet = "#6B94C4"
table_bg = "transparent"
table_header = "#205EA6"
table_line = "#FFFCF0 20%"

[markdown.h1]
