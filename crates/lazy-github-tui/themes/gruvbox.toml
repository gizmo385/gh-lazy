bg = "none"
style = "none"

[syntax.name_builtin]
fg = "#FBD375"
bg = "none"
style = "none"

[syntax.name_builtin_pseudo]
fg = "none"
bg = "none"
style = "italic"

[syntax.name_class]
fg = "#FEAB67"
bg = "none"
style = "bold"

[syntax.name_constant]
fg = "#FC8679"
bg = "none"
style = "none"

[syntax.name_decorator]
fg = "#AEC3BB"
bg = "none"
style = "bold"

[syntax.name_function]
