[marks]
positive = "#ADFF2F"
negative = "#FF0000"
merged = "#DA70D6"
pending = "#FFFF00"
running = "#00FFFF"
warning = "#FFFF00"
name = "#ADFF2F"
count_added = "#ADFF2F"
count_removed = "#FF0000"
auth_border = "#FF0000"
