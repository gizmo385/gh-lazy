# Gruvbox: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Gruvbox"
appearance = "dark"
terminal_colors = false

[surface]
screen = "#282828"
pane = "#3C3836"
header = "#504945"
raised = "#615A56"
dialog = "#716C6A"
card = "#4D4846"
boost = "#000000 0%"
scrim = "#282828 60%"
focus_tint = "#FBF1C7 5%"
hatch = "#504945"

[text]
normal = "auto 87%"
plain = "#FBF1C7"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#AEC3BB"
secondary = "#C5BCAE"
accent = "#FBD375"
success = "#D0D26F"
warning = "#FEAB67"
error = "#FC8679"

[brand]
primary = "#85A598"
secondary = "#A89A85"
accent = "#F9BD2F"

[status]
success = "#B7BB26"
warning = "#FD8019"
error = "#FA4934"

[border]
pane_focused = "#B7BB26"
section_title = "#C1E3D5"
field_focused = "#85A598"
field = "#363230"
rule = "#A89A85"
status_bar = "#A89A85"
dialog = "#282828 80%"
emphasis = "#F9BD2F"
conversation = "#585653"
review = "#FAFA68"
help = "#FBF1C7 30%"

[cursor]
hover_bg = "#00000019"

[cursor.focused]
fg = "#FBF1C7"
bg = "#85A598"
style = "bold"

[cursor.blurred]
fg = "#FBF1C7"
bg = "#85A5984C"
style = "none"

[scrollbar]
thumb = "#43504B"
track = "#181818"
corner = "#181818"

[input]
placeholder = "auto 38%"
placeholder_style = "none"
invalid = "#FA4934"
invalid_blurred = "#FA4934 60%"
terminal_colors = false

[input.cursor]
fg = "#282828"
bg = "#FBF1C7"
style = "none"

[input.editor_cursor]
fg = "#282828"
bg = "#FBF1C7"
style = "none"

[input.selection]
fg = "#FBF1C7"
bg = "#689D6A40"

[footer]
bar = "#504945"
item = "transparent"
hover = "#00000019"

[footer.key]
fg = "#FABD2F"
bg = "transparent"

[footer.description]
fg = "#FBF1C7"
bg = "transparent"

[button]
outlined = false
focus_style = "bold reverse"
disabled_border = "#363230"

[button.default]
bg = "#3C3836"
light = "#4D4846"
dark = "#2B2725"
border = "#363230"
label = "#FBF1C7"
label_disabled = "#FBF1C7 60%"

[button.primary]
bg = "#85A598"
light = "#C1E3D5"
dark = "#4C6A5F"
border = "#85A598"
label = "#282828"
label_disabled = "#282828 60%"

[button.success]
bg = "#B7BB26"
light = "#E4E453"
dark = "#777F00"
border = "#B7BB26"
label = "#282828"
label_disabled = "#282828 60%"

[button.warning]
bg = "#FD8019"
light = "#FFA845"
dark = "#B54500"
border = "#FD8019"
label = "#282828"
label_disabled = "#282828 60%"

[button.error]
bg = "#FA4934"
light = "#FF7558"
dark = "#B10000"
border = "#FA4934"
label = "#282828"
label_disabled = "#282828 60%"

[switch]
track = "#2E2724"
on = "#B7BB26"
off = "#504945"

[select]
muted = "#FBF1C7 50%"
terminal_colors = false

[checkbox]
bg = "#504945"
off = "#2E2724"
on = "#D0D26F"

[tree]
guide = "#5F5A58"
guide_focused = "#716C6A"
guide_selected = "#85A598"

[tabs]
label = "#FBF1C7 50%"
label_style = "none"
label_active = "#FBF1C7"
label_active_style = "none"
bar = "#FBF1C7 10%"
bar_focused = "#FBF1C7 30%"
bar_active = "#85A598"

[markdown]
fence_bg = "#000000 10%"
fence_inset = true
code = "#FEAB67 95%"
code_bg = "#FD8019 10%"
quote_bg = "#000000 0%"
quote_bar = "#AEC3BB 50%"
bullet = "#AEC3BB"
table_bg = "transparent"
table_header = "#85A598"
table_line = "#FBF1C7 20%"

[markdown.h1]
fg = "#85A598"
bg = "transparent"
style = "bold"

[markdown.h2]
fg = "#85A598"
bg = "transparent"
style = "underline"

[markdown.h3]
fg = "#85A598"
bg = "transparent"
style = "bold"

[markdown.h4]
