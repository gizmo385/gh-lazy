# Gruvbox, from its upstream palette (#392): https://github.com/morhetz/gruvbox (colors/gruvbox.vim, dark, medium
# contrast).
# Surfaces: screen bg0, pane bg1, header bg2, card bg2, raised bg2, dialog bg3.
# Text: normal and plain fg1, muted fg4, disabled gray.
# Seeds (brand, status and text colors): primary blue, secondary fg4, accent yellow, success green, warning orange,
# error red.
# Syntax: keyword red, string green, number purple, constant purple, function green, type yellow, variable blue, name
# fg1, builtin orange, attribute yellow, decorator aqua, tag aqua, namespace aqua, operator word red, comment gray.
# Diff lines: success and error at 15% over the pane, 25% for the current line. The other shades (buttons, scrollbars,
# guides) are Textual 8.2.5's, derived from these seeds. The marks and diff stats are the app's own colors.
# Every role is required; what each one is for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax
# in src/theme/file.rs.
display_name = "Gruvbox"
appearance = "dark"
terminal_colors = false

