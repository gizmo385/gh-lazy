# Light: Textual 8.2.5's built-in textual-light theme, frozen as data (#378) and renamed (#379). Every role
# is required; what each one is for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in
# src/theme/file.rs.
display_name = "Light"
appearance = "light"
terminal_colors = false

[surface]
screen = "#E0E0E0"
pane = "#D8D8D8"
header = "#D0D0D0"
raised = "#E5E5E5"
dialog = "#FFFFFF"
card = "#EDEDED"
boost = "#000000 0%"
scrim = "#E0E0E0 60%"
focus_tint = "#1F1F1F 5%"
hatch = "#D0D0D0"

[text]
normal = "auto 87%"
plain = "#1F1F1F"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#002D4F"
secondary = "#004F8B"
accent = "#A86D1C"
success = "#337E4A"
warning = "#A86D1C"
error = "#7A273C"

[brand]
primary = "#004578"
secondary = "#0178D4"
accent = "#FEA62B"

[status]
success = "#4EBF71"
warning = "#FEA62B"
error = "#B93C5B"

[border]
pane_focused = "#4EBF71"
section_title = "#507BB3"
field_focused = "#004578"
field = "#D0D1D0"
rule = "#0178D4"
status_bar = "#0178D4"
dialog = "#E0E0E0 80%"
emphasis = "#FEA62B"
conversation = "#0178D4"
review = "#8FFFAC"
help = "#1F1F1F 30%"

[cursor]
hover_bg = "#00000019"

[cursor.focused]
fg = "auto 87%"
bg = "#004578"
style = "bold"

[cursor.blurred]
fg = "#1F1F1F"
bg = "#0045784C"
style = "none"

[scrollbar]
thumb = "#7994A9"
track = "#CACACA"
corner = "#CACACA"

[input]
placeholder = "auto 38%"
placeholder_style = "none"
invalid = "#B93C5B"
invalid_blurred = "#B93C5B 60%"
terminal_colors = false

[input.cursor]
fg = "#E0E0E0"
bg = "#1F1F1F"
style = "none"

[input.editor_cursor]
fg = "auto 78.3%"
bg = "#1F1F1F 70%"
style = "none"

[input.selection]
fg = "#1F1F1F"
bg = "#23568B 40%"

[footer]
bar = "#D0D0D0"
item = "transparent"
hover = "#00000019"

[footer.key]
fg = "#0178D4"
bg = "transparent"

[footer.description]
fg = "#1F1F1F"
bg = "transparent"

[button]
outlined = false
focus_style = "bold reverse"
disabled_border = "#D0D1D0"

[button.default]
bg = "#D8D8D8"
light = "#EDEDED"
dark = "#C3C3C3"
border = "#D0D1D0"
label = "#1F1F1F"
label_disabled = "#1F1F1F 60%"

[button.primary]
bg = "#004578"
light = "#507BB3"
dark = "#001541"
border = "#004578"
label = "auto 87%"
label_disabled = "auto 52.2%"

[button.success]
bg = "#4EBF71"
light = "#7AE998"
dark = "#008139"
border = "#4EBF71"
label = "auto 87%"
label_disabled = "auto 52.2%"

[button.warning]
bg = "#FEA62B"
light = "#FFCF56"
dark = "#B86B00"
border = "#FEA62B"
label = "auto 87%"
label_disabled = "auto 52.2%"

[button.error]
bg = "#B93C5B"
light = "#E76580"
dark = "#780028"
border = "#B93C5B"
label = "auto 87%"
label_disabled = "auto 52.2%"

[switch]
