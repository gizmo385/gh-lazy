# Monokai: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Monokai"
appearance = "dark"
terminal_colors = false

[surface]
screen = "#272822"
pane = "#2E2E2E"
header = "#3E3D32"
raised = "#4F4E42"
dialog = "#616161"
card = "#3E3E3E"
boost = "#000000 0%"
scrim = "#272822 60%"
focus_tint = "#D6D6D6 5%"
hatch = "#3E3D32"

[text]
normal = "auto 87%"
plain = "#D6D6D6"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#C9ABFF"
secondary = "#FB6FA1"
accent = "#9AE5F4"
success = "#C4EB75"
warning = "#FDBA6B"
error = "#FB6FA1"

[brand]
primary = "#AE81FF"
secondary = "#F82672"
accent = "#66D9EF"

[status]
success = "#A5E22E"
warning = "#FC971F"
error = "#F82672"

[border]
pane_focused = "#A5E22E"
section_title = "#EFBDFF"
field_focused = "#AE81FF"
field = "#282828"
rule = "#F82672"
status_bar = "#F82672"
dialog = "#272822 80%"
emphasis = "#66D9EF"
conversation = "#61474D"
review = "#E8FF72"
help = "#D6D6D6 30%"

[cursor]
hover_bg = "#00000019"

[cursor.focused]
fg = "auto 87%"
bg = "#AE81FF"
style = "bold"

[cursor.blurred]
fg = "#D6D6D6"
bg = "#AE81FF4C"
style = "none"

[scrollbar]
thumb = "#534270"
track = "#171812"
corner = "#171812"

[input]
placeholder = "auto 38%"
placeholder_style = "none"
invalid = "#F82672"
invalid_blurred = "#F82672 60%"
terminal_colors = false

[input.cursor]
fg = "#272822"
bg = "#D6D6D6"
style = "none"

[input.editor_cursor]
fg = "#272822"
bg = "#D6D6D6"
style = "none"

[input.selection]
fg = "#D6D6D6"
bg = "#575B6190"

[footer]
bar = "#3E3D32"
item = "transparent"
hover = "#00000019"

[footer.key]
fg = "#66D9EF"
bg = "transparent"

[footer.description]
fg = "#D6D6D6"
bg = "transparent"

[button]
outlined = false
focus_style = "bold reverse"
disabled_border = "#282828"

[button.default]
bg = "#2E2E2E"
light = "#3E3E3E"
dark = "#1E1E1E"
border = "#282828"
label = "#D6D6D6"
label_disabled = "#D6D6D6 60%"

[button.primary]
bg = "#AE81FF"
light = "#EFBDFF"
dark = "#6E48BE"
border = "#AE81FF"
label = "#272822"
label_disabled = "#272822 60%"

[button.success]
bg = "#A5E22E"
light = "#D2FF5D"
dark = "#64A300"
border = "#A5E22E"
label = "#272822"
label_disabled = "#272822 60%"

[button.warning]
bg = "#FC971F"
light = "#FFBF4C"
dark = "#B65D00"
border = "#FC971F"
label = "#272822"
label_disabled = "#272822 60%"

[button.error]
bg = "#F82672"
light = "#FF5D98"
dark = "#B1003D"
border = "#F82672"
label = "#272822"
label_disabled = "#272822 60%"

[switch]
track = "#1D1C12"
on = "#A5E22E"
off = "#3E3D32"

[select]
