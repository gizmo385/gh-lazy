# Monokai, from its upstream palette (#392): Monokai by Wimer Hazenberg, as in https://github.com/sickill/vim-monokai
# (colors/monokai.vim).
# Surfaces: screen bg, pane bg, header cursor-line, card cursor-line, raised selection, dialog cursor-line.
# Text: normal and plain fg, muted line-number, disabled comment.
# Seeds (brand, status and text colors): primary purple, secondary red, accent blue, success green, warning orange,
# error red.
# Syntax: keyword red, string yellow, number purple, constant purple, function green, type blue, variable fg, name fg,
# builtin blue, attribute green, decorator green, tag red, namespace red, operator word red, comment comment.
# Diff lines: success and error at 15% over the pane, 25% for the current line. The other shades (buttons, scrollbars,
# guides) are Textual 8.2.5's, derived from these seeds. The marks and diff stats are the app's own colors.
# Every role is required; what each one is for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax
# in src/theme/file.rs.
display_name = "Monokai"
appearance = "dark"
terminal_colors = false

