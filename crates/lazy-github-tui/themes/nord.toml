plain = "#D8DEE9"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#B0D5DF"
secondary = "#ABC0D6"
accent = "#CDB4C8"
success = "#C2D4B3"
warning = "#F1DCB2"
error = "#D4969C"

[brand]
