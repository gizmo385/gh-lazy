# Nord, from its upstream palette (#392): https://www.nordtheme.com/docs/colors-and-palettes (nord0-nord15).
# Surfaces: screen nord0, pane nord1, header nord2, card nord2, raised nord2, dialog nord1.
# Text: normal and plain nord4, muted nord4 60%, disabled nord4 38%.
# Seeds (brand, status and text colors): primary nord8, secondary nord9, accent nord15, success nord14, warning
# nord13, error nord11.
# Syntax: keyword nord9, string nord14, number nord15, constant nord9, function nord8, type nord7, variable nord4,
# name nord4, builtin nord9, attribute nord7, decorator nord12, tag nord9, namespace nord9, operator word nord9,
# comment nord3-bright.
# Diff lines: success and error at 15% over the pane, 25% for the current line. The other shades (buttons, scrollbars,
# guides) are Textual 8.2.5's, derived from these seeds. The marks and diff stats are the app's own colors.
# Every role is required; what each one is for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax
# in src/theme/file.rs.
display_name = "Nord"
appearance = "dark"
terminal_colors = false

