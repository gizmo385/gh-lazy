pane = "#FFFAF3"
header = "#F2E9E1"
raised = "#FFFEF6"
dialog = "#FFFFFF"
card = "#FFFFFF"
boost = "#000000 0%"
scrim = "#FAF4ED 60%"
focus_tint = "#575279 5%"
hatch = "#F2E9E1"

[text]
