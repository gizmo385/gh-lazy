# Rose Pine Dawn: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Rose Pine Dawn"
appearance = "light"
terminal_colors = false

