# Rose Pine Dawn, from its upstream palette (#392): https://rosepinetheme.com/palette and
# https://github.com/rose-pine/palette.
# Surfaces: screen base, pane surface, header overlay, card overlay, raised overlay, dialog overlay.
# Text: normal and plain text, muted subtle, disabled muted.
# Seeds (brand, status and text colors): primary iris, secondary pine, accent rose, success foam, warning gold, error
# love.
# Syntax: keyword pine, string gold, number gold, constant gold, function rose, type foam, variable text, name text,
# builtin love, attribute iris, decorator iris, tag foam, namespace iris, operator word pine, comment muted.
# Diff lines: success and error at 15% over the pane, 25% for the current line. The other shades (buttons, scrollbars,
# guides) are Textual 8.2.5's, derived from these seeds. The marks and diff stats are the app's own colors.
# Every role is required; what each one is for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax
# in src/theme/file.rs.
display_name = "Rose Pine Dawn"
appearance = "light"
terminal_colors = false

