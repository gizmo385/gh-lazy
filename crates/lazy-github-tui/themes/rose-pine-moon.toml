pane = "#2A273F"
header = "#393552"
raised = "#4A4564"
dialog = "#5E5975"
card = "#3A3750"
boost = "#000000 0%"
scrim = "#232136 60%"
focus_tint = "#E0DEF4 5%"
hatch = "#393552"

[text]
normal = "auto 87%"
plain = "#E0DEF4"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#D8C4EF"
secondary = "#7FB5CA"
accent = "#F1BCBA"
success = "#BDDFE5"
warning = "#F9D6A5"
error = "#F19FB7"

[brand]
