# Rose Pine: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Rose Pine"
appearance = "dark"
terminal_colors = false

[surface]
screen = "#191724"
pane = "#1F1D2E"
header = "#26233A"
raised = "#36324B"
dialog = "#514E61"
card = "#2F2C3E"
boost = "#000000 0%"
scrim = "#191724 60%"
focus_tint = "#E0DEF4 5%"
hatch = "#26233A"

[text]
normal = "auto 87%"
plain = "#E0DEF4"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#D8C4EF"
secondary = "#77A3B5"
accent = "#F1D2D1"
success = "#BDDFE5"
warning = "#F9D6A5"
error = "#F19FB7"

[brand]
primary = "#C4A7E7"
secondary = "#31748F"
accent = "#EBBCBA"

[status]
