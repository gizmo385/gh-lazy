# Solarized Dark: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Solarized Dark"
appearance = "dark"
terminal_colors = false

[surface]
screen = "#002B36"
pane = "#073642"
header = "#073642"
raised = "#1D4653"
dialog = "#436A78"
card = "#1D4653"
boost = "#000000 0%"
scrim = "#002B36 60%"
focus_tint = "#839496 5%"
hatch = "#073642"

[text]
normal = "auto 87%"
plain = "#839496"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#6FB2E1"
secondary = "#72C0BB"
accent = "#9DA1D8"
success = "#AEBB56"
warning = "#DC8865"
error = "#E77775"

[brand]
primary = "#268BD2"
secondary = "#2AA198"
accent = "#6C71C4"

[status]
