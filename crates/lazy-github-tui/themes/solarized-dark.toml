# Solarized Dark, from its upstream palette (#392): https://ethanschoonover.com/solarized (dark: base03 background,
# base02 highlights).
# Surfaces: screen base03, pane base03, header base02, card base03, raised base03, dialog base03.
# Text: normal and plain base0, muted base01, disabled base01.
# Seeds (brand, status and text colors): primary blue, secondary cyan, accent violet, success green, warning orange,
# error red.
# Syntax: keyword green, string cyan, number cyan, constant cyan, function blue, type yellow, variable blue, name
# base0, builtin red, attribute blue, decorator orange, tag blue, namespace orange, operator word green, comment
# base01.
# Diff lines: success and error at 15% over the pane, 25% for the current line. The other shades (buttons, scrollbars,
# guides) are Textual 8.2.5's, derived from these seeds. The marks and diff stats are the app's own colors.
# Dialogs, toasts and cards sit on base03 like the panes: base0 on base02 is 4.1:1, under WCAG AA for body text, so
# base02 stays the highlight it is in Solarized (table headers, selections).
# Every role is required; what each one is for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax
# in src/theme/file.rs.
display_name = "Solarized Dark"
appearance = "dark"
terminal_colors = false

