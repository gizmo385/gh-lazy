# Solarized Light: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Solarized Light"
appearance = "light"
terminal_colors = false

[surface]
screen = "#FDF6E3"
pane = "#EEE8D5"
header = "#EEE8D5"
raised = "#FFFDEA"
dialog = "#FFFFFF"
card = "#FFFDEA"
boost = "#000000 0%"
scrim = "#FDF6E3 60%"
focus_tint = "#586E75 5%"
hatch = "#EEE8D5"

[text]
normal = "auto 87%"
plain = "#586E75"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#195B8A"
secondary = "#1B6A64"
accent = "#474A81"
success = "#576400"
warning = "#85310E"
error = "#91211F"

[brand]
primary = "#268BD2"
secondary = "#2AA198"
accent = "#6C71C4"

[status]
success = "#849900"
warning = "#CA4B16"
error = "#DB322F"

[border]
pane_focused = "#849900"
section_title = "#77C7FF"
field_focused = "#268BD2"
field = "#E6E0CE"
rule = "#2AA198"
status_bar = "#2AA198"
dialog = "#FDF6E3 80%"
emphasis = "#6C71C4"
conversation = "#2AA198"
review = "#C4D64E"
help = "#586E75 30%"

[cursor]
hover_bg = "#00000019"

[cursor.focused]
fg = "auto 87%"
bg = "#268BD2"
style = "bold"

[cursor.blurred]
fg = "#586E75"
bg = "#268BD24C"
style = "none"

[scrollbar]
thumb = "#99BECF"
track = "#E7E0CD"
corner = "#E7E0CD"

[input]
placeholder = "auto 38%"
placeholder_style = "none"
invalid = "#DB322F"
invalid_blurred = "#DB322F 60%"
terminal_colors = false

[input.cursor]
fg = "#FDF6E3"
bg = "#586E75"
style = "none"

[input.editor_cursor]
fg = "auto 78.3%"
bg = "#586E75 70%"
style = "none"

[input.selection]
fg = "#586E75"
bg = "#459EE7 40%"

[footer]
bar = "#268BD2"
item = "transparent"
hover = "#00000019"

[footer.key]
fg = "#FDF6E3"
bg = "transparent"

[footer.description]
fg = "#FDF6E3"
bg = "transparent"

[button]
outlined = false
focus_style = "bold reverse"
disabled_border = "#E6E0CE"

[button.default]
bg = "#EEE8D5"
light = "#FFFDEA"
dark = "#D8D2C0"
border = "#E6E0CE"
label = "#586E75"
label_disabled = "#586E75 60%"

[button.primary]
bg = "#268BD2"
light = "#77C7FF"
dark = "#005394"
border = "#268BD2"
label = "#FDF6E3"
label_disabled = "#FDF6E3 60%"

[button.success]
bg = "#849900"
light = "#AFC139"
dark = "#485F00"
border = "#849900"
label = "#FDF6E3"
label_disabled = "#FDF6E3 60%"

[button.warning]
bg = "#CA4B16"
light = "#FA733C"
dark = "#850100"
border = "#CA4B16"
label = "#FDF6E3"
label_disabled = "#FDF6E3 60%"

[button.error]
bg = "#DB322F"
light = "#FF6052"
dark = "#940000"
border = "#DB322F"
label = "#FDF6E3"
label_disabled = "#FDF6E3 60%"

[switch]
track = "#C3BEAB"
on = "#849900"
off = "#268BD2 15%"

[select]
muted = "#586E75 50%"
terminal_colors = false

[checkbox]
bg = "#EEE8D5"
off = "#C3BEAB"
on = "#576400"

[tree]
