# Textual Dark: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Textual Dark"
appearance = "dark"
terminal_colors = false

[surface]
screen = "#121212"
pane = "#1E1E1E"
header = "#242F38"
raised = "#343F49"
dialog = "#4F4F4F"
card = "#2D2D2D"
boost = "#FFFFFF0A"
scrim = "#121212 60%"
focus_tint = "#E0E0E0 5%"
hatch = "#242F38"

[text]
normal = "auto 87%"
plain = "#E0E0E0"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#57A5E2"
secondary = "#5684A5"
accent = "#FFC473"
success = "#8AD4A1"
warning = "#FFC473"
error = "#D17E92"

[brand]
primary = "#0178D4"
secondary = "#004578"
accent = "#FEA62B"

[status]
success = "#4EBF71"
warning = "#FEA62B"
error = "#B93C5B"

[border]
pane_focused = "#4EBF71"
section_title = "#6DB2FF"
field_focused = "#0178D4"
field = "#191919"
rule = "#004578"
status_bar = "#004578"
dialog = "#121212 80%"
emphasis = "#FEA62B"
conversation = "#333B42"
review = "#8FFFAC"
help = "#E0E0E0 30%"

[cursor]
hover_bg = "#FFFFFF19"

[cursor.focused]
fg = "auto 87%"
bg = "#0178D4"
style = "bold"

[cursor.blurred]
fg = "#E0E0E0"
bg = "#0178D44C"
style = "none"

[scrollbar]
thumb = "#003054"
track = "#000000"
corner = "#000000"

[input]
placeholder = "auto 38%"
placeholder_style = "none"
invalid = "#B93C5B"
invalid_blurred = "#B93C5B 60%"
terminal_colors = false

[input.cursor]
fg = "#121212"
bg = "#E0E0E0"
style = "none"

[input.editor_cursor]
fg = "#121212"
bg = "#E0E0E0"
style = "none"

[input.selection]
fg = "#E0E0E0"
bg = "#368AE9 40%"

[footer]
bar = "#242F38"
item = "transparent"
hover = "#FFFFFF19"

[footer.key]
fg = "#FFA62B"
bg = "transparent"

[footer.description]
fg = "#E0E0E0"
bg = "transparent"

[button]
outlined = false
focus_style = "bold reverse"
disabled_border = "#191919"

[button.default]
bg = "#1E1E1E"
light = "#2D2D2D"
dark = "#0D0D0D"
border = "#191919"
label = "#E0E0E0"
label_disabled = "#E0E0E0 60%"

[button.primary]
bg = "#0178D4"
light = "#6DB2FF"
dark = "#004295"
border = "#0178D4"
label = "auto 87%"
label_disabled = "auto 52.2%"

[button.success]
bg = "#4EBF71"
light = "#7AE998"
dark = "#008139"
border = "#4EBF71"
label = "auto 87%"
label_disabled = "auto 52.2%"

[button.warning]
bg = "#FEA62B"
light = "#FFCF56"
dark = "#B86B00"
border = "#FEA62B"
label = "auto 87%"
label_disabled = "auto 52.2%"

[button.error]
bg = "#B93C5B"
light = "#E76580"
dark = "#780028"
border = "#B93C5B"
label = "auto 87%"
label_disabled = "auto 52.2%"

[switch]
track = "#000F18"
on = "#4EBF71"
off = "#242F38"

[select]
muted = "#E0E0E0 50%"
terminal_colors = false

[checkbox]
bg = "#242F38"
