# Tokyo Night: Textual 8.2.5's built-in theme, frozen as data (#378). Every role is required; what each one is
# for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax in src/theme/file.rs.
display_name = "Tokyo Night"
appearance = "dark"
terminal_colors = false

[surface]
screen = "#1A1B26"
pane = "#24283B"
header = "#414868"
raised = "#53597A"
dialog = "#575A70"
card = "#34384C"
boost = "#000000 0%"
scrim = "#1A1B26 60%"
focus_tint = "#A9B1D6 5%"
hatch = "#414868"

[text]
normal = "auto 87%"
plain = "#A9B1D6"
muted = "auto 60%"
disabled = "auto 38%"
primary = "#D2BCF9"
secondary = "#A7C1F9"
accent = "#FFBE98"
success = "#BEDE9C"
warning = "#EACA9B"
error = "#F9A4B4"

[brand]
primary = "#BB9AF7"
secondary = "#7AA2F7"
accent = "#FE9E64"

[status]
success = "#9ECE6A"
warning = "#DFAF68"
error = "#F6768E"

[border]
pane_focused = "#9ECE6A"
section_title = "#FBD7FF"
field_focused = "#BB9AF7"
field = "#1E2235"
rule = "#7AA2F7"
status_bar = "#7AA2F7"
dialog = "#1A1B26 80%"
emphasis = "#FE9E64"
conversation = "#484E60"
review = "#DDFFA6"
help = "#A9B1D6 30%"

[cursor]
hover_bg = "#00000019"

[cursor.focused]
fg = "auto 87%"
bg = "#BB9AF7"
style = "bold"

[cursor.blurred]
fg = "#A9B1D6"
bg = "#BB9AF74C"
style = "none"

[scrollbar]
thumb = "#4F4270"
track = "#070817"
corner = "#070817"

[input]
placeholder = "auto 38%"
placeholder_style = "none"
invalid = "#F6768E"
invalid_blurred = "#F6768E 60%"
terminal_colors = false

[input.cursor]
fg = "#1A1B26"
bg = "#A9B1D6"
style = "none"

[input.editor_cursor]
fg = "#1A1B26"
bg = "#A9B1D6"
style = "none"

[input.selection]
fg = "#A9B1D6"
bg = "#D0AEFF 40%"

[footer]
bar = "#414868"
item = "transparent"
hover = "#00000019"

[footer.key]
fg = "#FF9E64"
bg = "transparent"

[footer.description]
fg = "#A9B1D6"
bg = "transparent"

[button]
outlined = false
focus_style = "bold reverse"
disabled_border = "#1E2235"

[button.default]
bg = "#24283B"
light = "#34384C"
dark = "#14182A"
border = "#1E2235"
label = "#A9B1D6"
label_disabled = "#A9B1D6 60%"

[button.primary]
bg = "#BB9AF7"
light = "#FBD7FF"
dark = "#7D60B7"
border = "#BB9AF7"
label = "#24283B"
label_disabled = "#24283B 60%"

[button.success]
bg = "#9ECE6A"
light = "#C8F891"
dark = "#619030"
border = "#9ECE6A"
label = "#24283B"
label_disabled = "#24283B 60%"

[button.warning]
bg = "#DFAF68"
light = "#FFD88F"
dark = "#9E7430"
border = "#DFAF68"
label = "#24283B"
label_disabled = "#24283B 60%"

[button.error]
bg = "#F6768E"
light = "#FF9FB5"
dark = "#B33856"
border = "#F6768E"
label = "#24283B"
label_disabled = "#24283B 60%"

[switch]
