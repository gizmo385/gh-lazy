# Tokyo Night, from its upstream palette (#392): https://github.com/folke/tokyonight.nvim (lua/tokyonight/colors, the
# night style).
# Surfaces: screen bg-dark, pane bg, header bg-highlight, card bg-highlight, raised bg-highlight, dialog bg-highlight.
# Text: normal and plain fg, muted fg-dark, disabled dark5.
# Seeds (brand, status and text colors): primary magenta, secondary blue, accent orange, success green, warning
# yellow, error red.
# Syntax: keyword purple, string green, number orange, constant orange, function blue, type blue1, variable fg, name
# fg, builtin red, attribute green1, decorator cyan, tag red, namespace cyan, operator word purple, comment comment.
# Diff lines: success and error at 15% over the pane, 25% for the current line. The other shades (buttons, scrollbars,
# guides) are Textual 8.2.5's, derived from these seeds. The marks and diff stats are the app's own colors.
# Every role is required; what each one is for is in crates/lazy-github-tui/src/theme/roles.rs, and the value syntax
# in src/theme/file.rs.
display_name = "Tokyo Night"
appearance = "dark"
terminal_colors = false

[surface]
screen = "#16161E"
pane = "#1A1B26"
header = "#292E42"
raised = "#292E42"
dialog = "#292E42"
