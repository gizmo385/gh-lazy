version = 1
description = "Logged out of gh, but a recent auth check is cached: straight to the main screen"
gate = true
parity_rows = ["Skip the auth check while `cache.auth_last_checked` is within `cache.auth_cache_duration`; otherwise check and write `auth_last_checked`"]
sizes = [[160, 48], [100, 30]]

[env]
fixtures = ["base"]
gh_auth = "logged-out"

[env.config_overrides]
cache = { auth_last_checked = "2999-01-01T00:00:00" }

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

[[step]]
capture = "main"
checks = ["titles"]

[expect.main]
contains = ["Repositories"]
not_contains = ["GitHub Authentication"]
