version = 1
description = "Logged out of gh with no cached auth check: the GitHub Authentication screen"
gate = true
parity_rows = ["startup-auth.not-logged-in-screen"]
# One size: the checks are the title, the footer and the message, which fits on one row at 100 columns too.
sizes = [[160, 48]]

# The spec's `config_overrides.cache.auth_last_checked = null` can't be written in TOML, which has no null. The default
# config has no `auth_last_checked`, which is the same: the check runs.
[env]
fixtures = ["base"]
gh_auth = "logged-out"

[[step]]
wait = { text = "GitHub Authentication", timeout_ms = 15000 }

[[step]]
capture = "auth"
checks = ["titles", "footer"]

# The footer sits inside the border, on the box's last inner row.
[expect.auth]
pane_titles = ["GitHub Authentication"]
contains = ["To proceed, please log into the Github CLI via gh auth login"]
footer = ["q Quit"]
