version = 2
description = "Open Bug Report (command palette): gizmo385/gh-lazy becomes the current repo and loads, and New issue opens with the bug-report template and the debug info in its description; then cancelled"
# The template's library lines differ on purpose (decision debug-info-versions), so [expect] checks only the lines
# both apps write.
# Rust draws New issue as the compose sheet (decision compose-dialogs): the open capture was never compared with Python's
# and [expect] checks the text both show. The template is longer than the sheet may be, so Rust's sheet takes the
# screen less the footer and a margin row, and covers the end of the header's "Current repo: gizmo385/gh-lazy".
parity_rows = [
    "command-palette.open-bug-report",
    "modals.debug-bug-report",
    "modals.bug-report-template",
]

[env]
# bug-report over base: gizmo385/gh-lazy's (empty) workflows and runs, which selecting the repo asks for.
fixtures = ["bug-report", "base"]

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

[[step]]
wait = { text = "dotfiles" }

[[step]]
keys = ["ctrl+p"]

[[step]]
wait = { text = "Search for commands" }

[[step]]
type = "bug report"

[[step]]
wait = { text = "Open Bug Report" }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Description" }

[[step]]
wait = { text = "Current repo: gizmo385/gh-la" }

[[step]]
wait = { text = "[4] Workflows (empty)" }

[[step]]
capture = "open"

# escape closes Python's modal. In Rust's sheet the first escape leaves the title and the second closes; in Python the
# second reaches the main screen, where escape only clears a text selection.
[[step]]
keys = ["escape", "escape"]

[[step]]
wait = { gone = "Description" }

[[step]]
capture = "cancelled"

[expect.open]
contains = [
    "Current repo: gizmo385/gh-la",
    "Title",
    "Description",
    "**Describe the bug**",
    "**To Reproduce**",
    "**Expected behavior**",
    "**Installation Mechanism:** [Github CLI, nix, PyPi, etc]",
    "**Debug Info:**",
    "# Library Versions",
    "- LazyGithub Version: ",
    "# LazyGithub Config",
]

[expect.cancelled]
not_contains = ["Description", "Traceback"]
