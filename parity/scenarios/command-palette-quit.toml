version = 1
description = "Command palette's Quit: typed into the palette it's listed with its help, and enter quits the app with exit code 0"
# Palette text is loose text (see command-palette.toml), checked per app with [expect]. Nothing can be captured once
# the app is gone, so the last step asserts the exit itself.
gate = true
parity_rows = [
    "command-palette.quit",
]
sizes = [[160, 48]]

[[step]]
wait = { text = "dotfiles", timeout_ms = 15000 }

[[step]]
keys = ["ctrl+p"]

[[step]]
wait = { text = "Search for commands" }

[[step]]
type = "quit"

[[step]]
wait = { text = "Quit the application as soon as possible" }

[[step]]
capture = "query-quit"
checks = ["titles", "focus"]

[[step]]
keys = ["enter"]

[[step]]
wait = { exited = true }

[expect.query-quit]
contains = ["Quit", "Quit the application as soon as possible"]
