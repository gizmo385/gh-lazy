"""

[[step]]
wait.text = "50. Step 50:"

[[step]]
capture = "long"

[[step]]
keys = ["escape", "q"]

[[step]]
wait.gone = "Description"

# Edit issue on issue 13, the created one: its two-line body opens the sheet at the height that body needs.
[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["E"]

[[step]]
wait.text = "Edit issue #13"

[[step]]
capture = "edit-open"

[[step]]
keys = ["tab", "enter"]

[[step]]
wait.text = "Dismiss menu"

[[step]]
capture = "edit-status-open"

# escape closes the list first, then leaves the field, then closes.
[[step]]
keys = ["escape"]

[[step]]
wait.gone = "Dismiss menu"

[[step]]
capture = "edit-status-closed"

[[step]]
keys = ["escape", "escape"]

[[step]]
wait.gone = "Description"

[[step]]
capture = "edit-closed"

[expect.open]
contains = ["New issue · parity-bot/issue-fixture", "Title   Title", "Description  Write   Preview", "Describe the issue (markdown)"]
footer = ["^s Save", "shift+⏎ Save", "^t Preview", "^o Expand", "esc Leave"]

[expect.empty-title]
contains = ["Must have a non-empty issue title!"]

[expect.short]
contains = ["Parity title", "1  First line", "2  Second line"]

[expect.preview]
contains = ["First line Second line"]
footer = ["^s Save", "shift+⏎ Save", "^t Write", "^o Expand", "esc Leave"]

[expect.expanded]
contains = ["New issue · parity-bot/issue-fixture"]
footer = ["^s Save", "shift+⏎ Save", "^t Preview", "^o Collapse", "esc Leave"]

[expect.sheet]
footer = ["^s Save", "shift+⏎ Save", "^t Preview", "^o Expand", "q Close"]

[expect.saving]
contains = ["Saving…", "Creating new issue..."]

[expect.created]
focused = ["[5] Issue #13 Details"]
not_contains = ["Description", "Traceback"]

[expect.long]
contains = ["50. Step 50:"]
not_contains = ["1. Step 1:"]

[expect.edit-open]
contains = ["Edit issue #13 · parity-bot/issue-fixture", "Parity title", "Open ▼", "1  First line", "2  Second line"]

[expect.edit-status-open]
contains = ["Open ▲", "Closed", "esc Dismiss menu"]

[expect.edit-status-closed]
contains = ["Open ▼"]
footer = ["^s Save", "shift+⏎ Save", "^t Preview", "^o Expand", "q Leave"]

[expect.edit-closed]
not_contains = ["Description", "Traceback"]
