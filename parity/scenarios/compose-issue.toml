version = 1
description = "Compose sheet on New issue (I) and Edit issue (E): 12 rows empty with the title focused, a short body, ctrl+t Preview, ctrl+o full screen and back, escape leaving a field (q Close), ctrl+s saving the same write as Python's Save with Saving… in the heading, a long pasted body at the cap (the body scrolls, its scrollbar shown only then), an empty title refused, and Edit issue with its body, its one-row Status select open over the rows below, and escape closing the list before leaving the field (#421)"
# Rust-only: the compose sheet is new behavior (decision compose-dialogs). Checked by eye at both sizes.
gate = true
apps = ["rust"]
parity_rows = [
    "modals.compose-sheet",
    "modals.compose-preview",
    "modals.compose-expand",
    "modals.new-issue",
    "modals.edit-issue",
    "modals.issue-dialogs-small-terminal",
    "keybindings.compose-submit",
    "keybindings.compose-toggle-preview",
    "keybindings.compose-expand",
]
sizes = [[160, 48], [100, 30]]

[env]
# The issue-new scenario's: issue-write answers POST .../issues for "Parity title" and "First line\nSecond line",
# after 1 s.
fixtures = ["issue-write", "issue-details", "base"]
# Short toasts, gone before the captures after the ones that raise them.
toast_timeout_ms = 1500

[[step]]
wait.text = "issue-fixture"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Issues with bodies and comments."
wait.timeout_ms = 15000

[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["I"]

[[step]]
wait.text = "Describe the issue (markdown)"

[[step]]
capture = "open"

# An empty title is refused: the title is drawn in the error color and keeps focus.
[[step]]
keys = ["ctrl+s"]

[[step]]
wait.text = "Must have a non-empty issue title!"

[[step]]
capture = "empty-title"

# The toast goes before the next captures, so whether it still shows doesn't depend on how fast the runner is.
[[step]]
wait.gone = "Must have a non-empty issue title!"

[[step]]
type = "Parity title"

[[step]]
keys = ["tab"]

[[step]]
type = "First line"

[[step]]
keys = ["enter"]

[[step]]
type = "Second line"

[[step]]
wait.text = "Second line"

[[step]]
capture = "short"

[[step]]
keys = ["ctrl+t"]

[[step]]
wait.text = "^t Write"

[[step]]
capture = "preview"

[[step]]
keys = ["ctrl+t", "ctrl+o"]

[[step]]
wait.text = "^o Collapse"

[[step]]
capture = "expanded"

[[step]]
keys = ["ctrl+o", "escape"]

[[step]]
wait.text = "q Close"

[[step]]
capture = "sheet"

[[step]]
keys = ["ctrl+s"]

[[step]]
wait.text = "Saving…"

[[step]]
capture = "saving"

[[step]]
wait.log.method = "POST"
wait.log.path = "/repos/parity-bot/issue-fixture/issues"
wait.log.body.title = "Parity title"
wait.log.body.body = "First line\nSecond line"

[[step]]
wait.text = "Parity title (#13)"

[[step]]
capture = "created"

# The toasts go before the next captures, so they don't cover the sheet.
[[step]]
wait.gone = "Successfully created issue #13"

# A long paste: the sheet grows to the screen less the footer and a margin row, then the body scrolls.
[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["I"]

[[step]]
wait.text = "Describe the issue (markdown)"

[[step]]
keys = ["tab"]

[[step]]
paste = """
