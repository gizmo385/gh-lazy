version = 1
description = "A section hidden by config still takes focus with its key (Py bug B31): no border is focused, and Tab goes to the repos table"
gate = true
parity_rows = ["Focus switching (1-6)"]
sizes = [[160, 48], [100, 30]]

[env]
fixtures = ["base"]

[env.config_overrides]
appearance = { show_pull_requests = false }

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

[[step]]
keys = ["2"]

# The hidden section's bindings reach the footer (#76), so the footer is left out until then.
[[step]]
capture = "hidden-prs"
checks = ["titles", "focus"]

[[step]]
keys = ["tab"]

[[step]]
capture = "tab"
checks = ["titles", "tabs", "focus"]

[expect.hidden-prs]
pane_titles = ["", "[1] Repositories", "[5] Details", "[3] Issues", "[4] Workflows"]
focused = []

[expect.tab]
focused = ["[1] Repositories"]
