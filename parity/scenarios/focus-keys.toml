version = 1
description = "Focus keys 2-6 and the Tab ring: each section's border follows focus, 5 twice stays on Details, 6 without the log does nothing"
gate = true
parity_rows = ["main-layout.focus-switching", "main-layout.focus-ring", "main-layout.details-tabs-focused", "keybindings.main-pull-requests-focus", "keybindings.main-issues-focus", "keybindings.main-workflows-focus", "keybindings.main-details-focus", "keybindings.main-command-log-focus"]
sizes = [[160, 48], [100, 30]]

[env]
fixtures = ["base"]

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

[[step]]
keys = ["2"]

[[step]]
capture = "prs"
checks = ["titles", "tabs", "focus"]

[[step]]
keys = ["3"]

[[step]]
capture = "issues"
checks = ["titles", "tabs", "focus"]

[[step]]
keys = ["4"]

[[step]]
capture = "workflows"
checks = ["titles", "tabs", "focus"]

[[step]]
keys = ["5"]

[[step]]
capture = "details"
checks = ["titles", "tabs", "focus"]

[[step]]
keys = ["5"]

[[step]]
capture = "details-again"
checks = ["titles", "tabs", "focus"]

# The command log isn't displayed, so 6 does nothing.
[[step]]
keys = ["6"]

[[step]]
capture = "no-log"
checks = ["titles", "tabs", "focus"]

# Tab from the tab strip goes to the details content, then wraps to the repos table; Shift+Tab goes back.
[[step]]
keys = ["tab"]

[[step]]
capture = "tab-content"
checks = ["titles", "tabs", "focus"]

[[step]]
keys = ["tab"]

[[step]]
capture = "tab-wrap"
checks = ["titles", "tabs", "focus"]

[[step]]
keys = ["shift+tab"]

[[step]]
capture = "shift-tab"
checks = ["titles", "tabs", "focus"]

[expect.prs]
focused = ["[2] Pull Requests"]

[expect.issues]
focused = ["[3] Issues"]

[expect.workflows]
focused = ["[4] Workflows"]

[expect.details]
focused = ["[5] Details"]
tabs = { box = "Details", names = ["Introduction"], active = "Introduction" }

[expect.details-again]
focused = ["[5] Details"]

[expect.no-log]
focused = ["[5] Details"]

[expect.tab-content]
focused = ["[5] Details"]
tabs = { box = "Details", names = ["Introduction"], active = "Introduction" }

[expect.tab-wrap]
focused = ["[1] Repositories"]

[expect.shift-tab]
focused = ["[5] Details"]
