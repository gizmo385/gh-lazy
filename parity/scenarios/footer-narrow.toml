version = 1
description = "The footer for PRs, issues and workflows at 100 columns, where it's cut off before the ^p item"
gate = true
parity_rows = ["main-layout.footer"]
# At 160 columns these footers show enough of `^p Command Pallete` to differ (Py bug B14); `footer` covers them there.
sizes = [[100, 30]]

[env]
fixtures = ["base"]

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

[[step]]
keys = ["2"]

[[step]]
capture = "prs"
checks = ["titles", "focus", "footer"]

[[step]]
keys = ["3"]

[[step]]
capture = "issues"
checks = ["titles", "focus", "footer"]

[[step]]
keys = ["4"]

[[step]]
capture = "workflows"
checks = ["titles", "focus", "footer"]

[expect.prs]
footer = ["/ Search", "O Lookup Pull Request", "E Edit PR", "u View User", "I New Issue", "P New PR", "^v Paste link", "f Follow link"]

[expect.issues]
footer = ["/ Search", "O Lookup Issue", "E Edit Issue", "u View User", "I New Issue", "P New PR", "^v Paste link", "f Follow link"]

[expect.workflows]
footer = ["/ Search", "T Trigger Workflow", "I New Issue", "P New PR", "^v Paste link", "f Follow link", "F Follow link (browser)"]
