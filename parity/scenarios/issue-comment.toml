version = 2
description = "New comment (n) and reply (r) on the issue Comments tab: the empty modal, the markdown preview, posting appending the comment, the reply modal's heading and quote, and the posted reply appended"
# Rust draws the modal as the compose sheet (decision compose-dialogs): its captures were never compared with Python's
# (Python's 100 x 50 modal with button rows and a live preview hides the panes, Rust's sheet leaves them in view
# and has footer keys and Write/Preview tabs), and [expect] checks the text both show. The writes are in the snapshot's
# effects.
parity_rows = [
    "modals.new-comment",
    "modals.text-editor",
    "issues.comments-new-reply",
    "keybindings.conversation-comment-new",
    "keybindings.conversation-comment-reply",
]
sizes = [[160, 48]]

[env]
# issue-write over issue-details: POST /repos/parity-bot/issue-fixture/issues/12/comments answers a new comment for
# each of the two bodies this scenario posts.
fixtures = ["issue-write", "issue-details", "base"]

[[step]]
wait.text = "issue-fixture"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Comments that fail to load"
wait.timeout_ms = 15000

[[step]]
wait.text = "Issues with bodies and comments."
wait.timeout_ms = 15000

[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Workaround: delete the file"
wait.timeout_ms = 15000

# The Comments tab, then into its scroll area, where `n` is bound.
[[step]]
keys = ["5"]

[[step]]
wait = { focused = "Details" }

[[step]]
keys = ["right"]

[[step]]
wait.text = "A comment from a deleted account."
wait.timeout_ms = 15000

[[step]]
keys = ["tab"]

# Python moves focus a tick after a tab (Py bug B121): each key for the new focus waits for it to show.
# The scroll area has focus once the footer offers `n`.
[[step]]
wait = { text = "n New Comment" }

[[step]]
keys = ["n"]

[[step]]
wait.text = "New comment"

[[step]]
capture = "open"

[[step]]
type = "A **new** comment"

[[step]]
wait.text = "A **new** comment"

# Rust's preview is behind `ctrl+t` (`compose.toggle_preview`); Python's is always on and binds nothing to the key.
[[step]]
keys = ["ctrl+t"]

[[step]]
wait.text = "A new comment"

[[step]]
capture = "preview"

# Rust's compose sheet has no Post Comment button (decision compose-dialogs): the click lands on Python's button and
# on Rust's footer `^s Post`, the first "Post" on each screen. Python's button is on screen here.
[[step]]
click = { text = "Post" }

# Park the pointer off the footer, which Rust would otherwise draw hovered once the dialog closes.
[[step]]
move = { at = [100, 1] }

[[step]]
wait.log.method = "POST"
wait.log.path = "/repos/parity-bot/issue-fixture/issues/12/comments"
wait.log.body.body = "A **new** comment"

[[step]]
wait.gone = "New comment"

[[step]]
wait.text = "parity-bot • Tue Mar  3 09:00:00 2026"

[[step]]
capture = "posted"

# Focus came back to the scroll area: two tabs reach the second comment, the deleted account's.
[[step]]
keys = ["tab", "tab"]

[[step]]
wait = { focused = "A comment from a deleted account." }

# The footer shows whole here, `^p Command Pallete` included (Py bug B14, which Rust fixes), so it's left out of the
# cross-app checks; [expect] checks its comment keys on the screen.
[[step]]
capture = "comment-focused"

[[step]]
keys = ["r"]

[[step]]
wait.text = "Replying to comment from Unknown"

[[step]]
capture = "reply-open"

[[step]]
type = "Agreed, thanks."

# Python's modal is taller than the screen here, so Post Comment is below the bottom edge until tab scrolls to it. In
# Rust's sheet tab does nothing: the body is its only field.
[[step]]
keys = ["tab"]

[[step]]
wait.regex = 'Post Comment|\^s Post'

# Rust's compose sheet has no Post Comment button (decision compose-dialogs): the click lands on Python's button and
# on Rust's footer `^s Post`, the first "Post" on each screen.
[[step]]
click = { text = "Post" }

# Park the pointer off the footer, which Rust would otherwise draw hovered once the dialog closes.
[[step]]
move = { at = [100, 1] }

[[step]]
wait.log.method = "POST"
wait.log.path = "/repos/parity-bot/issue-fixture/issues/12/comments"
wait.log.body.body = "Agreed, thanks."

[[step]]
wait.gone = "Replying to comment"

[[step]]
wait.text = "parity-bot • Tue Mar  3 09:05:00 2026"

[[step]]
capture = "replied"

# Cancel: escape closes Python's modal without posting. In Rust's sheet the first escape leaves the body and the
# second closes; in Python the second reaches the main screen, where escape only clears a text selection.
[[step]]
keys = ["n"]

[[step]]
wait.text = "New comment"

[[step]]
keys = ["escape", "escape"]

[[step]]
wait.gone = "New comment"

[[step]]
capture = "cancelled"

[expect.open]
contains = ["New comment", "Preview"]
not_contains = ["Replying to comment"]

[expect.preview]
contains = ["A new comment"]

[expect.posted]
focused = ["[5] Issue #12 Details"]
contains = ["A new comment", "parity-bot • Tue Mar  3 09:00:00 2026"]
not_contains = ["Post Comment", "Traceback"]

[expect.comment-focused]
contains = ["A comment from a deleted account.", " r Reply to Comment  n New Comment  ^v Paste link"]

[expect.reply-open]
contains = ["Replying to comment from Unknown at Wed Feb  4 11:00:00 2026", "A comment from a deleted account.", "Preview"]

[expect.replied]
focused = ["[5] Issue #12 Details"]
contains = ["Agreed, thanks.", "parity-bot • Tue Mar  3 09:05:00 2026"]
not_contains = ["Post Comment", "Traceback"]

[expect.cancelled]
focused = ["[5] Issue #12 Details"]
not_contains = ["New comment", "Post Comment", "Traceback"]
