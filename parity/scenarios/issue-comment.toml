version = 1
description = "New comment (n) and reply (r) on the issue Comments tab: the empty modal, the live markdown preview, Post Comment appending the comment, the reply modal's heading and quote, and the posted reply appended"
# The modal's footer isn't compared: Rust binds `modal.submit` there (Py bug B17's recommendation), so it shows
# `shift+⏎ Submit` where Python shows only `esc Close`.
gate = true
parity_rows = [
    "modals.new-comment",
    "modals.text-editor",
    "issues.comments-new-reply",
    "keybindings.conversation-comment-new",
    "keybindings.conversation-comment-reply",
]
sizes = [[160, 48]]

[env]
# issue-write over issue-details: POST /repos/parity-bot/issue-fixture/issues/12/comments answers a new comment for
# each of the two bodies this scenario posts.
fixtures = ["issue-write", "issue-details", "base"]

[[step]]
wait.text = "issue-fixture"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Comments that fail to load"
wait.timeout_ms = 15000

[[step]]
wait.text = "Issues with bodies and comments."
wait.timeout_ms = 15000

[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Workaround: delete the file"
wait.timeout_ms = 15000

# The Comments tab, then into its scroll area, where `n` is bound.
[[step]]
keys = ["5"]

[[step]]
wait = { focused = "Details" }

[[step]]
keys = ["right"]

[[step]]
wait.text = "A comment from a deleted account."
wait.timeout_ms = 15000

[[step]]
keys = ["tab"]

# Python moves focus a tick after a tab (Py bug B121): each key for the new focus waits for it to show.
# The scroll area has focus once the footer offers `n`.
[[step]]
wait = { text = "n New Comment" }

[[step]]
keys = ["n"]

[[step]]
wait.text = "Post Comment"

[[step]]
capture = "open"
checks = ["titles", "focus"]

[[step]]
type = "A **new** comment"

[[step]]
wait.text = "A new comment"

[[step]]
capture = "preview"
checks = ["titles", "focus"]

[[step]]
keys = ["tab"]

[[step]]
wait = { focused = "Post Comment" }

[[step]]
keys = ["enter"]

[[step]]
wait.log.method = "POST"
wait.log.path = "/repos/parity-bot/issue-fixture/issues/12/comments"
wait.log.body.body = "A **new** comment"

[[step]]
wait.gone = "Post Comment"

[[step]]
wait.text = "parity-bot • Tue Mar  3 09:00:00 2026"

[[step]]
capture = "posted"
checks = ["titles", "tabs", "focus"]

# Focus came back to the scroll area: two tabs reach the second comment, the deleted account's.
[[step]]
keys = ["tab", "tab"]

[[step]]
wait = { focused = "A comment from a deleted account." }

# The footer shows whole here, `^p Command Pallete` included (Py bug B14, which Rust fixes), so it's left out of the
# cross-app checks; [expect] checks its comment keys on the screen.
[[step]]
capture = "comment-focused"
checks = ["titles", "tabs", "focus"]

[[step]]
keys = ["r"]

[[step]]
wait.text = "Replying to comment from Unknown"

[[step]]
capture = "reply-open"
checks = ["titles", "focus"]

# The modal is taller than the screen here, so Post Comment is below the bottom edge; tab still reaches it.
[[step]]
type = "Agreed, thanks."

[[step]]
keys = ["tab"]

[[step]]
wait = { focused = "Post Comment" }

[[step]]
keys = ["enter"]

[[step]]
wait.log.method = "POST"
wait.log.path = "/repos/parity-bot/issue-fixture/issues/12/comments"
wait.log.body.body = "Agreed, thanks."

[[step]]
wait.gone = "Post Comment"

[[step]]
wait.text = "parity-bot • Tue Mar  3 09:05:00 2026"

[[step]]
capture = "replied"
checks = ["titles", "tabs", "focus"]

# Cancel: escape leaves the editor's modal without posting.
[[step]]
keys = ["n"]

[[step]]
wait.text = "Post Comment"

[[step]]
keys = ["escape"]

[[step]]
wait.gone = "Post Comment"

[[step]]
capture = "cancelled"
checks = ["titles", "tabs", "focus"]

[expect.open]
contains = ["New comment", "Preview", "Post Comment", "Cancel"]
not_contains = ["Replying to comment"]

[expect.preview]
contains = ["A **new** comment", "A new comment"]

[expect.posted]
focused = ["[5] Issue #12 Details"]
contains = ["A new comment", "parity-bot • Tue Mar  3 09:00:00 2026"]
not_contains = ["Post Comment", "Traceback"]

[expect.comment-focused]
contains = ["A comment from a deleted account.", " r Reply to Comment  n New Comment  ^v Paste link"]

[expect.reply-open]
contains = ["Replying to comment from Unknown at Wed Feb  4 11:00:00 2026", "A comment from a deleted account.", "New comment", "Preview"]

[expect.replied]
focused = ["[5] Issue #12 Details"]
contains = ["Agreed, thanks.", "parity-bot • Tue Mar  3 09:05:00 2026"]
not_contains = ["Post Comment", "Traceback"]

[expect.cancelled]
focused = ["[5] Issue #12 Details"]
not_contains = ["Post Comment", "Traceback"]
