version = 1
description = "Edit issue modal (E) from the Issues table: the prefilled title, Status select and description; a new title, Closed picked in the select, Save, and the updated row replacing the old one; then E on the Issue Overview, closed with escape"
# Rust draws the modal as the compose sheet (decision compose-dialogs): its captures compare nothing across apps
# (Python's 100 x 30 modal with labels above tall fields and Save / Cancel buttons, Rust's content-sized sheet with
# one-row fields, the title focused at open and footer keys), and [expect] checks the text both show. The sheet's own
# texts (its heading, `^s Save`, `Saving…`) are checked by the Rust-only compose-issue scenario. The write is compared
# as before.
gate = true
parity_rows = [
    "modals.edit-issue",
    "modals.form-widgets",
    "modals.text-editor",
    "issues.edit-from-table",
    "issues.overview-edit",
    "keybindings.issue-edit",
]
sizes = [[160, 48]]

[env]
# issue-write over issue-details: PATCH /repos/parity-bot/issue-fixture/issues/12 answers after 1.5 s, only for the
# title, body and state this scenario sends.
fixtures = ["issue-write", "issue-details", "base"]

[[step]]
wait.text = "issue-fixture"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Comments that fail to load"
wait.timeout_ms = 15000

[[step]]
wait.text = "Issues with bodies and comments."
wait.timeout_ms = 15000

# The Issues table's cursor is on issue 12.
[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["E"]

# Not "Status": the Issues table's header has it too. The dialog's footer is drawn once the dialog is.
[[step]]
wait.regex = 'shift\+⏎ (Submit|Save)'

[[step]]
capture = "open"
checks = []

# A click past the title's end focuses Python's input with the cursor at its end (Rust's title has focus already),
# and ctrl+u deletes everything to its left in both.
[[step]]
click = { text = "Crash when the config file is empty", offset = [40, 0] }

[[step]]
keys = ["ctrl+u"]

[[step]]
wait.gone = "Crash when the config file is empty"

[[step]]
type = "Crash when the config file is blank"

[[step]]
wait.text = "Crash when the config file is blank"

[[step]]
capture = "title-typed"
checks = []

# Status, whose closed select types nothing, so the footer offers `q`: Python's `q Close`, Rust's `q Leave`. Python
# moves focus a tick after a tab (Py bug B121): the next key waits for it.
[[step]]
keys = ["tab"]

[[step]]
wait.regex = 'q (Close|Leave)'

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Closed"

[[step]]
capture = "status-open"
checks = []

[[step]]
keys = ["down", "enter"]

[[step]]
wait.gone = "Dismiss menu"

[[step]]
capture = "status-closed"
checks = []

# Rust's compose sheet has no Save button (decision compose-dialogs): the click lands on Python's button and on Rust's
# footer `^s Save`, the first "Save" on each screen. (Python's shift+enter saves too, but its 1 s "Updating issue
# #12..." toast never draws while the binding's action awaits the request.) Python never shows "Saving..." (Py bug
# B69): [expect] checks only the progress toast.
[[step]]
click = { text = "Save" }

# Park the pointer off the footer, which Rust would otherwise draw hovered once the dialog closes.
[[step]]
move = { at = [100, 1] }

[[step]]
wait.text = "Updating issue #12..."

[[step]]
capture = "saving"
checks = []

[[step]]
wait.log.method = "PATCH"
wait.log.path = "/repos/parity-bot/issue-fixture/issues/12"
wait.log.body.title = "Crash when the config file is blank"
wait.log.body.body = "## Steps to reproduce\n\n1. Create an empty `config.json`\n2. Run `lazy-github` and press `#5`\n\nIt fails the same way as #7, and parity-bot/dotfiles#3 has the same error. cc @parity-bot\n\n```text\nError: the config file is empty (see #9)\n```\n\n> Workaround: delete the file and start again.\n"
wait.log.body.state = "closed"

[[step]]
wait.text = "Successfully updated issue #12"

[[step]]
capture = "updated"
checks = ["titles", "headers", "rows", "cursor", "focus"]

# From the Issue Overview: select issue 11, move into the Overview's content and press E.
[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["j", "enter"]

[[step]]
wait.text = "Closed without a body (#11)"

[[step]]
keys = ["tab"]

# The Overview's content has focus once the footer leads with its `E`.
[[step]]
wait = { regex = '(?m)^ E Edit Issue  ' }

[[step]]
keys = ["E"]

# Not "Status": the Issues table's header has it too. The dialog's footer is drawn once the dialog is.
[[step]]
wait.regex = 'shift\+⏎ (Submit|Save)'

[[step]]
capture = "from-overview"
checks = []

# escape closes Python's modal. In Rust's sheet the first escape leaves the title and the second closes; in Python the
# second reaches the main screen, where escape only clears a text selection.
[[step]]
keys = ["escape", "escape"]

[[step]]
wait.gone = "Description"

[[step]]
capture = "overview-closed"
checks = ["titles", "focus"]

[expect.open]
contains = ["Title", "Crash when the config file is empty", "Status", "Open", "Description", "## Steps to reproduce"]

[expect.title-typed]
contains = ["Crash when the config file is blank"]
not_contains = ["Crash when the config file is empty"]

[expect.status-open]
contains = ["Select", "Open", "Closed", "esc Dismiss menu"]

[expect.status-closed]
contains = ["Closed"]
not_contains = ["Dismiss menu"]

[expect.saving]
contains = ["Updating issue #12..."]

[expect.updated]
focused = ["[3] Issues"]
contains = ["12  closed  parity-friend  Crash when the config file is blan", "Successfully updated issue #12"]
not_contains = ["Saving", "Traceback"]

[expect.from-overview]
contains = ["Closed without a body", "Status", "Closed", "Description"]

[expect.overview-closed]
focused = ["[5] Issue #11 Details"]
not_contains = ["Description", "Traceback"]
