version = 2
description = "New issue modal (I): without a repo, the empty modal, an empty title, typing a title and a two-line description, submitting with shift+enter, and the created issue added to the Issues table and opened; then closed with escape"
# The toast after `I` without a repo is titled "Cannot open new pull request" in Python and "Cannot open new issue"
# in Rust (Py bug B14, answered), so [expect] only checks its message. The empty-body toast (Py bug B25) isn't
# exercised: Rust follows B25's recommendation and creates an issue with an empty body.
# Rust draws the modal as the compose sheet (decision compose-dialogs): its captures were never compared with Python's
# (Python's 80% modal with labels above tall fields and Save / Cancel buttons hides the panes, Rust's sheet leaves them
# in view, opens with the title focused and has footer keys), and [expect] checks the text both show. The sheet's own
# texts (its heading, `^s Save`) are checked by the Rust-only compose-issue scenario. The write is in the snapshot's effects.
parity_rows = [
    "modals.new-issue",
    "modals.text-editor",
    "keybindings.issue-new",
    "keybindings.modal-submit",
    "toasts.select-repository-first",
]
sizes = [[160, 48]]

[env]
# issue-write over issue-details: POST /repos/parity-bot/issue-fixture/issues answers issue 13 after 1 s, only for
# the title and body this scenario types.
fixtures = ["issue-write", "issue-details", "base"]

[[step]]
wait.text = "issue-fixture"
wait.timeout_ms = 15000

# No repo selected yet.
[[step]]
keys = ["I"]

[[step]]
wait.text = "Please select a repository first!"

[[step]]
capture = "no-repo"

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Comments that fail to load"
wait.timeout_ms = 15000

[[step]]
wait.text = "Issues with bodies and comments."
wait.timeout_ms = 15000

[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["I"]

[[step]]
wait.text = "Description"

[[step]]
capture = "open"

# shift+enter with an empty title, in the kitty keyboard protocol's encoding (CSI 13;2 u), which both apps read: from
# Python's scroll area and from Rust's title.
[[step]]
type = "\u001b[13;2u"

[[step]]
wait.text = "Must have a non-empty issue title!"

[[step]]
capture = "empty-title"

# The title's input: the second "Title" on each screen is Python's placeholder (after its label) and Rust's label
# (after the Pull Requests table's header, which Rust's sheet leaves in view). A click on either focuses the title.
[[step]]
click = { text = "Title", nth = 2 }

[[step]]
type = "Parity title"

[[step]]
wait.text = "Parity title"

# The description: two rows under its label, in Python's editor (under its top border) and in Rust's body (under the
# tabs row the label is on).
[[step]]
click = { text = "Description", offset = [2, 2] }

[[step]]
type = "First line"

[[step]]
keys = ["enter"]

[[step]]
type = "Second line"

[[step]]
wait.text = "Second line"

[[step]]
capture = "typed"

[[step]]
type = "\u001b[13;2u"

[[step]]
wait.text = "Creating new issue..."

[[step]]
wait.log.method = "POST"
wait.log.path = "/repos/parity-bot/issue-fixture/issues"
wait.log.body.title = "Parity title"
wait.log.body.body = "First line\nSecond line"

[[step]]
wait.text = "Successfully created issue #13"

[[step]]
wait.text = "Parity title (#13)"

[[step]]
capture = "created"

# Open it again and close it without saving: escape closes Python's modal. In Rust's sheet the first escape leaves the
# title and the second closes; in Python the second reaches the main screen, where escape only clears a text
# selection.
[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["I"]

[[step]]
wait.text = "Description"

[[step]]
keys = ["escape", "escape"]

[[step]]
wait.gone = "Description"

[[step]]
capture = "cancelled"

[expect.no-repo]
contains = ["Please select a repository first!"]
not_contains = ["Description"]

[expect.open]
contains = ["Title", "Description"]

[expect.empty-title]
contains = ["Must have a non-empty issue title!", "Description"]

[expect.typed]
contains = ["Parity title", "First line", "Second line"]

[expect.created]
focused = ["[5] Issue #13 Details"]
contains = ["Creating new issue...", "Successfully created issue #13", "Open Parity title (#13) by parity-bot", "13  open    parity-bot     Parity title"]
not_contains = ["Description", "Traceback"]

[expect.cancelled]
not_contains = ["Description", "Traceback"]
