version = 1
description = "A 1,000-repo account (20 pages): every page lands in the repos table, G reaches the last repo, and a / search filters the 1,000 rows (#325)"
gate = true
# Rust-only: the check is that the app stays usable at this size, not a comparison with Python (#325).
apps = ["rust"]
parity_rows = ["repositories.rows"]
sizes = [[160, 48]]

[env]
# large-account is generated by `cargo xtask large-account-fixtures`: parity-bot/large-0000 to large-0999.
fixtures = ["large-account", "base"]

[[step]]
wait = { text = "large-0000", timeout_ms = 20000 }

[[step]]
keys = ["1", "G"]

[[step]]
wait = { text = "large-0999", timeout_ms = 10000 }

[[step]]
capture = "bottom"

[[step]]
keys = ["/"]

[[step]]
type = "large-05"

[[step]]
keys = ["enter"]

[[step]]
wait = { gone = "large-0999", timeout_ms = 10000 }

[[step]]
capture = "searched"

# The 100 matching rows: the last is large-0599.
[[step]]
keys = ["G"]

[[step]]
wait = { text = "large-0599", timeout_ms = 10000 }

[[step]]
capture = "searched-bottom"

[expect.bottom]
contains = ["large-0999", "large-0990"]
not_contains = ["panicked"]

[expect.searched]
contains = ["large-0500", "large-0509"]
not_contains = ["large-0000", "large-0999", "panicked"]

[expect.searched-bottom]
contains = ["large-0599"]
not_contains = ["large-0600", "large-0499", "panicked"]
