version = 1
description = "Clicking links: the Repo Overview's title (a bare repo link) opens in the browser and nothing changes in the app; in a markdown body a user link opens the profile modal, an issue link opens that issue in-app with \"Opening issue for link\""
# Links that open the browser change nothing on screen: the browser capture checks what fake-browser was asked to open.
gate = true
parity_rows = [
    "markdown-links.link-click",
    "toasts.opening-for-link",
]

[env]
# links over issue-details: GET /repos/parity-bot/issue-fixture and issue 7, so #7 resolves in-app; user-profile has
# parity-bot's profile.
fixtures = ["links", "issue-details", "user-profile", "base"]

[[step]]
wait = { text = "issue-fixture", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Comments that fail to load", timeout_ms = 15000 }

[[step]]
wait = { text = "Issues with bodies and comments.", timeout_ms = 15000 }

# The repo title links the bare repo, which clicks send to the browser (accept_repo=False).
[[step]]
click = { text = "parity-bot/issue-fixture • Public" }

[[step]]
wait = { stable_ms = 500 }

[[step]]
capture = "browser"
checks = ["titles", "focus"]

[[step]]
keys = ["3", "enter"]

[[step]]
wait = { text = "Workaround: delete the file", timeout_ms = 15000 }

# "cc @parity-bot" in the body.
[[step]]
click = { text = "cc @parity-bot", offset = [3, 0] }

[[step]]
wait = { text = "Followers: 12" }

[[step]]
move = { at = [10, 1] }

# No titles: Python's two-row strip at the bottom of the profile (Py bug B50) hides the Workflows box's border at
# 160x48, as in `user-profile`'s `organization` capture.
[[step]]
capture = "user"
checks = []

[[step]]
keys = ["escape"]

[[step]]
wait = { gone = "Followers: 12" }

# "#7" in "the same way as #7,".
[[step]]
click = { text = "same way as #7", offset = [12, 0] }

[[step]]
wait = { text = "Reached by following #7 from issue 12." }

[[step]]
move = { at = [10, 1] }

[[step]]
capture = "issue"
checks = ["titles", "focus"]

[expect.browser]
contains = ["parity-bot/issue-fixture • Public", "Owned by parity-bot", "Issues with bodies and comments."]
not_contains = ["Opening"]
opened = ["https://github.com/parity-bot/issue-fixture"]

[expect.user]
contains = ["Followers: 12"]

[expect.issue]
contains = ["Opening issue for link", "The issue a link points at (#7)", "Reached by following #7 from issue 12."]
not_contains = ["Workaround: delete the file"]
