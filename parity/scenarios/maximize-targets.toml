version = 1
description = "M on each focus target: the details content doesn't maximize and leaves the one-time toast for the next maximize; each table, the details tabs and the command log do"
gate = true
parity_rows = ["main-layout.maximize"]
# Which targets maximize is behavior, not layout, so one size is enough (parity/README.md, "Keeping the suite fast").
sizes = [[160, 48]]

[env]
fixtures = ["base"]

[env.config_overrides]
appearance = { show_command_log = true }

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

# The repos table's bindings show once Python has settled, so the `gone` wait after the focus key means something.
[[step]]
wait = { text = "O Lookup Repository" }

# The footer drops the repos table's bindings once 5 has moved focus to the details (Py bug B98: wait before more
# keys). The tab to the content after it has no signal of its own, but keys are handled in order, so M reaches the
# content.
[[step]]
keys = ["5"]

[[step]]
wait = { gone = "O Lookup" }

[[step]]
keys = ["tab"]

[[step]]
wait = { gone = "Toggle Favorite" }

# A no-op draws nothing to wait for. If M did maximize here, `repos-max` below would miss the one-time toast.
[[step]]
keys = ["M"]

[[step]]
capture = "content-noop"
checks = ["titles", "focus"]
ignore = { boxes = ["Command Log"] }

[[step]]
keys = ["1"]

[[step]]
wait = { text = "O Lookup Repository" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[1] Repositories" }

[[step]]
capture = "repos-max"
checks = ["titles", "focus"]

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[2] Pull Requests" }

[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[2] Pull Requests" }

[[step]]
capture = "prs-max"
checks = ["titles", "focus"]

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[3] Issues" }

[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[3] Issues" }

[[step]]
capture = "issues-max"
checks = ["titles", "focus"]

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[4] Workflows" }

[[step]]
keys = ["4"]

[[step]]
wait = { text = "T Trigger Workflow" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[4] Workflows" }

[[step]]
capture = "workflows-max"
checks = ["titles", "focus"]

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[6] Command Log" }

[[step]]
keys = ["6"]

[[step]]
wait = { gone = "T Trigger Workflow" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[6] Command Log" }

[[step]]
capture = "log-max"
checks = ["titles", "focus"]

[expect.content-noop]
focused = ["[5] Details"]
contains = ["[1] Repositories", "[5] Details"]
not_contains = ["View Maximized", "Traceback"]

# `contains` is matched per row, and at 100 columns the message wraps before "return.".
[expect.repos-max]
pane_titles = []
focused = []
contains = ["View Maximized", "Current view maximized. Press escape to"]
not_contains = ["[1] Repositories", "Traceback"]

[expect.prs-max]
pane_titles = []
not_contains = ["[2] Pull Requests", "Traceback"]

[expect.issues-max]
pane_titles = []
not_contains = ["[3] Issues", "Traceback"]

[expect.workflows-max]
pane_titles = []
not_contains = ["[4] Workflows", "Traceback"]

[expect.log-max]
pane_titles = []
not_contains = ["[6] Command Log", "Traceback"]
