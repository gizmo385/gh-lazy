version = 1
description = "M maximizes the focused widget over the whole screen with the View Maximized toast, escape restores it, and 5 then M maximizes the details tabs"
gate = true
parity_rows = ["main-layout.maximize", "keybindings.app-maximize-widget", "main-layout.details-tabs-focused", "main-layout.toasts", "toasts.view-maximized"]
# The maximized widget fills the screen at each size, and the toast's message wraps differently at 100 columns.
sizes = [[160, 48], [100, 30]]

[env]
fixtures = ["base"]

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

# Maximize once the repos are in, so the maximized table has its rows.
[[step]]
wait = { text = "dotfiles" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[1] Repositories" }

# The first maximize raises the toast, drawn bottom-right over the maximized table. `toast-maximize` checks that it
# expires and that the next maximize raises none, so this scenario doesn't wait out its timer.
[[step]]
capture = "max"

[[step]]
keys = ["escape"]

# Wait for the whole layout to come back before capturing: a loaded runner can take longer than the default
# stability wait to redraw after escape.
[[step]]
wait = { text = "[1] Repositories" }

[[step]]
wait = { regex = "╸━+╺" }

[[step]]
capture = "restored"
checks = ["titles", "tabs", "focus"]

[[step]]
keys = ["5"]

[[step]]
wait = { gone = "O Lookup" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[5] Details" }

[[step]]
capture = "max-details"
checks = ["titles", "tabs", "focus"]

# `contains` is matched per row, and at 100 columns the message wraps before "return." (46 content columns).
[expect.max]
pane_titles = []
focused = []
# The maximized repos table pins the rows too: its header and base's three repos, centered on the hatch.
contains = ["View Maximized", "Current view maximized. Press escape to", "★  Owner", "dotfiles", "lazy-demo"]
not_contains = ["[1] Repositories", "Traceback"]

[expect.restored]
focused = ["[1] Repositories"]

[expect.max-details]
pane_titles = []
contains = ["Introduction"]
not_contains = ["[5] Details"]
