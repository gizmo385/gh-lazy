version = 1
description = "M maximizes the focused widget over the whole screen, escape restores it, 5 then M maximizes the details tabs, and M on the details content does nothing"
gate = true
parity_rows = ["main-layout.maximize", "keybindings.app-maximize-widget", "main-layout.details-tabs-focused"]
sizes = [[160, 48], [100, 30]]

[env]
fixtures = ["base"]

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[1] Repositories" }

[[step]]
capture = "max"
checks = ["titles", "focus"]

[[step]]
keys = ["escape"]

# Wait for the whole layout to come back before capturing: a loaded runner can take longer than the default
# stability wait to redraw after escape.
[[step]]
wait = { text = "[1] Repositories" }

[[step]]
wait = { regex = "╸━+╺" }

[[step]]
wait = { stable_ms = 1000 }

[[step]]
capture = "restored"
checks = ["titles", "tabs", "focus"]

# Past the toast's 5 s timeout, so the second maximize shows that no new toast came.
[[step]]
sleep_ms = 5500

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[1] Repositories" }

[[step]]
capture = "max-again"
checks = ["titles", "focus"]

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[5] Details" }

[[step]]
keys = ["5", "M"]

[[step]]
wait = { gone = "[5] Details" }

[[step]]
capture = "max-details"
checks = ["titles", "tabs", "focus"]

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[5] Details" }

# The details content is a Textual `VerticalScroll`, which isn't maximizable: M leaves the layout and focus alone.
[[step]]
keys = ["5", "tab"]

[[step]]
wait = { stable_ms = 800 }

[[step]]
keys = ["M"]

[[step]]
wait = { stable_ms = 1200 }

[[step]]
capture = "content-max-noop"
checks = ["titles", "focus"]

# The first maximize raises the toast. `contains` is matched per row, and at 100 columns the message wraps before
# "return.".
[expect.max]
pane_titles = []
focused = []
contains = ["View Maximized", "Current view maximized. Press escape to"]
not_contains = ["[1] Repositories", "Traceback"]

[expect.restored]
focused = ["[1] Repositories"]

[expect.max-again]
pane_titles = []
not_contains = ["[1] Repositories", "View Maximized"]

[expect.max-details]
pane_titles = []
contains = ["Introduction"]
not_contains = ["[5] Details"]

[expect.content-max-noop]
focused = ["[5] Details"]
contains = ["[1] Repositories", "[5] Details"]
