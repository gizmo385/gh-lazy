version = 2
description = "PR Conversation with body-less reviews of each shape: one that starts no thread of its own shows closed with 'No additional review content' (approved, changes requested) or is hidden (commented), never open and empty"
# Rust only: Python opens a body-less approved or changes-requested review whose comments are all replies drawn in
# another review's thread (or replies to a missing comment) with nothing in it, and hides every body-less comment
# review (Py bug B10). Decision conversation-no-empty-reviews (#346).
parity_rows = ["pull-requests.conversation-empty-review"]
sizes = [[160, 100]]

[env]
# pr-conversation-bodyless replaces PR 5's reviews: 501 (a body, root 9001), 511 (commented, root 9011), 514
# (commented, only 9014 replying to 9011), 512 (approved, root 9012), 516 (approved, no comments), 513 (approved, only
# 9013 replying to 9001) and 515 (changes requested, only 9015 replying to the missing 8999). Issues and Workflows are
# hidden, as in pr-details.
fixtures = ["pr-conversation-bodyless", "pr-details", "base"]
config_overrides = { appearance = { show_issues = false, show_workflows = false } }

[[step]]
wait = { text = "pr-details", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Add a cursor to the viewer", timeout_ms = 15000 }

[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "PR Reviews", timeout_ms = 15000 }

[[step]]
keys = ["5"]

[[step]]
keys = ["right", "right"]

[[step]]
wait = { text = "Review from parity-bot", timeout_ms = 5000 }

[[step]]
wait = { regex = "│━{16}╸━{12}╺", timeout_ms = 5000 }

[[step]]
capture = "conversation"

[expect.conversation]
tabs = { box = "Details", names = ["Overview", "Diff", "Conversation"], active = "Conversation" }
contains = [
    "▶ Review from parity-carol (Approved)",
    "▶ Review from parity-friend (Changes Requested)",
    "▼ Review from parity-friend (Commented)",
    "Agreed, stopping is right.",
    "Renamed.",
]
not_contains = ["▼ Review from parity-carol", "See the thread above."]
