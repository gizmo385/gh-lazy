version = 1
description = "PR Diff tab: the file filter, one section per file (modified, added, deleted), collapsed hunk sections, a hunk pane with the line cursor, and filtering by path"
# The footer is left out of the cross-app checks wherever `^p Command Pallete` shows whole: Python's spelling is Py bug
# B14, which Rust fixes on purpose. Those captures match the footer's text before it with `contains`. After the
# filtered files Python shows the review form (`Submit Review` reads as a table), which is #187 (M3), so `filtered`
# leaves out the table checks.
gate = true
parity_rows = [
    "pull-requests.diff-tab",
    "diff-viewer.viewer",
    "diff-viewer.file-filter",
    "diff-viewer.file-header",
    "diff-viewer.hunk-header",
    "diff-viewer.hunk-pane",
    "diff-viewer.line-cursor",
    "diff-viewer.focus-ring",
    "diff-viewer.diff-parser",
    "keybindings.diff-cursor-down",
    "keybindings.diff-cursor-up",
    "keybindings.diff-filter-files",
]
sizes = [[160, 48], [100, 30]]

[env]
# PR 5's diff: README.md (one hunk), assets/app.css (added), build.rs (Python shows it as uild.rs, Py bug B55),
# docs/old.md (deleted) and src/viewer.rs (two hunks).
fixtures = ["pr-details", "base"]
config_overrides = { appearance = { show_issues = false, show_workflows = false } }

[[step]]
wait = { text = "pr-details", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "parity-friend", timeout_ms = 15000 }

[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait = { stable_ms = 500 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Opened on", timeout_ms = 15000 }

[[step]]
keys = ["right"]

[[step]]
wait = { text = "README.md", timeout_ms = 15000 }

[[step]]
capture = "files"
checks = ["titles", "tabs", "headers", "rows", "cursor", "focus"]

# Tab: the diff's scroll area, the filter, the README.md section's title, its hunk's title; enter opens the hunk.
[[step]]
keys = ["tab", "tab", "tab", "tab", "enter"]

[[step]]
wait = { text = "Line: 1/6", timeout_ms = 5000 }

[[step]]
capture = "hunk-open"
checks = ["titles", "tabs", "headers", "rows", "cursor", "focus"]

# Tab: the hunk pane. j moves the current line down twice, k up once.
[[step]]
keys = ["tab"]

[[step]]
capture = "hunk-focused"

[[step]]
keys = ["j", "j", "k"]

[[step]]
wait = { text = "Line: 2/6", timeout_ms = 5000 }

[[step]]
capture = "line-cursor"

# / focuses the filter; typing keeps only the files whose path contains the text.
[[step]]
keys = ["/"]

[[step]]
type = "view"

[[step]]
wait = { gone = "README.md", timeout_ms = 5000 }

[[step]]
capture = "filtered"
checks = ["titles", "tabs", "focus"]

# Escape clears the filter and leaves it.
[[step]]
keys = ["escape"]

[[step]]
wait = { text = "README.md", timeout_ms = 5000 }

[[step]]
capture = "filter-cleared"
checks = ["titles", "tabs", "headers", "rows", "cursor", "focus"]

[expect.files]
tabs = { box = "Details", names = ["Overview", "Diff", "Conversation"], active = "Diff" }
contains = [
    "Filter files (press '/' to focus, ESC to clear)",
    "▼ 📄 README.md (+3 -1)",
    "▶ Lines 3-7 (+3 -1) • A tiny pager.",
    "▼ 📄 app.css (+3)",
    "▶ Lines 1-3 (+3)",
    "uild.rs (+1)",
    # The tab strip has focus: the screen's keys only.
    "^v Paste link  f Follow link  F Follow link (browser)",
]
not_contains = ["Traceback", "Next Hunk"]

[expect.hunk-open]
contains = [
    "▼ Lines 3-7 (+3 -1) • A tiny pager.",
    "## Usage",
    "Line: 1/6",
    "J Next Hunk  K Previous Hunk  / Filter Files  ^v Paste link",
]

[expect.hunk-focused]
contains = ["j Line down", "k Line up"]

[expect.filtered]
# With the filter focused, only its key and the palette's.
contains = ["▼ 📄 viewer.rs (+5 -2)", " / Filter Files  ^p Command Pal"]
not_contains = ["README.md", "app.css", "Next Hunk"]

# The scroll area has focus: the viewer's keys aren't listed, as the area is outside the viewer that binds them.
[expect.filter-cleared]
contains = ["Filter files (press '/' to focus, ESC to clear)", "^v Paste link  f Follow link  F Follow link (browser)"]
not_contains = ["Next Hunk"]
