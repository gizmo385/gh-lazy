version = 2
description = "PR Diff tab: the tab shows after the spinner, with the diff inside"
# Since the Diff tab became one continuous diff (#388, decision diff-continuous-view), what's inside the tab and its
# keys are Rust-only (`diff-navigation`, `diff-review`). Both apps still share the tab itself, so the capture checks
# the titles and the tab strip and leaves out what's inside the Details box.
parity_rows = ["pull-requests.diff-tab"]
sizes = [[160, 48], [100, 30]]

[env]
# PR 5's diff: README.md (one hunk), assets/app.css (added), build.rs (Python shows it as uild.rs, Py bug B55),
# docs/old.md (deleted) and src/viewer.rs (two hunks).
fixtures = ["pr-details", "base"]
config_overrides = { appearance = { show_issues = false, show_workflows = false } }

[[step]]
wait = { text = "pr-details", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "parity-friend", timeout_ms = 15000 }

[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait = { stable_ms = 500 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Opened on", timeout_ms = 15000 }

[[step]]
keys = ["right"]

[[step]]
wait = { text = "README.md", timeout_ms = 15000 }

[[step]]
capture = "files"

[expect.files]
tabs = { box = "Details", names = ["Overview", "Diff", "Conversation"], active = "Diff" }
contains = ["Filter files (press '/' to focus, ESC to clear)", "README.md (+3 -1)"]
not_contains = ["Traceback", "Loading..."]
