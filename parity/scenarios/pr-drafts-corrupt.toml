version = 1
description = "Create PR (P) with a draft file missing keys: one WARNING line in the command log, and the form opens with the template, no toast"
gate = true
parity_rows = ["modals.pr-drafts", "caches-drafts.pr-drafts"]
sizes = [[160, 48]]

[env]
# pr-create over pr-details: the branches and collaborators Create PR asks for on parity-bot/pr-details.
fixtures = ["pr-create", "pr-details", "base"]
# A draft of parity-bot/pr-details with only two of its seven keys, and work/pr_template.md.
seed = "pr-draft-corrupt"
config_overrides.appearance.show_issues = false
config_overrides.appearance.show_workflows = false
config_overrides.appearance.show_command_log = true
config_overrides.pull_requests.pull_request_template = "pr_template.md"

[[step]]
wait.text = "pr-details"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Add a cursor to the viewer"
wait.timeout_ms = 15000

[[step]]
wait.stable_ms = 500

[[step]]
keys = ["P"]

[[step]]
wait.text = "Template text from pr_template.md"

# The form as it opens, with the template and no toast. The modal covers the Command Log box.
[[step]]
capture = "ignored"
checks = ["footer"]
ignore = { boxes = ["Command Log"] }

# Closed, the Command Log shows the warning. The line names the run's temp path, so only its start is matched, and
# the Command Log box is ignored.
[[step]]
keys = ["escape"]

[[step]]
wait.gone = "New Pull Request"

[[step]]
wait = { regex = "WARNING .* - PR draft file '", timeout_ms = 15000 }

[[step]]
capture = "warning"
checks = ["titles", "focus"]
ignore = { boxes = ["Command Log"] }

[expect.ignored]
contains = ["New Pull Request", "Template text from pr_template.md"]
not_contains = ["Restored saved PR draft", "Half a draft", "Traceback"]

[expect.warning]
contains = ["PR draft file '"]
not_contains = ["New Pull Request", "Traceback"]

