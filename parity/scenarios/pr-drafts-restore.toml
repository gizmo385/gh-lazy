version = 2
description = "Create PR (P) restores a saved draft over the template prefill: every field filled in, the reviewer listed, and the toast"
# Rust draws the dialog as the compose sheet (decision compose-dialogs): its captures were never compared with Python's
# (Python's 100 x 36 modal hides the panes and leaves the main footer under it, Rust's sheet leaves the panes in view
# and has its own footer), and [expect] checks the text both show. In the sheet the first escape leaves the field and
# the second closes; in Python the second reaches the main screen, where it does nothing.
parity_rows = ["modals.pr-drafts", "caches-drafts.pr-drafts"]
sizes = [[160, 48]]

[env]
# pr-create over pr-details: the branches and collaborators Create PR asks for on parity-bot/pr-details.
fixtures = ["pr-create", "pr-details", "base"]
# The draft of parity-bot/pr-details as Python saves it, and work/pr_template.md.
seed = "pr-draft"
config_overrides.appearance.show_issues = false
config_overrides.appearance.show_workflows = false
config_overrides.pull_requests.pull_request_template = "pr_template.md"

[[step]]
wait.text = "pr-details"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Add a cursor to the viewer"
wait.timeout_ms = 15000

[[step]]
wait.stable_ms = 500

[[step]]
keys = ["P"]

[[step]]
wait.text = "Restored saved PR draft"

[[step]]
capture = "restored"

# Focusing the list (title, description, reviewers input, list): Python scrolls it into view from below the fold,
# Rust's Reviewers section expands into its input and the reviewers' items.
[[step]]
keys = ["tab", "tab", "tab"]

[[step]]
wait.regex = 'Current Reviewers - Click/Select them to remove|parity-friend ✕'

[[step]]
capture = "reviewers"

[expect.reviewers]
contains = ["parity-friend"]
not_contains = ["Traceback"]

[expect.restored]
contains = ["Restored saved PR draft", "Restored draft title", "Restored draft body.", "feature/restored"]
not_contains = ["Template text from pr_template.md", "Traceback"]
