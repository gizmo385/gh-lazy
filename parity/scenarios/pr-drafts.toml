version = 1
description = "Create PR drafts (P): a title typed and escape saves the draft; reopening restores it with the toast; the title cleared and the dialog closed deletes it, so the next open is empty"
# The 2 s debounce is covered by the Rust unit tests rather than a sleep here: closing saves at once.
# Rust draws the dialog as the compose sheet (decision compose-dialogs): its captures compare nothing across apps
# (Python's 100 x 36 modal hides the panes and leaves the main footer under it, Rust's sheet leaves the panes in view
# and has its own footer), and [expect] checks the text both show. In the sheet the first escape leaves the field and
# the second closes; in Python the second reaches the main screen, where it does nothing.
gate = true
parity_rows = ["modals.pr-drafts"]
sizes = [[160, 48]]

[env]
# pr-create over pr-details: the branches and collaborators Create PR asks for on parity-bot/pr-details.
fixtures = ["pr-create", "pr-details", "base"]
config_overrides.appearance.show_issues = false
config_overrides.appearance.show_workflows = false

[[step]]
wait.text = "pr-details"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Add a cursor to the viewer"
wait.timeout_ms = 15000

[[step]]
wait.stable_ms = 500

[[step]]
keys = ["P"]

[[step]]
wait.text = "New Pull Request"

# No draft saved yet: the form as it opens, and no toast.
[[step]]
capture = "open"
checks = []

[[step]]
type = "Draft title"

# Closing saves the draft before the modal closes.
[[step]]
keys = ["escape", "escape"]

[[step]]
wait.gone = "New Pull Request"

[[step]]
keys = ["P"]

[[step]]
wait.text = "Restored saved PR draft"

[[step]]
capture = "restored"
checks = []

# Clear the title, then close: an empty form deletes the draft. (Python's Cancel did the same; Rust's sheet has no
# Cancel button.) The toast is waited out first, on the modal: Textual moves toasts to the screen below when the
# modal closes, so a `gone` wait after closing can pass between the two screens and the next capture would still
# show it.
[[step]]
keys = ["backspace", "backspace", "backspace", "backspace", "backspace", "backspace", "backspace", "backspace", "backspace", "backspace", "backspace"]

[[step]]
wait.gone = "Restored saved PR draft"
wait.timeout_ms = 15000

[[step]]
keys = ["escape", "escape"]

[[step]]
wait.gone = "New Pull Request"

[[step]]
keys = ["P"]

[[step]]
wait.text = "New Pull Request"

[[step]]
wait.stable_ms = 500

[[step]]
capture = "cleared"
checks = []

[expect.open]
contains = ["New Pull Request", "Base", "main", "Title", "Description"]
not_contains = ["Restored saved PR draft", "Traceback"]

[expect.restored]
contains = ["New Pull Request", "Restored saved PR draft", "Draft title"]
not_contains = ["Traceback"]

[expect.cleared]
contains = ["New Pull Request"]
not_contains = ["Restored saved PR draft", "Draft title", "Traceback"]
