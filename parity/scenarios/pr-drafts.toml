version = 1
description = "Create PR drafts (P): a title typed and escape saves the draft; reopening restores it with the toast; the title cleared and Cancel deletes it, so the next open is empty"
# The 2 s debounce is covered by the Rust unit tests rather than a sleep here: escape and Cancel save at once.
gate = true
parity_rows = ["modals.pr-drafts"]
sizes = [[160, 48]]

[env]
# pr-create over pr-details: the branches and collaborators Create PR asks for on parity-bot/pr-details.
fixtures = ["pr-create", "pr-details", "base"]
config_overrides.appearance.show_issues = false
config_overrides.appearance.show_workflows = false

[[step]]
wait.text = "pr-details"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Add a cursor to the viewer"
wait.timeout_ms = 15000

[[step]]
wait.stable_ms = 500

[[step]]
keys = ["P"]

[[step]]
wait.text = "New Pull Request"

# No draft saved yet: the form as it opens, and no toast.
[[step]]
capture = "open"
checks = ["footer"]

[[step]]
type = "Draft title"

# escape saves the draft before the modal closes.
[[step]]
keys = ["escape"]

[[step]]
wait.gone = "New Pull Request"

[[step]]
keys = ["P"]

[[step]]
wait.text = "Restored saved PR draft"

[[step]]
capture = "restored"
checks = ["footer"]

# Clear the title, then Cancel (title, description, reviewer, Create, Cancel): an empty form deletes the draft. The
# toast is waited out first, on the modal: Textual moves toasts to the screen below when the modal closes, so a
# `gone` wait after closing can pass between the two screens and the next capture would still show it.
[[step]]
keys = ["backspace", "backspace", "backspace", "backspace", "backspace", "backspace", "backspace", "backspace", "backspace", "backspace", "backspace"]

[[step]]
wait.gone = "Restored saved PR draft"
wait.timeout_ms = 15000

[[step]]
keys = ["tab", "tab", "tab", "tab", "enter"]

[[step]]
wait.gone = "New Pull Request"

[[step]]
keys = ["P"]

[[step]]
wait.text = "New Pull Request"

[[step]]
wait.stable_ms = 500

[[step]]
capture = "cleared"
checks = ["footer"]

[expect.open]
contains = ["New Pull Request", "Base", "main", "Title", "Description"]
not_contains = ["Restored saved PR draft", "Traceback"]

[expect.restored]
contains = ["New Pull Request", "Restored saved PR draft", "Draft title"]
not_contains = ["Traceback"]

[expect.cleared]
contains = ["New Pull Request"]
not_contains = ["Restored saved PR draft", "Draft title", "Traceback"]
