version = 2
description = "Edit PR (E) refused: a merged PR from the table (warning, no dialog), then a refused update of PR 4 (the error toast, the dialog stays open)"
# shift+enter is sent in the kitty keyboard protocol's encoding (CSI 13;2 u), which both apps read
# (terminal-caveats.shift-enter). Python moves focus a tick after a focus key (Py bug B98), so each waits for it.
# Rust draws the dialog as the compose sheet (decision compose-dialogs): its captures were never compared with Python's
# (Python's 100 x 36 modal hides the panes and leaves the main footer under it, Rust's sheet leaves the panes in view
# and has its own footer), and [expect] checks the text both show. In the sheet the first escape leaves the field and
# the second closes; in Python the second reaches the main screen, where it does nothing.
# Split from pr-edit, whose PR 5 captures would otherwise sit under these toasts.
parity_rows = [
    "modals.edit-pr",
    "pull-requests.edit-from-table",
    "keybindings.pull-request-edit",
    "toasts.edit-pr-already-merged",
]
sizes = [[160, 48]]
timeout_ms = 60000

[env]
# pr-edit over pr-details: requested reviewers of PR 4, collaborators, the branches Python lists, and PATCH
# .../pulls/4 refused (403 after 1 s).
fixtures = ["pr-edit", "pr-details", "base"]
# Keeps the Rust app's toasts up to the end: they last 5 s and outlive the dialog that raised them, so which earlier
# toasts a capture showed depended on how fast the run got there.
toast_timeout_ms = 60000
config_overrides.appearance.show_issues = false
config_overrides.appearance.show_workflows = false
config_overrides.pull_requests.additional_suggested_pr_reviewers = ["octo-reviewer"]

[[step]]
wait.text = "pr-details"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Add a cursor to the viewer"
wait.timeout_ms = 15000

# PR 3 is merged: a warning, and no dialog.
[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait.stable_ms = 500

[[step]]
keys = ["j", "j", "E"]

[[step]]
wait.text = "This PR has already been merged!"

[[step]]
capture = "already-merged"

# PR 4: a new title, refused by GitHub.
[[step]]
keys = ["k", "E"]

[[step]]
wait.text = "Editing PR 4"

[[step]]
wait.stable_ms = 500

[[step]]
capture = "open-pr4"

[[step]]
type = "Drop the old renderer"

[[step]]
type = "\u001b[13;2u"

[[step]]
wait.text = "Updating PR..."

[[step]]
wait.log.method = "PATCH"
wait.log.path = "/repos/parity-bot/pr-details/pulls/4"
wait.log.body.title = "Drop the old renderer"
wait.log.body.body = "Superseded by the new renderer."
wait.log.body.base = "main"

[[step]]
wait.text = "Unexpected error while attempting to update PR"

[[step]]
capture = "update-failed"

[expect.already-merged]
focused = ["[2] Pull Requests"]
contains = ["This PR has already been merged!"]
not_contains = ["Editing PR"]

[expect.open-pr4]
contains = ["Editing PR 4", "Base", "Compare", "Draft", "Title", "Drop the legacy renderer", "Description", "Superseded by the new renderer."]

[expect.update-failed]
contains = ["Editing PR 4", "Error updating pull request", "Unexpected error while attempting to update PR"]
