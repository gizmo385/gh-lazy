version = 2
description = "Edit PR (E) on PR 5: a new title, the Reviewers input (already a reviewer, an unknown user, a suggestion accepted and added), the existing reviewer removed, Update (PATCH, then only the new reviewer requested), and E again from the PR Overview with nothing changed"
# shift+enter is sent in the kitty keyboard protocol's encoding (CSI 13;2 u), which both apps read
# (terminal-caveats.shift-enter). Python moves focus a tick after a focus key (Py bug B98), so each waits for it.
# Rust draws the dialog as the compose sheet (decision compose-dialogs): its captures were never compared with Python's
# (Python's 100 x 36 modal hides the panes and leaves the main footer under it, Rust's sheet leaves the panes in view
# and has its own footer), and [expect] checks the text both show. In the sheet the first escape leaves the field and
# the second closes; in Python the second reaches the main screen, where it does nothing.
# Rust's one-row fields and borderless editor draw no outline `wait.focused` reads, so a focus move Python makes late
# is waited out with `sleep_ms`, or on text only the newly focused part shows.
# The merged PR's warning and the refused update are pr-edit-refused, so their toasts don't cover these dialogs.
parity_rows = [
    "modals.edit-pr",
    "modals.pr-reviewers",
    "modals.form-widgets",
    "modals.input-suggestions",
    "modals.text-editor",
    "pull-requests.edit-from-table",
    "pull-requests.overview-edit",
    "keybindings.pull-request-edit",
]
sizes = [[160, 48]]
timeout_ms = 90000

[env]
# pr-edit over pr-details: requested reviewers of PR 5, collaborators, two users, the branches Python lists,
# PATCH .../pulls/5 for the new title (after 1.5 s), and POST .../pulls/5/requested_reviewers for ["parity-friend"]
# and for [].
fixtures = ["pr-edit", "pr-details", "base"]
# Keeps the Rust app's toasts up to the end: they last 5 s and outlive the dialog that raised them, so which earlier
# toasts a capture showed depended on how fast the run got there.
toast_timeout_ms = 60000
config_overrides.appearance.show_issues = false
config_overrides.appearance.show_workflows = false
config_overrides.pull_requests.additional_suggested_pr_reviewers = ["octo-reviewer"]

[[step]]
wait.text = "pr-details"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Add a cursor to the viewer"
wait.timeout_ms = 15000

[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait.stable_ms = 500

# PR 5, the first row: the dialog opens once the pull request and its requested reviewers are fetched.
[[step]]
keys = ["E"]

[[step]]
wait.text = "Editing PR 5"
wait.timeout_ms = 15000

[[step]]
wait.stable_ms = 500

[[step]]
capture = "open"

# The title is focused with its text selected, so typing replaces it.
[[step]]
type = "Add a cursor to the diff viewer"

# The description, then the Reviewers input, scrolled into view.
[[step]]
keys = ["tab"]

# Python moves focus a tick after a tab (Py bug B121): each key for the new focus waits for it to show.
[[step]]
sleep_ms = 500

[[step]]
keys = ["tab"]

# Python scrolls the list's label into view; Rust's Reviewers section expands into its input beside its label.
[[step]]
wait.regex = 'Current Reviewers - Click/Select them to remove|Reviewers   Reviewer to add'

[[step]]
capture = "reviewers"

[[step]]
type = "Parity-Reviewer"

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Already a reviewer!"

[[step]]
capture = "already-reviewer"

[[step]]
keys = ["ctrl+u"]

[[step]]
type = "nobody-here"

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Could not find user"

[[step]]
capture = "unknown-user"

[[step]]
keys = ["ctrl+u"]

[[step]]
type = "parity-fr"

[[step]]
wait.text = "parity-friend"

[[step]]
capture = "suggestion"

[[step]]
keys = ["right", "enter"]

[[step]]
wait.log.method = "GET"
wait.log.path = "/users/parity-friend"

[[step]]
wait.stable_ms = 500

[[step]]
capture = "added"

# Into the list. It was empty when built, so nothing is highlighted until `down` highlights its first row,
# parity-reviewer (the existing request); toggling it takes it off the list.
[[step]]
keys = ["tab"]

# Python's list shows its focus; Rust's items have no highlight until `down`, so the move is waited out.
[[step]]
sleep_ms = 500

[[step]]
capture = "list-focused"

[[step]]
keys = ["down", "space"]

[[step]]
wait.text = "Removing parity-reviewer"

[[step]]
capture = "removed"

# Update: the title changed, so PATCH; then only the reviewer not already requested.
[[step]]
type = "\u001b[13;2u"

[[step]]
wait.text = "Updating PR..."

[[step]]
wait.log.method = "PATCH"
wait.log.path = "/repos/parity-bot/pr-details/pulls/5"
wait.log.body.title = "Add a cursor to the diff viewer"
wait.log.body.body = "Adds a cursor to the viewer, as discussed in #3.\n\n- `j` and `k` move it\n- the current line is marked with `>`\n\nThanks @parity-bot for the first review!\n"
wait.log.body.base = "main"

[[step]]
wait.log.method = "POST"
wait.log.path = "/repos/parity-bot/pr-details/pulls/5/requested_reviewers"
wait.log.body.reviewers = ["parity-friend"]

[[step]]
wait.text = "Successfully updated PR!"

[[step]]
wait.gone = "Editing PR 5"

[[step]]
wait.text = "PR #5 Details"

[[step]]
wait.text = "Add a cursor to the diff viewer    "

[[step]]
wait.stable_ms = 1000

[[step]]
capture = "updated"
# Python races the dialog handing focus back to the table against the reselected PR focusing its details, so
# focus isn't checked here; Rust focuses the details, as a selection from the table does.

# From the PR Overview's content: nothing changed, so no PATCH; both reviewers are requested already, and Python
# requests an empty list.
[[step]]
wait.text = "Status checks:"

[[step]]
keys = ["5"]

[[step]]
wait = { focused = "Details" }

[[step]]
wait.stable_ms = 500

[[step]]
keys = ["tab"]

# The Overview's content has focus once its merge key shows in the footer.
[[step]]
wait = { text = "^m Merge PR" }

[[step]]
keys = ["E"]

[[step]]
wait.text = "Editing PR 5"

[[step]]
wait.text = "parity-friend"

[[step]]
wait.stable_ms = 500

[[step]]
capture = "from-overview"

[[step]]
type = "\u001b[13;2u"

[[step]]
wait.log.method = "POST"
wait.log.path = "/repos/parity-bot/pr-details/pulls/5/requested_reviewers"
wait.log.body.reviewers = []

[[step]]
wait.text = "Successfully updated PR!"

[[step]]
wait.gone = "Editing PR 5"

[[step]]
capture = "overview-updated"

[expect.open]
contains = ["Editing PR 5", "Title", "Add a cursor to the viewer", "Description", "Adds a cursor to the viewer, as discussed in #3."]

[expect.reviewers]
contains = ["Reviewers", "Reviewer to add", "parity-reviewer", "Update"]

[expect.already-reviewer]
contains = ["Already a reviewer!"]

[expect.unknown-user]
contains = ["Could not find user nobody-here"]

[expect.suggestion]
contains = ["parity-friend"]

[expect.added]
contains = ["parity-reviewer", "parity-friend"]
not_contains = ["Could not find user parity-friend"]

[expect.removed]
contains = ["Removing parity-reviewer", "parity-friend"]

[expect.updated]
contains = ["Successfully updated PR!", "Add a cursor to the diff viewer"]
not_contains = ["Editing PR", "Traceback"]

[expect.from-overview]
contains = ["Editing PR 5", "Add a cursor to the diff viewer"]

[expect.overview-updated]
contains = ["Successfully updated PR!", "Add a cursor to the diff viewer (#5)"]
not_contains = ["Editing PR", "Traceback"]
