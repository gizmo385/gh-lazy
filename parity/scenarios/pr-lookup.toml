version = 1
description = "PR lookup (O on the Pull Requests table): the dialog, an empty number, an unknown number, and a PR missing from the table, which is added and selected"
gate = true
parity_rows = [
    "pull-requests.lookup",
    "modals.lookup-pr",
    "keybindings.pull-request-lookup",
    "modals.dialog-buttons",
    "modals.lookup-modals",
]
sizes = [[160, 48]]

[env]
# PR 9 exists but isn't on the issues page (as if opened after the list was fetched); PR 42 doesn't exist.
fixtures = ["pr-details", "base"]
config_overrides = { appearance = { show_issues = false, show_workflows = false } }

[[step]]
wait = { text = "pr-details", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Add a cursor to the viewer", timeout_ms = 15000 }

[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait = { stable_ms = 500 }

[[step]]
keys = ["O"]

[[step]]
wait = { text = "Search for a pull request by number", timeout_ms = 5000 }

[[step]]
capture = "dialog"

# The input has focus; tab reaches Lookup. With nothing typed: error "Must enter a valid pull request number!".
[[step]]
keys = ["tab"]

# Python moves focus a tick after a tab (Py bug B121): each key for the new focus waits for it to show.
[[step]]
wait = { focused = "Lookup" }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Must enter a valid pull request number!", timeout_ms = 5000 }

[[step]]
capture = "empty-number"

# Back to the input, 42, Lookup: error "Could not find pull request!", and the dialog stays open.
[[step]]
keys = ["shift+tab"]

# The input is empty and so invalid: focused, its outline is drawn in `$error`, not `$border`, which wait.focused
# doesn't read (#360), and nothing else on screen shows the move. Sleep so the shift+tab lands (Py bug B121).
[[step]]
sleep_ms = 500

[[step]]
type = "42"

[[step]]
keys = ["tab"]

[[step]]
wait = { focused = "Lookup" }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Could not find pull request!", timeout_ms = 5000 }

[[step]]
capture = "unknown-number"

# 9 instead: the dialog closes, PR 9 joins the table and its details open.
[[step]]
keys = ["shift+tab"]

[[step]]
wait = { focused = "Pull Request Number:" }

[[step]]
keys = ["backspace", "backspace"]

[[step]]
type = "9"

[[step]]
keys = ["tab"]

[[step]]
wait = { focused = "Lookup" }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "[5] PR #9 Details", timeout_ms = 15000 }

[[step]]
wait = { text = "Opened on", timeout_ms = 5000 }

[[step]]
capture = "found"
# The footer is left out: with the details strip focused it isn't cut off at 160 columns, and Python spells
# `^p Command Pallete` (Py bug B14), which Rust fixes on purpose.
checks = ["titles", "headers", "rows", "cursor", "focus"]

[expect.dialog]
contains = ["Search for a pull request by number:", "Pull Request Number:", "Pull request number", "Lookup", "Cancel"]
not_contains = ["Traceback"]

[expect.empty-number]
contains = ["Invalid PR Number", "Must enter a valid pull request number!", "Search for a pull request by number:"]

[expect.unknown-number]
contains = ["Unknown PR", "Could not find pull request!", "Search for a pull request by number:"]

[expect.found]
contains = ["Clamp the cursor to the last line", "Open Clamp the cursor to the last line (#9) by parity-friend"]
not_contains = ["Search for a pull request by number:"]
