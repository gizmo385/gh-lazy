version = 2
description = "Maximize from the Diff tab's review form: the review summary through the palette's Maximize, the Review Status select and the Submit Review button with M; each maximizes the details tab area, and escape restores it with focus kept"
# The summary is an input, so M types into it (Py bug B38); the palette's Maximize is how Python reaches its nearest
# maximizable ancestor. The filter's captures moved to the Rust-only `diff-navigation` (#388): Python's filter is
# reached through its scroll area, which Rust's Diff tab no longer has. A rebound maximize key works on the inputs in
# Rust only (B38's answer), so it's unit-tested rather than captured here. A maximized tab area has no boxes, so those
# captures are checked through [expect] `contains` and `not_contains`.
parity_rows = ["main-layout.maximize"]
sizes = [[160, 48]]

[env]
fixtures = ["pr-details", "base"]

[env.config_overrides.appearance]
show_issues = false
show_workflows = false

[[step]]
wait = { text = "pr-details", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Add a cursor to the viewer", timeout_ms = 15000 }

# Python moves focus a tick after a focus key (Py bug B98), so wait for the PR table's bindings in the footer.
[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait = { stable_ms = 500 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Opened on", timeout_ms = 15000 }

[[step]]
keys = ["right"]

[[step]]
wait = { text = "README.md", timeout_ms = 15000 }

# From the repos table, shift+tab enters the details content at its last stop, the Submit Review button: M maximizes,
# with the one-time toast. The screen settles first, so the review form is in.
[[step]]
wait = { stable_ms = 600 }

# Python moves focus a tick after a tab (Py bug B121), so each M or ctrl+p below waits for the move to show.
[[step]]
keys = ["1"]

[[step]]
wait = { text = "O Lookup Repository" }

[[step]]
keys = ["shift+tab"]

[[step]]
wait = { focused = "Submit Review" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[5] PR #5 Details" }

[[step]]
capture = "submit"

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[5] PR #5 Details" }

# The stop before it, the review summary: an input, which types M, so the palette maximizes.
[[step]]
keys = ["shift+tab"]

[[step]]
wait = { focused = "Review summary" }

[[step]]
keys = ["ctrl+p"]

[[step]]
wait = { text = "Search for commands" }

[[step]]
type = "max"

[[step]]
wait = { text = "Maximize the focused widget" }

[[step]]
keys = ["enter"]

# The palette covers the Details title, so its going is the first signal.
[[step]]
wait = { gone = "Maximize the focused widget" }

[[step]]
wait = { gone = "[5] PR #5 Details" }

[[step]]
capture = "summary"

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[5] PR #5 Details" }

# The stop before it, the Review Status select, closed: M maximizes.
[[step]]
keys = ["shift+tab"]

[[step]]
wait = { focused = "Review Status:" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[5] PR #5 Details" }

[[step]]
capture = "review-status"

[expect.submit]
pane_titles = []
contains = ["Overview  Diff  Conversation", "Submit Review", "View Maximized"]
not_contains = ["[1] Repositories"]

[expect.summary]
pane_titles = []
contains = ["Overview  Diff  Conversation", "Review summary"]
not_contains = ["[1] Repositories"]

[expect.review-status]
pane_titles = []
contains = ["Overview  Diff  Conversation", "Review Status:", "Commented"]
not_contains = ["[1] Repositories"]
