version = 2
description = "M in the PR Conversation tab: the scroll area does nothing; a review's title or a comment in it maximizes the review; a comment's reactions title its reactions; a comment outside a review the details tab area"
# The Diff tab's captures (the filter typing M, a file's and a hunk's title, the hunk pane) went with #388: the Diff
# tab is one continuous diff, whose `M` maximizes the tab area (Rust-only `diff-navigation`, `maximized`).
# A maximized section has no boxes, tables or tabs, so those captures are checked through [expect] `contains` and
# `not_contains`. The footer is hidden while maximized.
parity_rows = ["pull-requests.collapsible", "main-layout.maximize"]
sizes = [[160, 48]]
# Four maximizes take Python close to the default 30 s run under load.
timeout_ms = 60000

[env]
fixtures = ["pr-details", "base"]
config_overrides = { appearance = { show_issues = false, show_workflows = false } }

[[step]]
wait = { text = "pr-details", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Add a cursor to the viewer", timeout_ms = 15000 }

# Python moves focus a tick after a focus key (Py bug B98), so wait for the PR table's bindings in the footer.
[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait = { stable_ms = 500 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Opened on", timeout_ms = 15000 }

[[step]]
keys = ["right", "right"]

[[step]]
wait = { text = "Review from parity-bot", timeout_ms = 5000 }

# The comments' reactions arrive after the conversation, below the fold, and the last comment's adds a focus stop.
# Nothing on screen changes, so this waits out the requests.
[[step]]
wait = { stable_ms = 1000 }

# Python moves focus a tick after a tab (Py bug B121), so each M below waits for the tab before it to show.
#
# The scroll area: a no-op, with nothing to wait for (a maximize here would take the toast from `review-title`). Its
# focus shows as its binding leading the footer.
[[step]]
keys = ["tab"]

[[step]]
wait = { regex = '(?m)^ n New Comment  ' }

[[step]]
keys = ["M"]

[[step]]
capture = "conversation-noop"

[[step]]
keys = ["tab"]

[[step]]
wait = { focused = "Review from parity-bot" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[5] PR #5 Details" }

[[step]]
capture = "review-title"

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[5] PR #5 Details" }

# The review's first comment: its nearest maximizable ancestor is the review's section.
[[step]]
keys = ["tab"]

[[step]]
wait = { focused = "Should the cursor wrap at the end?" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[5] PR #5 Details" }

[[step]]
capture = "review-comment"

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[5] PR #5 Details" }

# From the repos table, shift+tab enters the details content at its last stop: the last comment outside a review,
# whose nearest maximizable ancestor is the details tab area.
[[step]]
keys = ["1"]

[[step]]
wait = { text = "O Lookup Repository" }

# Python scrolls the comment into view with its bottom edge still under the details' border, so wait.focused can't
# see its box: wait for the comment's bindings to lead the footer instead.
[[step]]
keys = ["shift+tab"]

[[step]]
wait = { regex = '(?m)^ r Reply to Comment  ' }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[5] PR #5 Details" }

[[step]]
capture = "top-comment"

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[5] PR #5 Details" }

# The stop before it: the previous comment's reactions title, which maximizes the reactions section. The emoji split
# its cursor into runs, so the wait matches the first.
[[step]]
keys = ["shift+tab"]

[[step]]
wait = { focused = "▶ 👍" }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[5] PR #5 Details" }

[[step]]
capture = "comment-reactions"

[expect.conversation-noop]
focused = ["[5] PR #5 Details"]
contains = ["n New Comment"]
not_contains = ["View Maximized"]

[expect.review-title]
pane_titles = []
contains = ["  ▼ Review from parity-bot (Commented)", "      Looks close. One question inline.", "No, it stops at the last line.", "View Maximized"]
not_contains = ["parity-reviewer", "Overview  Diff  Conversation"]

[expect.review-comment]
pane_titles = []
contains = ["  ▼ Review from parity-bot (Commented)", "╏ Should the cursor wrap at the end?"]
not_contains = ["parity-reviewer", "Overview  Diff  Conversation"]

[expect.top-comment]
pane_titles = []
contains = ["Overview  Diff  Conversation", "╏ Is this related to #4?"]
not_contains = ["[5] PR #5 Details", "Quit"]

[expect.comment-reactions]
pane_titles = []
contains = ["  ▶ 👍 1 | 🚀 1"]
not_contains = ["Rebased on main", "Overview  Diff  Conversation"]
