version = 1
description = "M on the PR Overview's focus stops: the body does nothing; a section's title or list maximizes that section alone, centered on the hatch, with the one-time toast; enter toggles it while maximized; M again does nothing; a focus key moves focus but keeps the section; escape restores"
# A maximized section has no boxes, tables or tabs, so those captures are checked through [expect] `contains` and
# `not_contains`. The footer is hidden while maximized.
gate = true
parity_rows = ["pull-requests.collapsible", "main-layout.maximize"]
sizes = [[160, 48]]

[env]
# pr-details adds parity-bot/pr-details as the first repo; PR 5 has reactions, failing checks and reviews.
fixtures = ["pr-details", "base"]
config_overrides = { appearance = { show_issues = false, show_workflows = false } }

[[step]]
wait = { text = "pr-details", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Add a cursor to the viewer", timeout_ms = 15000 }

# Python drops an enter that follows a focus key at once, so the PR table gets a moment to take focus.
[[step]]
keys = ["2"]

[[step]]
wait = { stable_ms = 500 }

[[step]]
keys = ["enter"]

# Each section is a focus stop only once its data is in (Textual skips loading widgets). Python sometimes cuts a
# replaced title to its placeholder's width (Py bug B57), so the waits only look at the start of each title.
[[step]]
wait = { text = "PR Reviews", timeout_ms = 15000 }

[[step]]
wait = { text = "Status checks:", timeout_ms = 5000 }

[[step]]
wait = { text = "👍 2", timeout_ms = 5000 }

# Python applies a focus move only after keys already queued behind it, so each M below waits for the screen to settle
# after the tab before it.
#
# The body is a scrolling container, which Textual doesn't maximize. A no-op draws nothing to wait for; if M did
# maximize here, `reactions-title` would miss the one-time toast.
[[step]]
keys = ["tab"]

[[step]]
wait = { stable_ms = 300 }

[[step]]
keys = ["M"]

[[step]]
capture = "body-noop"
checks = ["titles", "headers", "rows", "cursor", "focus"]

[[step]]
keys = ["tab"]

[[step]]
wait = { stable_ms = 300 }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[5] PR #5 Details" }

[[step]]
capture = "reactions-title"
checks = ["titles", "focus"]

# Enter on the maximized title opens the section in place; the view grows and stays centered.
[[step]]
keys = ["enter"]

[[step]]
wait = { text = "👍: parity-bot, parity-friend" }

[[step]]
capture = "reactions-open"
checks = ["titles", "focus"]

# M while maximized does nothing; escape restores the layout, with the section still open and its title focused.
[[step]]
keys = ["M", "escape"]

[[step]]
wait = { text = "[5] PR #5 Details" }

[[step]]
capture = "restored"
checks = ["titles", "headers", "rows", "cursor", "focus"]

# The open section's list maximizes the section too.
[[step]]
keys = ["tab"]

[[step]]
wait = { stable_ms = 300 }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[5] PR #5 Details" }

[[step]]
capture = "reactions-list"
checks = ["titles", "focus"]

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[5] PR #5 Details" }

[[step]]
keys = ["tab"]

[[step]]
wait = { stable_ms = 300 }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[5] PR #5 Details" }

[[step]]
capture = "checks-title"
checks = ["titles", "focus"]

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[5] PR #5 Details" }

[[step]]
keys = ["tab"]

[[step]]
wait = { stable_ms = 300 }

[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[5] PR #5 Details" }

[[step]]
capture = "reviews-title"
checks = ["titles", "focus"]

# A focus key moves focus to the PR table, but the section stays maximized until escape.
[[step]]
keys = ["2"]

[[step]]
capture = "focus-key"
checks = ["titles", "focus"]

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[5] PR #5 Details" }

[[step]]
capture = "restored-prs"
checks = ["titles", "headers", "rows", "cursor", "focus"]

[expect.body-noop]
focused = ["[5] PR #5 Details"]
not_contains = ["View Maximized"]

[expect.reactions-title]
pane_titles = []
contains = ["  ▶ 👍 2 | 🎉 1 | 👀 4", "View Maximized", "Current view maximized. Press escape to return."]
not_contains = ["Status checks", "Open Add a cursor to the viewer", "Quit"]

[expect.reactions-open]
pane_titles = []
contains = ["  ▼ 👍 2 | 🎉 1 | 👀 4", "    👍: parity-bot, parity-friend", "    👀: parity-bot, parity-reviewer, parity-carol, and 1 more"]
not_contains = ["Status checks"]

[expect.restored]
focused = ["[5] PR #5 Details"]
contains = ["▼ 👍 2 | 🎉 1 | 👀 4", "👍: parity-bot, parity-friend", "▶ Status checks:"]

[expect.reactions-list]
pane_titles = []
contains = ["  ▼ 👍 2 | 🎉 1 | 👀 4", "    🎉: parity-bot"]
not_contains = ["Status checks"]

[expect.checks-title]
pane_titles = []
contains = ["  ▶ Status checks: ✘ Failed"]
not_contains = ["👍", "PR Reviews"]

[expect.reviews-title]
pane_titles = []
contains = ["  ▶ PR Reviews"]
not_contains = ["👍", "Status checks"]

[expect.focus-key]
pane_titles = []
contains = ["  ▶ PR Reviews"]
not_contains = ["[2] Pull Requests"]

[expect.restored-prs]
focused = ["[2] Pull Requests"]
