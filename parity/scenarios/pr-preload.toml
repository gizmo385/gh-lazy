version = 1
description = "Preload the PR for the current commit: launched on a feature branch of the selected repo with preload_pull_request_for_current_commit on, the one PR for the local commit opens in Details without taking focus"
# The origin is SSH so both apps pick up the current-directory repo (Py bug B5).
gate = true
parity_rows = [
    "pull-requests.preload-current-commit",
    "config.pull-requests-preload-pull-request-for-current-commit",
]

[env]
# pr-preload: GET /repos/parity-bot/pr-details/commits/<the harness's commit>/pulls answers PR 5, which pr-details has.
fixtures = ["pr-preload", "pr-details", "base"]
git_remote = "parity-bot/pr-details"
git_remote_protocol = "ssh"
git_branch = "new-feature"

[env.config_overrides]
pull_requests = { preload_pull_request_for_current_commit = true }

[[step]]
wait = { text = "Current repo: parity-bot/pr-details", timeout_ms = 15000 }

[[step]]
wait = { text = "Overview  Diff  Conversation", timeout_ms = 15000 }

[[step]]
wait = { text = "Add a cursor to the viewer", timeout_ms = 15000 }

# The Conversation tab loads its comments' reactions in the background, below the fold. The two apps ask for
# different ones (Py bug B54: Python asks for review comments' reactions on the issue comments path, and for an empty
# comment's), so this waits for the screen to settle rather than for a request.
[[step]]
wait = { stable_ms = 1000 }

[[step]]
capture = "preloaded"
checks = ["titles", "tabs", "focus"]

[expect.preloaded]
contains = ["Current repo: parity-bot/pr-details", "Overview  Diff  Conversation", "Add a cursor to the viewer"]
tabs = { box = "Details", names = ["Overview", "Diff", "Conversation"], active = "Overview" }
focused = ["[1] Repositories"]
