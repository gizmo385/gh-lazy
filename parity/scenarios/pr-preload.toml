version = 1
description = "Launched on a feature branch of a clone of the selected repo with preload_pull_request_for_current_commit on: the one pull request for the local commit shows in the details, and focus stays on the repos"
# The origin is SSH so both apps pick up the current-directory repo (Py bug B5). The harness's commit is
# 77a3f2ceb72bcca424cae588f347fc970b288bbf on every run, and the pr-preload fixture puts it on PR 3 alone.
gate = true
parity_rows = [
    "pull-requests.preload-current-commit",
    "config.pull-requests-preload-pull-request-for-current-commit",
]
sizes = [[160, 48]]

[env]
fixtures = ["pr-preload", "pr-details", "base"]
git_remote = "parity-bot/pr-details"
git_remote_protocol = "ssh"
git_branch = "new-feature"
config_overrides.pull_requests.preload_pull_request_for_current_commit = true
config_overrides.appearance.show_issues = false
config_overrides.appearance.show_workflows = false

[[step]]
wait.text = "Current repo: parity-bot/pr-details"
wait.timeout_ms = 15000

[[step]]
wait.text = "[5] PR #3 Details"
wait.timeout_ms = 15000

[[step]]
wait.text = "Release 0.2.0"

[[step]]
wait.stable_ms = 500

[[step]]
capture = "preloaded"
checks = ["titles", "focus", "footer"]

[expect.preloaded]
pane_titles = ["", "[1] Repositories", "[5] PR #3 Details", "[2] Pull Requests"]
focused = ["[1] Repositories"]
contains = ["Release 0.2.0"]
not_contains = ["Traceback"]
