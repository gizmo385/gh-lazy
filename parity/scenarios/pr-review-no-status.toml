version = 1
description = "Diff review: Submit Review with the Review Status set to its blank option is refused with an error toast and posts nothing"
# The same way into the Submit review form as pr-review. The status list's blank option ("Select") sits above Approved.
gate = true
parity_rows = [
    "toasts.review-status-missing",
]
sizes = [[160, 48]]

[env]
fixtures = ["pr-details", "base"]
config_overrides.appearance.show_issues = false
config_overrides.appearance.show_workflows = false

[[step]]
wait.text = "pr-details"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "parity-friend"
wait.timeout_ms = 15000

# Python moves focus a tick after a focus key (Py bug B98), so wait for the PR table's bindings in the footer.
[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait.stable_ms = 500

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Opened on"
wait.timeout_ms = 15000

[[step]]
keys = ["right"]

# The diff first, then a moment for the review form, which follows the current user. Rust's form is below the diff's
# lines, out of view until focus reaches it (#388).
[[step]]
wait.text = "README.md"

[[step]]
wait.stable_ms = 600

[[step]]
keys = ["1"]

[[step]]
wait = { text = "O Lookup Repository" }

# Back around the ring from the repos table: Submit Review, the summary, the status select. Python moves focus a tick
# after a tab (Py bug B121), so each key for the new focus waits for it to show.
[[step]]
keys = ["shift+tab", "shift+tab", "shift+tab"]

[[step]]
wait = { focused = "Review Status:" }

# Open the list (Commented is highlighted), up three times to the blank option.
[[step]]
keys = ["enter"]

[[step]]
wait.text = "Changes Requested"

[[step]]
keys = ["up", "up", "up", "enter"]

[[step]]
wait.gone = "Commented"

# Python hands focus back to the select a moment after its list closes, and drops keys that come before that.
[[step]]
wait = { focused = "Review Status:" }

[[step]]
capture = "status-blank"
checks = ["titles", "focus"]

[[step]]
keys = ["tab"]

[[step]]
wait = { focused = "Review summary" }

[[step]]
keys = ["tab"]

[[step]]
wait = { focused = "Submit Review" }

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Please select a status for the new review!"

[[step]]
capture = "refused"
checks = ["titles", "focus"]

[expect.status-blank]
contains = ["Review Status:", "Select", "Review summary", "Submit Review"]
not_contains = ["Commented", "Traceback"]

[expect.refused]
contains = ["Please select a status for the new review!", "Review Status:", "Submit Review"]
not_contains = ["New review created!", "Traceback"]
