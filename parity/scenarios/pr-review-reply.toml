version = 2
description = "PR Conversation: r on a review's own block (not one of its comments) opens the reply modal for the review"
# pr-comment sends r on a review comment, where the comment's binding wins; this sends it on the review's title, so
# the review block's binding answers. The modal's footer isn't compared (Rust binds `modal.submit` there, Py bug B17).
parity_rows = [
    "keybindings.conversation-review-reply",
]
sizes = [[160, 48]]

[env]
fixtures = ["pr-details", "base"]
config_overrides.appearance.show_issues = false
config_overrides.appearance.show_workflows = false

[[step]]
wait.text = "pr-details"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Add a cursor to the viewer"
wait.timeout_ms = 15000

[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait.stable_ms = 500

[[step]]
keys = ["enter"]

[[step]]
wait.text = "PR Reviews"
wait.timeout_ms = 15000

[[step]]
wait.text = "Status checks:"

[[step]]
wait.text = "👍 2"

[[step]]
keys = ["5"]

[[step]]
wait = { focused = "Details" }

[[step]]
keys = ["right", "right"]

[[step]]
wait.text = "Review from parity-bot"

# Let the comments' reactions arrive (Python adds their sections below the fold, out of a wait's sight), so nothing
# redraws under the next keys.
[[step]]
wait.stable_ms = 1000

# The scroll area, then the first review's title.
[[step]]
keys = ["tab", "tab"]

# Python moves focus a tick after a tab (Py bug B121): wait for the review's title to show it.
[[step]]
wait = { focused = "Review from parity-bot" }

[[step]]
capture = "review-focused"

[[step]]
keys = ["r"]

[[step]]
wait.text = "Replying to comment from"

# Rust draws the modal as the compose sheet (decision compose-dialogs), which leaves the panes behind it in view
# where Python's 100 x 50 modal hides them: nothing is compared across apps, [expect] checks the text.
[[step]]
capture = "reply-open"

[expect.reply-open]
# The review's body is quoted. Rust's sheet is short, so the thread's comment shows behind it.
contains = ["Replying to comment from parity-bot", "Looks close. One question inline.", "Preview"]
not_contains = ["Traceback"]
