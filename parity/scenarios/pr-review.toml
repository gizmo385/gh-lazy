version = 2
description = "Diff review: the Submit review form (Review Status, summary) at the end of the Diff tab, reached from the repos table, posts the review; the PR author's form has only the summary and Add Comments"
# Add Comment and the pending comments are reached through the diff's lines, which Python's keys and Rust's continuous
# diff (#388, decision diff-continuous-view) reach differently, so they're in the Rust-only `diff-review`; both apps
# still reach the form from the repos table with shift+tab. After the submit Rust refetches the PR (B15), so that
# isn't in [expect].
parity_rows = [
    "diff-viewer.submit-review",
    "toasts.comment-review-added",
]
sizes = [[160, 48]]

[env]
# pr-write over pr-details: POST .../pulls/5/reviews answers the review only for the bodies submitted: this
# scenario's (APPROVE, PR 5's head sha, "Looks good." and no comments) and diff-review's.
fixtures = ["pr-write", "pr-details", "base"]
config_overrides.appearance.show_issues = false
config_overrides.appearance.show_workflows = false

[[step]]
wait.text = "pr-details"
wait.timeout_ms = 15000

[[step]]
keys = ["enter"]

[[step]]
wait.text = "parity-friend"
wait.timeout_ms = 15000

# Python moves focus a tick after a focus key (Py bug B98), so wait for the PR table's bindings in the footer.
[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait.stable_ms = 500

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Opened on"
wait.timeout_ms = 15000

[[step]]
keys = ["right"]

[[step]]
wait.text = "README.md"

# Review Status: open the list (Commented is highlighted), up twice to Approved.
[[step]]
keys = ["1"]

[[step]]
wait = { text = "O Lookup Repository" }

# Back around the ring from the repos table: Submit Review, the summary, the status select.
[[step]]
keys = ["shift+tab", "shift+tab", "shift+tab"]

[[step]]
wait = { focused = "Review Status:" }

[[step]]
capture = "status-focused"

# Scrolled up three notches, the box is near the details' bottom: the open list doesn't fit below it, and moves up
# until its bottom border is on the footer row, over the footer (#364).
[[step]]
wheel = { at = [110, 30], direction = "up" }

[[step]]
wait.stable_ms = 400

[[step]]
wheel = { at = [110, 30], direction = "up" }

[[step]]
wait.stable_ms = 400

[[step]]
wheel = { at = [110, 30], direction = "up" }

[[step]]
wait.stable_ms = 400

[[step]]
keys = ["enter"]

[[step]]
wait.text = "Changes Requested"

[[step]]
capture = "status-list-bottom"

# The list's bottom border, on the footer row: nothing happens, no footer binding runs.
[[step]]
click = { at = [66, 47] }

[[step]]
wait.stable_ms = 500

[[step]]
capture = "status-list-footer-click"

# Commented, the last option, on the details box's bottom border row: picked, and the list closes.
[[step]]
click = { at = [70, 46] }

[[step]]
wait.gone = "Changes Requested"

[[step]]
capture = "status-list-picked"

[[step]]
keys = ["enter", "up", "up", "enter"]

[[step]]
wait.text = "Approved"

# Python hands focus back to the select a moment after its list closes, and drops keys that come before that.
[[step]]
wait = { focused = "Review Status:" }

[[step]]
keys = ["tab"]

[[step]]
wait = { focused = "Review summary" }

[[step]]
type = "Looks good."

[[step]]
keys = ["tab"]

[[step]]
wait = { focused = "Submit Review" }

[[step]]
keys = ["enter"]

[[step]]
wait.log.method = "POST"
wait.log.path = "/repos/parity-bot/pr-details/pulls/5/reviews"
wait.log.body.event = "APPROVE"
wait.log.body.commit_id = "c0ffee5555555555555555555555555555555555"
wait.log.body.body = "Looks good."
wait.log.body.comments = []

[[step]]
wait.text = "New review created!"

# Rust fetches the PR again before showing it (B15); Python shows the stale one at once. Either way the Overview tab
# shows again.
[[step]]
wait.text = "Opened on"

[[step]]
capture = "submitted"

# PR 3 is parity-bot's own: the form has only the summary and Add Comments.
[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait.stable_ms = 500

[[step]]
keys = ["j", "j", "enter"]

[[step]]
wait.text = "Merged Release 0.2.0 (#3)"
wait.timeout_ms = 15000

[[step]]
keys = ["right"]

[[step]]
wait.text = "Add Comments"

[[step]]
keys = ["1"]

[[step]]
wait = { text = "O Lookup Repository" }

[[step]]
wait.stable_ms = 500

[[step]]
keys = ["shift+tab"]

[[step]]
wait = { gone = "O Lookup Repository" }

[[step]]
capture = "author-form"

[expect.status-focused]
contains = ["Review Status:", "Commented", "Review summary", "Submit Review"]

[expect.status-list-bottom]
contains = ["Changes Requested"]
not_contains = ["Palette ▁"]

[expect.status-list-footer-click]
contains = ["Changes Requested"]
not_contains = ["Search for commands"]
focused = ["[5] PR #5 Details"]

[expect.status-list-picked]
contains = ["Review Status:", "Commented"]
not_contains = ["Changes Requested"]

[expect.submitted]
contains = ["New review created!"]
not_contains = ["Traceback"]

[expect.author-form]
contains = ["Review summary", "Add Comments"]
not_contains = ["Review Status:", "Submit Review", "Traceback"]
