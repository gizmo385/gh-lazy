version = 2
description = "Started in a clone of a repo in the table: that repo is selected with no key pressed"
# With the harness's HTTPS remote Python never selects (it keeps the `.git`, Py bug B5), so `origin` is spelled over
# SSH, which both apps parse.
parity_rows = [
    "repositories.auto-select-cwd-repo",
    "main-layout.status-current-repo",
    "infrastructure.git-detection",
    "infrastructure.parity-git-remote-protocol",
    "cli.original-pwd",
]
sizes = [[160, 48]]

[env]
fixtures = ["repo-selected-empty", "base"]
git_remote = "parity-bot/dotfiles"
git_remote_protocol = "ssh"
config_overrides = { appearance = { show_command_log = true } }

# No key is pressed: the selection comes from the current directory once the repos fill the table.
[[step]]
wait = { text = "Current repo: parity-bot/dotfiles", timeout_ms = 15000 }

[[step]]
capture = "auto"

[expect.auto]
contains = [
    "Current repo: parity-bot/dotfiles",
    "[5] parity-bot/dotfiles Details",
    "Selected repo parity-bot/dotfiles",
]
focused = ["[1] Repositories"]
tabs = { box = "Details", names = ["Repo Overview"], active = "Repo Overview" }
not_contains = ["Traceback"]
