version = 1
description = "Selecting a repo fills the Pull Requests table from the issues endpoint: the PRs of a mixed page, newest first, maximized, and the next page on G"
gate = true
parity_rows = [
  "pull-requests.table",
  "pull-requests.columns",
  "pull-requests.rows-from-issues",
  "searchable-tables.lazy-loading",
  "main-layout.maximize",
  "issues.table",
  "issues.columns",
  "issues.filters",
]
sizes = [[160, 48]]

[env]
# repo-lists adds parity-bot/browse-fixture as the first repo: numbers 100 to 36 over three issues-endpoint pages, where
# a number divisible by 3 is a pull request and the rest are issues.
fixtures = ["repo-lists", "base"]

[[step]]
wait = { text = "browse-fixture", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Browse fixture pull request 99", timeout_ms = 15000 }

# Python sometimes draws the Details tab underline zero-width after a selection (#209).
[[step]]
capture = "loaded"
checks = ["titles", "headers", "rows", "cursor", "focus"]
ignore = { boxes = ["Details"] }

# The Issues table's 20 issues from the shared first page: G puts the cursor on issue 71 (row 20 of 20), which asks for
# page 2 with the default `issues.*` filters. These steps come before the PR ones because they send the first page-2
# and page-3 requests, which the log waits rely on.
[[step]]
keys = ["3", "G"]

[[step]]
wait = { log = { method = "GET", path = "/repos/parity-bot/browse-fixture/issues", query = { page = "2", per_page = "30", state = "all" } }, timeout_ms = 15000 }

[[step]]
capture = "issues-page-2"
checks = ["rows", "cursor"]
ignore = { boxes = ["Details"] }

# Page 2 doesn't move the cursor (row 20 of 40); the new bottom row asks for page 3.
[[step]]
keys = ["G"]

[[step]]
wait = { log = { method = "GET", path = "/repos/parity-bot/browse-fixture/issues", query = { page = "3", per_page = "30", state = "all" } }, timeout_ms = 15000 }

[[step]]
capture = "issues-page-3"
checks = ["rows", "cursor"]
ignore = { boxes = ["Details"] }

[[step]]
keys = ["2", "M"]

[[step]]
wait = { gone = "[1] Repositories" }

[[step]]
capture = "prs-maximized"
checks = ["rows", "cursor", "focus"]

# Wait for the layout to come back: an escape followed at once by the next key reaches the app as alt+G.
[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[1] Repositories" }

# G asks for page 2, whose newest PR, 69, shows below 72 in the focused box. Text waits, not request waits: the issue
# steps above already sent the same page requests.
[[step]]
keys = ["G"]

[[step]]
wait = { text = "Browse fixture pull request 69", timeout_ms = 15000 }

[[step]]
capture = "prs-page-2"
checks = ["rows", "cursor"]
ignore = { boxes = ["Details"] }

[expect.loaded]
contains = ["Browse fixture pull request 99"]
not_contains = ["Traceback"]

# PR 90's title is checked maximized: in the 160x48 layout the Title column is too narrow for its last character.
[expect.prs-maximized]
contains = ["[WIP] Browse fixture pull request 90"]
not_contains = ["Traceback"]

[expect.issues-page-2]
not_contains = ["Traceback"]

[expect.issues-page-3]
not_contains = ["Traceback"]

[expect.prs-page-2]
not_contains = ["Traceback"]
