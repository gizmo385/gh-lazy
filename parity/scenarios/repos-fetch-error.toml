version = 1
description = "The repos list fails: the loading overlay, then an empty table, one error line in the command log and no toast"
gate = true
parity_rows = ["repositories.loading", "main-layout.loading-spinner"]
sizes = [[160, 48]]

[env]
# repos-error answers the repos list with a 500 after 1.5 s.
fixtures = ["repos-error", "base"]

[env.config_overrides]
appearance = { show_command_log = true }

[[step]]
wait = { text = "Loading...", timeout_ms = 15000 }

[[step]]
capture = "loading"
checks = ["titles", "focus"]

[[step]]
wait = { regex = 'ERROR \d{4}-\d\d-\d\d \d\d:\d\d:\d\d - Error fetching repositories from Github API' }

# The PR, Issues and Workflows sections have no table in Rust yet: #171, #172 and #173 each remove their box here. The
# log's lines carry the time, which differs between the apps; the expectation checks the line.
[[step]]
capture = "error"
checks = ["titles", "headers", "rows", "focus"]
ignore = { boxes = ["Pull Requests", "Issues", "Workflows", "Command Log"] }

[expect.loading]
contains = ["Loading..."]

[expect.error]
contains = ["Error fetching repositories from Github API"]
not_contains = ["dotfiles", "Traceback"]
