version = 1
description = "Search modal: s on the PR table opens it prefilled with is:pr is:open and the repo scope; enter lists the hits; enter on a hit opens it in Details; s restores the session; the palette opens it too, and a cross-repo search with all of GitHub pages to the 1,000-result cap (#394)"
# Rust-only: Python has no search beyond the tables' / box (decision search-issues-and-prs). The modal's tall frame
# isn't a box to the extractor, so its content is loose text, checked with [expect].
gate = true
apps = ["rust"]
parity_rows = [
    "modals.search",
    "modals.search-scope",
    "modals.search-results",
    "modals.search-open-hit",
    "modals.search-session",
    "keybindings.search-open",
    "command-palette.search",
]
sizes = [[160, 48], [100, 30]]

[env]
# search has the hits; pr-details lists parity-bot/pr-details first and has PR 5; issue-details and base the rest.
fixtures = ["search", "pr-details", "issue-details", "base"]

[[step]]
wait = { text = "pr-details", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Current repo: parity-bot/pr-details", timeout_ms = 15000 }

[[step]]
# Cut at 100x30.
wait = { text = "Add a curso", timeout_ms = 15000 }

[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
capture = "issues-footer"

[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
capture = "prs-footer"

[[step]]
keys = ["s"]

[[step]]
wait = { text = "Type a query and press enter" }

[[step]]
capture = "opened"

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "3 results", timeout_ms = 15000 }

[[step]]
capture = "results"

# PR 5 is the second hit.
[[step]]
keys = ["j", "enter"]

[[step]]
wait = { gone = "3 results" }

[[step]]
wait = { text = "PR #5", timeout_ms = 15000 }

[[step]]
capture = "opened-pr"

[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
keys = ["s"]

[[step]]
wait = { text = "3 results" }

[[step]]
capture = "restored"

[[step]]
keys = ["escape"]

[[step]]
wait = { gone = "Search issues and pull requests" }

[[step]]
keys = ["ctrl+p"]

[[step]]
wait = { text = "Search for commands" }

[[step]]
type = "search issues"

[[step]]
wait = { text = "Search GitHub's issues and pull requests" }

[[step]]
keys = ["enter"]

# The palette restores the session, with the table focused: back to the input, replace the text, then pick all of
# GitHub, which searches again at once since a search was sent.
[[step]]
wait = { text = "3 results" }

[[step]]
keys = ["shift+tab", "shift+tab", "ctrl+u"]

[[step]]
type = "is:pr author:@me"

[[step]]
keys = ["tab", "enter"]

[[step]]
wait = { text = "All of GitHub" }

[[step]]
keys = ["end", "enter"]

[[step]]
wait = { text = "1,234 results", timeout_ms = 15000 }

[[step]]
capture = "cross-repo"

[[step]]
keys = ["G"]

[[step]]
wait = { text = "Search result 50" }

[[step]]
wait = { log = { method = "GET", path = "/search/issues", query = { advanced_search = "true", page = "2", per_page = "50", q = "is:pr author:@me" } }, timeout_ms = 15000 }

[[step]]
wait = { stable_ms = 300 }

[[step]]
keys = ["G"]

[[step]]
wait = { text = "Search result 100" }

