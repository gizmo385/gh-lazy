[expect.issues-footer]
contains = ["s Search GitHub"]

[expect.prs-footer]
contains = ["s Search GitHub"]

[expect.opened]
contains = [
    "Search issues and pull requests",
    "Scope:",
    "This repo (parity-bot/pr-details)",
    "is:pr is:open",
    "is:pr is:issue is:open is:merged",
    "Type a query and press enter",
]
footer = ["esc Close"]

[expect.results]
contains = [
    "3 results",
    "#  Type  Status  Author",
    "Clamp the cursor to the last line",
    "Add a cursor to the viewer",
    "Try a faster parser",
]
# No Repo column for the repo scope.
not_contains = ["Repo   ", "Searching"]
footer = ["/ Search", "q Close"]

[expect.opened-pr]
# The tab strip has focus.
focused = ["[5] PR #5 Details"]
contains = ["Current repo: parity-bot/pr-details", "PR #5", "Overview"]
not_contains = ["Search issues and pull requests", "Could not open"]

[expect.restored]
contains = ["3 results", "Add a cursor to the viewer", "is:pr is:open"]
footer = ["/ Search", "q Close"]

[expect.cross-repo]
contains = [
    "All of GitHub",
    "is:pr author:@me",
    "1,234 results · GitHub returns the first 1,000",
    "Repo",
    "parity-bot/issue-fixture",
    "Search result 1 ",
]
footer = ["/ Search", "q Close"]

[expect.paged]
contains = ["1,234 results · GitHub returns the first 1,000", " 1001  PR"]
not_contains = ["loading more failed"]
