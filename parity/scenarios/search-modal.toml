[expect.issues-footer]
contains = ["s Search GitHub"]

[expect.prs-footer]
contains = ["s Search GitHub"]

[expect.opened]
contains = [
    "Search issues and pull requests",
    "Scope:",
    "This repo (parity-bot/pr-details)",
    "is:pr is:open",
    "is:pr is:issue is:open is:merged",
    "Type a query and press enter",
]
footer = ["⏎ Search", "esc Results"]

[expect.results]
contains = [
    "3 results",
    "#  Type  Status  Author",
    # The title gives way at 100x30 ("Clamp the cursor to the last …"), so the dates show in full.
    "Clamp the cursor to the last",
    "Add a cursor to the viewer",
    "Try a faster parser",
    "Updated",
    "2026-02-05",
    "2026-01-05",
]
# No Repo column for the repo scope.
not_contains = ["Repo   ", "Searching"]
footer = ["⏎ Open", "/ Query", "q Close"]

[expect.query-again]
contains = ["3 results", "is:pr is:open", "Add a cursor to the viewer"]
# The table's own filter box never shows.
not_contains = ["Search..."]
footer = ["⏎ Search", "esc Results"]

[expect.back-to-results]
contains = ["3 results", "Add a cursor to the viewer"]
not_contains = ["Search..."]
footer = ["⏎ Open", "/ Query", "q Close"]

[expect.opened-pr]
# The tab strip has focus.
focused = ["[5] PR #5 Details"]
contains = ["Current repo: parity-bot/pr-details", "PR #5", "Overview"]
not_contains = ["Search issues and pull requests", "Could not open"]

[expect.restored]
contains = ["3 results", "Add a cursor to the viewer", "is:pr is:open"]
footer = ["⏎ Open", "/ Query", "q Close"]

[expect.cross-repo]
contains = [
    "All of GitHub",
    "is:pr author:@me",
    "1,234 results · GitHub returns the first 1,000",
    "Repo",
    # The repo and the title give way at 100x30 ("parity-bot/is…", "Search resul…"); the number, type and date
    # don't.
    "parity-bot/",
    "Search resul",
    " 2000  PR    open",
    "2026-10-28",
]
footer = ["⏎ Open", "/ Query", "q Close"]

[expect.paged]
contains = ["1,234 results · GitHub returns the first 1,000", " 1001  PR"]
not_contains = ["loading more failed"]
