version = 1
description = "Settings Save and Cancel: Save applies the theme (Nord), hides a section the config now hides, starts the notification count when notifications are turned on, and toasts \"Settings updated\"; reopening shows the saved values; escape after a change discards it"
# The modal is loose text (see settings.toml). After the theme changes, the focus color no longer matches the
# config's theme in parity/themes.toml, so captures after the save compare titles only; the theme switch is
# checked in the report's screens and by unit tests. config.json's contents are unit-tested.
gate = true
parity_rows = [
    "modals.settings-save",
    "modals.settings-apply",
    "modals.settings-cancel",
    "modals.settings-widgets",
    "toasts.settings-updated",
]

[env]
fixtures = ["notifications-3", "base"]

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

[[step]]
wait = { text = "dotfiles" }

[[step]]
keys = ["ctrl+p"]

[[step]]
wait = { text = "Search for commands" }

[[step]]
type = "settings"

[[step]]
wait = { text = "Adjust LazyGithub settings" }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "LazyGithub Settings" }

# The scroll area, then the Theme select: open its list and pick Nord (two below Textual Dark). Python moves focus a
# tick after a tab (Py bug B121), so each key for the new focus waits for it to show.
[[step]]
keys = ["tab", "tab"]

[[step]]
wait = { focused = "Theme:" }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Textual Light" }

[[step]]
capture = "theme-list"
checks = ["footer"]

[[step]]
keys = ["down", "down", "enter"]

[[step]]
wait = { gone = "Textual Light" }

# Python hands focus back to the select a moment after its list closes, and keys sent before that reopen the list
# (#352): wait for the modal's footer to replace the list's, then for the select's focus outline.
[[step]]
wait = { text = "q Close" }

[[step]]
wait = { focused = "Theme:" }

# Show Command Log, Show Workflows, Show Issues: turn Show Issues off.
[[step]]
keys = ["tab", "tab", "tab"]

[[step]]
wait = { focused = "Show Issues:" }

[[step]]
keys = ["enter"]

# Back to the tab strip, then the Notifications tab's Enabled switch: on. Python routes a key to the widget focused
# when it reads the key, so right waits for the shift+tabs to land (#352).
[[step]]
keys = ["shift+tab", "shift+tab", "shift+tab", "shift+tab", "shift+tab"]

[[step]]
wait = { focused = "Appearance" }

[[step]]
keys = ["right"]

[[step]]
wait = { text = "Mark Notification As Read When Selected" }

[[step]]
wait = { focused = "Notifications" }

[[step]]
keys = ["tab", "tab"]

[[step]]
wait = { focused = "Enabled:" }

[[step]]
keys = ["enter"]

[[step]]
capture = "edited"
checks = ["footer"]

# Mark Notification As Read When Selected, then Save.
[[step]]
keys = ["tab", "tab"]

[[step]]
wait = { focused = "Save" }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Settings updated" }

[[step]]
wait = { text = "Unread Notifications: 3" }

[[step]]
capture = "saved"
checks = ["titles"]

[[step]]
keys = ["ctrl+p"]

[[step]]
wait = { text = "Search for commands" }

[[step]]
type = "settings"

[[step]]
wait = { text = "Adjust LazyGithub settings" }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "LazyGithub Settings" }

[[step]]
capture = "reopened"
checks = ["footer"]

# Show Workflows off, then escape: nothing is saved and the section stays. The modal is in Nord now, so the switch's
# focus outline is in Nord's $border, which wait.focused (reading the config's textual-dark colors) can't see, and
# nothing else on screen shows the move: give Python's late focus (Py bug B121) a moment instead.
[[step]]
keys = ["tab", "tab", "tab", "tab"]

[[step]]
sleep_ms = 500

[[step]]
keys = ["enter", "escape"]

[[step]]
wait = { gone = "LazyGithub Settings" }

[[step]]
capture = "cancelled"
checks = ["titles"]

[expect.theme-list]
contains = ["Textual Dark", "Textual Light", "Nord", "Gruvbox"]

[expect.saved]
pane_titles = ["", "[1] Repositories", "[5] Details", "[2] Pull Requests", "[4] Workflows"]
contains = ["Settings updated", "Unread Notifications: 3"]
not_contains = ["LazyGithub Settings"]

[expect.reopened]
contains = ["LazyGithub Settings", "Theme:", "Nord"]
not_contains = ["Textual Dark"]

[expect.cancelled]
pane_titles = ["", "[1] Repositories", "[5] Details", "[2] Pull Requests", "[4] Workflows"]
not_contains = ["LazyGithub Settings"]
