version = 1
description = "Main screen right after launch, no current-directory repo"
gate = true
parity_rows = ["main-layout.layout", "repositories.table", "repositories.columns"]
sizes = [[160, 48], [100, 30]]

[env]
fixtures = ["base"]

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

[[step]]
wait = { text = "dotfiles" }

# The PR, Issues and Workflows sections have no table in Rust yet: #171, #172 and #173 each remove their box here.
[[step]]
capture = "main"
ignore = { boxes = ["Pull Requests", "Issues", "Workflows"] }

# Taken from the Python capture. The footer is the full binding list: at 160 and 100 columns the screen cuts it off,
# which the footer expectation allows (parity/README.md, "Checks").
[expect.main]
pane_titles = ["", "[1] Repositories", "[5] Details", "[2] Pull Requests", "[3] Issues", "[4] Workflows"]
focused = ["[1] Repositories"]
footer = [
    "/ Search",
    "^f Toggle Favorite",
    "O Lookup Repository",
    "u View User",
    "I New Issue",
    "P New PR",
    "^v Paste link",
    "f Follow link",
    "F Follow link (browser)",
    "q Quit",
    "^p Command Pallete",
    "M Maximize",
    "? Keybindings",
]
tabs = { box = "Details", names = ["Introduction"], active = "Introduction" }
contains = ["parity-bot", "No repository selected"]
not_contains = ["Traceback"]
