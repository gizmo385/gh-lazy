version = 2
description = "Selecting a repo in the repos table: the bar shows Current repo: owner/name"
# The harness's HTTPS remote never auto-selects on the Python side: Python keeps the `.git` (Py bug B5), so no repo
# matches. Selecting with enter reaches the same `set_currently_loaded_repo`; `repo-auto-select` covers the
# current-directory default with an SSH remote.
parity_rows = [
    "main-layout.status-current-repo",
    "repositories.select",
    "main-layout.details-title",
    "repositories.introduction-replaced-on-select",
    "keybindings.common-table-select",
]
sizes = [[160, 48]]

[env]
fixtures = ["repo-selected-empty", "base"]

[[step]]
wait = { text = "dotfiles", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Current repo: parity-bot/dotfiles", timeout_ms = 15000 }

[[step]]
capture = "selected"

# No `tabs`: with the zero-width underline (#209) Python's strip isn't read as a tab bar at all, which happens in most
# runs of this scenario, so the tab name is in `contains` instead, as in `repo-overview`.
[expect.selected]
contains = ["Current repo: parity-bot/dotfiles", "[5] parity-bot/dotfiles Details", "Repo Overview"]
focused = ["[1] Repositories"]
not_contains = ["Traceback", "Introduction"]
