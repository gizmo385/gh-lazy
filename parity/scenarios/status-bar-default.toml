version = 1
description = "Status bar with the default config: no repo selected, and the notifications half blank"
gate = true
parity_rows = ["main-layout.status-summary", "main-layout.status-current-repo", "main-layout.status-unread"]
sizes = [[160, 48], [100, 30]]

[env]
fixtures = ["base"]

[[step]]
wait = { text = "No repository selected", timeout_ms = 15000 }

# The section tables are M2 (#78 only drew the shell), so only titles and focus are compared; the bar's text is
# checked per app with `[expect]`.
[[step]]
capture = "main"
checks = ["titles", "focus"]

[expect.main]
contains = ["No repository selected"]
not_contains = ["Unread", "unread", "Traceback"]
