version = 2
description = "A full first page of 50 unread notifications shows 50+"
parity_rows = ["main-layout.status-summary", "main-layout.status-unread", "main-layout.unread-refresh", "main-layout.fixed-accent-colors"]
sizes = [[160, 48]]

[env]
fixtures = ["notifications-50", "base"]

[env.config_overrides]
notifications = { enabled = true }

[[step]]
wait = { text = "• Unread Notifications: 50+", timeout_ms = 15000 }

# The section tables are M2 (#78 only drew the shell), so only titles and focus are compared; the bar's text is
# checked with `[expect]`.
[[step]]
capture = "main"

[expect.main]
contains = ["No repository selected", "• Unread Notifications: 50+"]
not_contains = ["Traceback"]
