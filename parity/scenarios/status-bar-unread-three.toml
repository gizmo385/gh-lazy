version = 1
description = "Notifications enabled with three unread: the bar shows the count in red"
gate = true
parity_rows = ["main-layout.status-summary", "main-layout.status-unread", "main-layout.unread-refresh"]
sizes = [[160, 48], [100, 30]]

[env]
fixtures = ["notifications-3", "base"]

[env.config_overrides]
notifications = { enabled = true }

[[step]]
wait = { text = "• Unread Notifications: 3", timeout_ms = 15000 }

# The section tables are M2 (#78 only drew the shell), so only titles and focus are compared; the bar's text is
# checked per app with `[expect]`.
[[step]]
capture = "main"
checks = ["titles", "focus"]

[expect.main]
contains = ["No repository selected", "• Unread Notifications: 3"]
not_contains = ["Traceback"]
