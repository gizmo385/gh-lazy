version = 1
description = "Notifications enabled with nothing unread: the bar shows No unread notifications"
gate = true
parity_rows = ["main-layout.status-summary", "main-layout.status-unread", "main-layout.unread-refresh", "main-layout.fixed-accent-colors"]
sizes = [[160, 48]]

[env]
fixtures = ["notifications-0", "base"]

[env.config_overrides]
notifications = { enabled = true }

[[step]]
wait = { text = "No unread notifications", timeout_ms = 15000 }

# The section tables are M2 (#78 only drew the shell), so only titles and focus are compared; the bar's text is
# checked per app with `[expect]`.
[[step]]
capture = "main"
checks = ["titles", "focus"]

[expect.main]
contains = ["No repository selected", "No unread notifications"]
not_contains = ["Traceback"]
