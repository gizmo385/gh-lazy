version = 1
description = "Searchable table: lazy loading asks for the next page when the cursor nears the end of a 70-PR table (30, 30, 10)"
# Flipped to true by the M2 pull-requests-table issue, which puts a lazy table on screen.
gate = false
parity_rows = ["searchable-tables.lazy-loading"]
sizes = [[160, 48]]

[env]
# prs-70's /user/repos page 1 is base's three repos plus parity-bot/lazy-fixture.
fixtures = ["prs-70", "base"]

[[step]]
wait = { text = "Pull Requests", timeout_ms = 15000 }

# The repo is picked by hand rather than with `git_remote`: Python keeps the `.git` of the harness's HTTPS remote
# (Py bug B5), so it never selects the current-directory repo. lazy-fixture is the fourth repo.
[[step]]
wait = { text = "lazy-fixture", timeout_ms = 15000 }

[[step]]
keys = ["1", "j", "j", "j", "enter"]

# The first page is in the table once its newest PR shows.
[[step]]
wait = { text = "Lazy fixture pull request 70", timeout_ms = 15000 }

# The bottom row leaves 1 remaining, which asks for page 2.
[[step]]
keys = ["2", "G"]

[[step]]
wait = { log = { method = "GET", path = "/repos/parity-bot/lazy-fixture/issues", query = { page = "2", per_page = "30", state = "all" } }, timeout_ms = 15000 }

[[step]]
capture = "after-page-2"
checks = ["rows", "cursor"]

# Page 2 doesn't move the cursor (row 29 of 60); the new bottom row asks for page 3.
[[step]]
keys = ["G"]

[[step]]
wait = { log = { method = "GET", path = "/repos/parity-bot/lazy-fixture/issues", query = { page = "3", per_page = "30", state = "all" } }, timeout_ms = 15000 }

[[step]]
capture = "after-page-3"
checks = ["rows", "cursor"]

[expect.after-page-2]
not_contains = ["Traceback"]

[expect.after-page-3]
not_contains = ["Traceback"]
