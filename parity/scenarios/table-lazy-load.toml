version = 1
description = "Searchable table: lazy loading asks for the next page when the cursor nears the end of a 70-PR table (30, 30, 10)"
gate = true
parity_rows = [
  "searchable-tables.lazy-loading",
  "pull-requests.table",
  "pull-requests.columns",
  "pull-requests.rows-from-issues",
  "issues.table",
]
sizes = [[160, 48]]

[env]
# prs-70's /user/repos page 1 is base's three repos plus parity-bot/lazy-fixture.
fixtures = ["prs-70", "base"]
# prs-70's first page is all PRs and lazy-fixture has no runs, so Issues and Workflows are ` (empty)`.

[[step]]
wait = { text = "Pull Requests", timeout_ms = 15000 }

# The repo is picked by hand rather than with `git_remote`: Python keeps the `.git` of the harness's HTTPS remote
# (Py bug B5), so it never selects the current-directory repo. lazy-fixture is the fourth repo.
[[step]]
wait = { text = "lazy-fixture", timeout_ms = 15000 }

[[step]]
keys = ["1"]

[[step]]
wait = { text = "O Lookup Repository" }

[[step]]
keys = ["j", "j", "j", "enter"]

# The first page is in the table once its newest PR shows.
[[step]]
wait = { text = "Lazy fixture pull request 70", timeout_ms = 15000 }

# The bottom row leaves 1 remaining, which asks for page 2: Python's from the issues endpoint, Rust's from /pulls
# (#384). Its rows go in below the cursor, so once the screen settles a second G reaches the new bottom row, which
# asks for page 3.
[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
keys = ["G"]

[[step]]
wait = { stable_ms = 1000 }

[[step]]
keys = ["G"]

[[step]]
wait = { text = "Lazy fixture pull request 11", timeout_ms = 15000 }

# Python sometimes draws the Details tab underline zero-width after a repo is selected (#209), and no wait settles it.
# These captures are about the PR table, so the Details box is ignored: a re-record keeps the stored screen.
[[step]]
capture = "after-page-2"
checks = ["rows", "cursor"]
ignore = { boxes = ["Details"] }

# Page 3 doesn't move the cursor (row 59 of 70); G reaches its bottom row, which asks for page 4.
[[step]]
wait = { stable_ms = 1000 }

[[step]]
keys = ["G"]

[[step]]
wait = { regex = 'Lazy fixture pull request 1\s', timeout_ms = 15000 }

[[step]]
capture = "after-page-3"
checks = ["rows", "cursor"]
ignore = { boxes = ["Details"] }

[expect.after-page-2]
not_contains = ["Traceback"]

[expect.after-page-3]
not_contains = ["Traceback"]
