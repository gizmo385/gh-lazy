version = 1
description = "Searchable table: / opens the search box, enter filters the 60-repo table by a substring of each row's repr (including across cells), and an empty search restores every row and hides the box; with the box focused the footer is / and ^p only; / while the table is maximized filters it unseen"
gate = true
parity_rows = [
    "searchable-tables.search",
    "searchable-tables.search-hide-on-blur",
    "searchable-tables.search-box-key-filter",
    "searchable-tables.search-while-maximized",
    "keybindings.common-table-search",
]
sizes = [[160, 48]]

[env]
fixtures = ["repos-60", "base"]

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

# Python fills the table once it has every page, so the first repo showing means the table is complete (50 rows
# until #134 is fixed, then 60). The matching repos are all on the first page.
[[step]]
wait = { text = "alpha-service", timeout_ms = 15000 }

[[step]]
keys = ["1", "/"]

# Every capture ignores the Issues and Workflows sections, which have no table in Rust yet: #172 and #173 each remove
# their box from these lists.
# No `rows`: Python keeps the table at the full section height under the box and clips its bottom rows, while Rust
# lays it out in the rows the box leaves, so its horizontal scrollbar takes one of them (Py bug B40, decision
# `search-box-table-height`). The cursor and focus still match.
[[step]]
capture = "open"
checks = ["cursor", "focus"]
ignore = { boxes = ["Issues", "Workflows"] }

# `india-lazy-…`, `juliett-lazy-…` and `lima-lazy-…`.
[[step]]
type = "lazy"

[[step]]
keys = ["enter"]

[[step]]
capture = "filtered"
checks = ["rows", "cursor", "focus"]
ignore = { boxes = ["Issues", "Workflows"] }

# Reopening selects the old query (Textual's `select_on_focus`).
[[step]]
keys = ["/"]

[[step]]
capture = "reopen"
checks = ["rows", "cursor", "focus"]
ignore = { boxes = ["Issues", "Workflows"] }

# `('☆', 'parity-bot', 'gh-golf-…', …)`: the end of the owner cell and the start of the name cell.
[[step]]
keys = ["ctrl+u"]

[[step]]
type = "', 'gh"

[[step]]
keys = ["enter"]

[[step]]
capture = "cross-cell"
checks = ["rows", "cursor", "focus"]
ignore = { boxes = ["Issues", "Workflows"] }

# Typed straight over the selected old query, with no ctrl+u: the new text replaces it.
[[step]]
keys = ["/"]

[[step]]
type = "gh-hotel"

[[step]]
keys = ["enter"]

[[step]]
capture = "typed-over"
checks = ["rows", "cursor", "focus"]
ignore = { boxes = ["Issues", "Workflows"] }

[[step]]
keys = ["/", "ctrl+u", "enter"]

[[step]]
capture = "cleared"
checks = ["rows", "cursor", "focus"]
ignore = { boxes = ["Issues", "Workflows"] }

# The box takes focus but isn't drawn: it's outside the maximized `DataTable`. Enter filters the maximized table,
# which re-centers at its new height, and focus goes back to it.
[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[1] Repositories", timeout_ms = 5000 }

[[step]]
keys = ["/"]

[[step]]
type = "lazy"

[[step]]
keys = ["enter"]

[[step]]
wait = { gone = "alpha-service", timeout_ms = 5000 }

[[step]]
capture = "max-filtered"
checks = ["focus"]

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[1] Repositories", timeout_ms = 5000 }

[[step]]
capture = "max-restored"
checks = ["titles", "rows", "focus"]
ignore = { boxes = ["Issues", "Workflows"] }

# Escape with the box focused while the table is maximized minimizes, and focus stays in the box.
[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[1] Repositories", timeout_ms = 5000 }

[[step]]
keys = ["/", "escape"]

[[step]]
wait = { text = "[1] Repositories", timeout_ms = 5000 }

[[step]]
capture = "max-escape-in-box"
checks = ["focus"]
ignore = { boxes = ["Issues", "Workflows"] }

[expect.open]
contains = ["Search...", " / Search  ^p Command Pal"]
not_contains = ["Traceback"]

[expect.filtered]
contains = ["india-lazy-service", "juliett-lazy-service", "lima-lazy-service"]
not_contains = ["alpha-service", "Traceback"]

[expect.reopen]
contains = ["india-lazy-service"]
not_contains = ["alpha-service", "Traceback"]

[expect.cross-cell]
contains = ["gh-golf-service", "gh-hotel-service"]
not_contains = ["india-lazy-service", "Traceback"]

[expect.typed-over]
contains = ["gh-hotel-service"]
not_contains = ["gh-golf-service", "', 'gh", "Traceback"]

[expect.cleared]
contains = ["alpha-service"]
not_contains = ["Search...", "Traceback"]

[expect.max-filtered]
contains = ["india-lazy-service", "lima-lazy-service"]
not_contains = ["alpha-service", "Traceback"]
