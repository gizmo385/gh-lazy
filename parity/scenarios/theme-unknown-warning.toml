version = 2
description = "An unknown appearance.theme draws the default theme and raises an \"Unknown theme\" warning toast once the main screen is up, which goes away after its 5 s timeout"
# Rust-only: Python silently falls back to textual-dark and rewrites the name on the next save (decision
# app-owned-themes, D5). `theme-unknown` checks the fallback colors in both apps. Waits out the toast's timer, so it
# runs at one size (parity/README.md, "Keeping the suite fast").
parity_rows = ["main-layout.theme-unknown-warning"]
sizes = [[160, 48]]

[env]
fixtures = ["base"]

[env.config_overrides]
appearance = { theme = "no-such-theme" }

[[step]]
wait = { text = "No repository selected", timeout_ms = 15000 }

[[step]]
wait = { text = "Unknown theme" }

# parity/themes.toml gives no-such-theme the default theme's success color, so the focus check fails unless the app
# draws the default theme.
[[step]]
capture = "warned"

[[step]]
wait = { gone = "Unknown theme", timeout_ms = 8000 }

[[step]]
capture = "expired"

[expect.warned]
pane_titles = ["", "[1] Repositories", "[5] Details", "[2] Pull Requests", "[3] Issues", "[4] Workflows"]
focused = ["[1] Repositories"]
contains = ["Unknown theme", "No theme is called \"no-such-theme\". Using", "\"dark\"."]

[expect.expired]
pane_titles = ["", "[1] Repositories", "[5] Details", "[2] Pull Requests", "[3] Issues", "[4] Workflows"]
focused = ["[1] Repositories"]
not_contains = ["Unknown theme", "No theme is called"]
