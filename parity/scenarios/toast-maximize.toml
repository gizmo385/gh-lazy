version = 1
description = "The View Maximized toast goes away after its 5 s timeout, and the next maximize raises no new one"
gate = true
parity_rows = ["main-layout.toasts", "toasts.view-maximized", "main-layout.maximize"]
# The one scenario that waits out this toast's timer, so it runs at one size (parity/README.md, "Keeping the suite
# fast"). `maximize` captures the toast itself, at both sizes.
sizes = [[160, 48]]

[env]
fixtures = ["base"]

[[step]]
wait = { text = "Repositories", timeout_ms = 15000 }

[[step]]
keys = ["1"]

[[step]]
wait = { text = "O Lookup Repository" }

[[step]]
keys = ["M"]

[[step]]
wait = { text = "View Maximized" }

[[step]]
wait = { gone = "View Maximized", timeout_ms = 8000 }

[[step]]
capture = "expired"

[[step]]
keys = ["escape"]

[[step]]
wait = { text = "[1] Repositories" }

# The toast is once per session.
[[step]]
keys = ["M"]

[[step]]
wait = { gone = "[1] Repositories" }

[[step]]
capture = "max-again"
checks = ["titles", "focus"]

[expect.expired]
not_contains = ["View Maximized", "Traceback"]

[expect.max-again]
pane_titles = []
not_contains = ["[1] Repositories", "View Maximized", "Traceback"]
