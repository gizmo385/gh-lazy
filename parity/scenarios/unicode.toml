version = 1
description = "Wide, combining, zero-width and right-to-left text: the PR table's columns stay aligned, and the PR's title, branch and body (a paragraph, a list and a table) lay out by cell width"
# The diff's capture is in the Rust-only `diff-unicode`: since #388 the Diff tab is one continuous diff, whose keys
# Python can't follow.
# Zero-width characters are kept out of the table: ratatui doesn't write them to the terminal, Textual does, so the
# cells differ though they look the same. ZWJ emoji sequences are left out: terminals (and the harness's vt100 parser) disagree on their width, so they're
# covered by the unit tests only. Control characters are too: Python sends them to the terminal raw (Py bug B34). The
# footer is left out of the cross-app checks: Python spells `^p Command Pallete` (Py bug B14).
gate = true
parity_rows = [
    "pull-requests.columns",
    "pull-requests.overview-header",
    "pull-requests.overview-body",
]
sizes = [[160, 48]]

[env]
# unicode replaces pr-details' PR titles, PR 5's title, body and head branch, and PR 5's diff.
fixtures = ["unicode", "pr-details", "base"]
config_overrides = { appearance = { show_issues = false, show_workflows = false } }

[[step]]
wait = { text = "pr-details", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "視覚カーソルを追加", timeout_ms = 15000 }

[[step]]
wait = { text = "Ελληνικά", timeout_ms = 15000 }

[[step]]
capture = "table"
checks = ["titles", "headers", "rows", "cursor", "focus"]

# Python moves focus a tick after a focus key (Py bug B98), so wait for the PR table's bindings in the footer.
[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
wait = { stable_ms = 500 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "機能/カーソル", timeout_ms = 15000 }

[[step]]
wait = { text = "作業中", timeout_ms = 15000 }

[[step]]
wait = { text = "Status checks:", timeout_ms = 5000 }

# Under load Python draws the PR before it retitles the details and moves focus there: wait for both, and for the
# reviews' title.
[[step]]
wait = { focused = "PR #5 Details" }

[[step]]
wait = { text = "PR Reviews" }

# Not `tabs`: right after a selection Python sometimes draws the tab underline zero-width (#209).
[[step]]
capture = "overview"
checks = ["titles", "headers", "rows", "cursor", "focus"]

[expect.table]
contains = [
    "視覚カーソルを追加 🚀 viewer",
    "Release 0.2.0 🇯🇵 한국어 지원",
    "תמיכה בעברית and Ελληνικά",
]
not_contains = ["Traceback", "�"]

[expect.overview]
contains = [
    "視覚カーソルを追加 🚀 viewer",
    "機能/カーソル",
    "概要",
    "🚀 速い",
    "한국어: 커서를 추가합니다",
    "עברית: שלום עולם",
    "名前",
    "ビルド",
]
not_contains = ["Traceback", "�"]
