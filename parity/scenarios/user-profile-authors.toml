version = 1
description = "User profile (u) from the Pull Requests and Issues tables: the highlighted author's profile, a picked repo selected without joining the repos table, and the error toasts on empty tables"
gate = true
parity_rows = [
    "pull-requests.user-profile",
    "issues.user-profile",
    "toasts.nothing-selected",
]

[env]
fixtures = ["user-profile-authors", "user-profile", "repo-lists", "repo-selected-empty", "base"]

[[step]]
wait = { text = "browse-fixture", timeout_ms = 15000 }

[[step]]
keys = ["enter"]

[[step]]
wait = { text = "Browse fixture pull request 99", timeout_ms = 15000 }

# The first PR's author. Wait for the footer after each focus key: Python moves focus a tick later, and keys typed
# before it go to the old table (Py bug B98).
[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
keys = ["u"]

[[step]]
wait = { text = "Parity Bot (@parity-bot)" }

# Not the titles: at 160x48 Python's footer strip (Py bug B50) covers the Workflows box's bottom border, so its
# title isn't read there, while Rust draws the usual footer row below it.
[[step]]
capture = "pr-author"
checks = ["rows"]

[[step]]
keys = ["escape"]

[[step]]
wait = { gone = "Parity Bot (@parity-bot)" }

# The third issue's author, then the one repo on their profile.
[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["j", "j", "u"]

[[step]]
wait = { text = "Parity Friend (@parity-friend)" }

# Not the titles: at 160x48 Python's footer strip (Py bug B50) covers the Workflows box's bottom border, so its
# title isn't read there, while Rust draws the usual footer row below it.
[[step]]
capture = "issue-author"
checks = ["rows"]

[[step]]
keys = ["tab", "enter"]

[[step]]
wait = { text = "Current repo: parity-friend/friend-tools" }

[[step]]
capture = "picked"
checks = ["titles", "rows", "focus"]
ignore = { boxes = ["Details"] }

# A repo with no PRs or issues: both tables toast.
[[step]]
keys = ["1"]

[[step]]
wait = { text = "O Lookup Repository" }

[[step]]
keys = ["j", "enter"]

[[step]]
wait = { text = "Current repo: parity-bot/dotfiles" }

[[step]]
wait = { text = "[2] Pull Requests (empty)" }

[[step]]
keys = ["2"]

[[step]]
wait = { text = "O Lookup Pull Request" }

[[step]]
keys = ["u"]

[[step]]
wait = { text = "No pull request currently selected" }

[[step]]
keys = ["3"]

[[step]]
wait = { text = "O Lookup Issue" }

[[step]]
keys = ["u"]

[[step]]
wait = { text = "No issue currently selected" }

[[step]]
capture = "empty-tables"
checks = ["titles", "focus"]
ignore = { boxes = ["Details"] }

[expect.pr-author]
contains = ["Parity Bot (@parity-bot) — user"]

[expect.issue-author]
contains = ["Parity Friend (@parity-friend) — user", "friend-tools"]

[expect.picked]
contains = ["Current repo: parity-friend/friend-tools", "[5] parity-friend/friend-tools Details"]
not_contains = ["Recent repositories"]

[expect.empty-tables]
contains = ["No pull request currently selected", "No issue currently selected"]
