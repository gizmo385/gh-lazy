<text class="s1" x="40" y="935" textLength="1550" lengthAdjust="spacingAndGlyphs">Quit                                                                                                                                                       </text>
<text class="s0" x="1590" y="935" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
