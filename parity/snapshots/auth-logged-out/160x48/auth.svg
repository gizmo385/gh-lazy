<text class="s0" x="0" y="875" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="875" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="895" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
