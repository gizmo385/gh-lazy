<text class="s0" x="0" y="15" textLength="1600" lengthAdjust="spacingAndGlyphs">+- GitHub Authentication --------------------------------------------------------------------------------------------------------------------------------------+</text>
<text class="s0" x="0" y="35" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s1" x="10" y="35" textLength="470" lengthAdjust="spacingAndGlyphs">To proceed, please log into the Github CLI via </text>
<text class="s2" x="480" y="35" textLength="130" lengthAdjust="spacingAndGlyphs">gh auth login</text>
<text class="s0" x="1590" y="35" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="55" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="55" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="75" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s3" x="10" y="75" textLength="1580" lengthAdjust="spacingAndGlyphs">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text class="s0" x="1590" y="75" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="95" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="95" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="115" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="115" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="135" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="135" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="155" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s4" x="30" y="155" textLength="1540" lengthAdjust="spacingAndGlyphs">                                                       LazyGithub: A Terminal UI For GitHub (0.1.0)                                                       </text>
<text class="s0" x="1590" y="155" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="175" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="175" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="195" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s1" x="10" y="195" textLength="1580" lengthAdjust="spacingAndGlyphs">  LazyGithub is a terminal UI for interacting with GitHub. You can get started by selecting one of the repositories listed in the table on the left. Once     </text>
<text class="s0" x="1590" y="195" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="215" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s1" x="10" y="215" textLength="1580" lengthAdjust="spacingAndGlyphs">  you have selected a repository, any issues, pull requests, and action workflows will be retrieved and displayed below it.                                   </text>
<text class="s0" x="1590" y="215" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="235" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="235" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="255" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s5" x="30" y="255" textLength="680" lengthAdjust="spacingAndGlyphs">Issues, pull requests, and action lists can also be interacted with!</text>
<text class="s0" x="1590" y="255" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="275" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="275" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="295" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="295" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="315" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s6" x="30" y="315" textLength="130" lengthAdjust="spacingAndGlyphs">Pull Requests</text>
<text class="s0" x="1590" y="315" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="335" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="335" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="355" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s1" x="10" y="355" textLength="1580" lengthAdjust="spacingAndGlyphs">  You can interact with a PR by viewing its details, viewing the PR diff, and participating in any active conversations happening on the PR. You can also     </text>
<text class="s0" x="1590" y="355" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="375" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s1" x="10" y="375" textLength="1580" lengthAdjust="spacingAndGlyphs">  create a new PR for the currently selected repo.                                                                                                            </text>
<text class="s0" x="1590" y="375" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="395" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="395" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="415" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="415" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="435" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s6" x="30" y="435" textLength="60" lengthAdjust="spacingAndGlyphs">Issues</text>
<text class="s0" x="1590" y="435" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="455" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="455" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="475" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s1" x="10" y="475" textLength="1580" lengthAdjust="spacingAndGlyphs">  You can interact with an issue by viewing its details, partipcating in any activate conversations happening on the issue, and by editing the issue itself.  </text>
<text class="s0" x="1590" y="475" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="495" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s1" x="10" y="495" textLength="1580" lengthAdjust="spacingAndGlyphs">  This means that you can close an issue from within LazyGithub.                                                                                              </text>
<text class="s0" x="1590" y="495" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="515" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="515" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="535" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="535" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="555" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s6" x="30" y="555" textLength="70" lengthAdjust="spacingAndGlyphs">Actions</text>
<text class="s0" x="1590" y="555" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="575" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="575" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="595" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s1" x="10" y="595" textLength="1580" lengthAdjust="spacingAndGlyphs">  Github action and workflow support is pretty limited. It currently only supports listing the workflows and the most recent runs across all actions on the   </text>
<text class="s0" x="1590" y="595" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="615" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s1" x="10" y="615" textLength="1580" lengthAdjust="spacingAndGlyphs">  currently selected repo, as well as kicking off a workflow that supports manual triggers.                                                                   </text>
<text class="s0" x="1590" y="615" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="635" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="635" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="655" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="655" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="675" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="675" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="695" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="695" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="715" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="715" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="735" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="735" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="755" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="755" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="775" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="775" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="795" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
