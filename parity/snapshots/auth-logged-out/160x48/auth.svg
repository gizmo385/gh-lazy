<text class="s0" x="0" y="835" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="1590" y="835" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
<text class="s0" x="0" y="855" textLength="10" lengthAdjust="spacingAndGlyphs">|</text>
