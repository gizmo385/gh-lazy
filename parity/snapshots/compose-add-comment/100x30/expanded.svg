<text class="s0" x="0" y="15" textLength="1000" lengthAdjust="spacingAndGlyphs">█▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀█</text>
<text class="s0" x="0" y="35" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s1" x="10" y="35" textLength="980" lengthAdjust="spacingAndGlyphs"> Add Comment                                                                                      </text>
<text class="s0" x="990" y="35" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="55" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s2" x="20" y="55" textLength="20" lengthAdjust="spacingAndGlyphs">▎ </text>
<text class="s1" x="40" y="55" textLength="950" lengthAdjust="spacingAndGlyphs">+Run `viewer FILE`, then press `j` and `k` to move.                                            </text>
<text class="s0" x="990" y="55" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="75" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="990" y="75" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="95" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s2" x="20" y="95" textLength="70" lengthAdjust="spacingAndGlyphs"> Write </text>
<text class="s3" x="100" y="95" textLength="90" lengthAdjust="spacingAndGlyphs"> Preview </text>
<text class="s4" x="200" y="95" textLength="780" lengthAdjust="spacingAndGlyphs">──────────────────────────────────────────────────────────────────────────────</text>
<text class="s0" x="990" y="95" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="115" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s1" x="10" y="115" textLength="140" lengthAdjust="spacingAndGlyphs">  Mention the </text>
<text class="s5" x="150" y="115" textLength="100" lengthAdjust="spacingAndGlyphs">arrow keys</text>
<text class="s1" x="250" y="115" textLength="700" lengthAdjust="spacingAndGlyphs"> too.                                                                 </text>
<text class="s0" x="990" y="115" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="135" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="990" y="135" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="155" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s1" x="10" y="155" textLength="940" lengthAdjust="spacingAndGlyphs">  The README&apos;s Keys section should say what this line does in a little more detail. Here&apos;s    </text>
<text class="s0" x="990" y="155" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="175" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s1" x="10" y="175" textLength="940" lengthAdjust="spacingAndGlyphs">  what I&apos;d add:                                                                               </text>
<text class="s0" x="990" y="175" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="195" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="990" y="195" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="215" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s6" x="30" y="215" textLength="20" lengthAdjust="spacingAndGlyphs">• </text>
<text class="s7" x="50" y="215" textLength="10" lengthAdjust="spacingAndGlyphs">j</text>
<text class="s1" x="60" y="215" textLength="30" lengthAdjust="spacingAndGlyphs"> / </text>
<text class="s7" x="90" y="215" textLength="10" lengthAdjust="spacingAndGlyphs">k</text>
<text class="s1" x="100" y="215" textLength="850" lengthAdjust="spacingAndGlyphs"> move one line and stop at either end of the file; they never wrap around.           </text>
<text class="s0" x="990" y="215" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="235" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s6" x="30" y="235" textLength="20" lengthAdjust="spacingAndGlyphs">• </text>
<text class="s7" x="50" y="235" textLength="10" lengthAdjust="spacingAndGlyphs">G</text>
<text class="s1" x="60" y="235" textLength="280" lengthAdjust="spacingAndGlyphs"> jumps to the last line and </text>
<text class="s7" x="340" y="235" textLength="10" lengthAdjust="spacingAndGlyphs">g</text>
<text class="s1" x="350" y="235" textLength="600" lengthAdjust="spacingAndGlyphs"> to the first.                                              </text>
<text class="s0" x="990" y="235" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="255" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s6" x="30" y="255" textLength="20" lengthAdjust="spacingAndGlyphs">• </text>
<text class="s7" x="50" y="255" textLength="10" lengthAdjust="spacingAndGlyphs">J</text>
<text class="s1" x="60" y="255" textLength="30" lengthAdjust="spacingAndGlyphs"> / </text>
<text class="s7" x="90" y="255" textLength="10" lengthAdjust="spacingAndGlyphs">K</text>
<text class="s1" x="100" y="255" textLength="850" lengthAdjust="spacingAndGlyphs"> move by hunk, and stop at the first and the last hunk.                              </text>
<text class="s0" x="990" y="255" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="275" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s6" x="30" y="275" textLength="20" lengthAdjust="spacingAndGlyphs">• </text>
<text class="s1" x="50" y="275" textLength="300" lengthAdjust="spacingAndGlyphs">The arrow keys do the same as </text>
<text class="s7" x="350" y="275" textLength="10" lengthAdjust="spacingAndGlyphs">j</text>
<text class="s1" x="360" y="275" textLength="50" lengthAdjust="spacingAndGlyphs"> and </text>
<text class="s7" x="410" y="275" textLength="10" lengthAdjust="spacingAndGlyphs">k</text>
<text class="s1" x="420" y="275" textLength="530" lengthAdjust="spacingAndGlyphs">, and page up and page down move by a screen.        </text>
<text class="s0" x="990" y="275" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="295" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="990" y="295" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="315" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s1" x="10" y="315" textLength="940" lengthAdjust="spacingAndGlyphs">  I checked each of these against the current build and they all behave as described, so this </text>
<text class="s0" x="990" y="315" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="335" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s1" x="10" y="335" textLength="940" lengthAdjust="spacingAndGlyphs">  is only a docs change. If you want, I can open a follow-up for wrapping around at the ends, </text>
<text class="s0" x="990" y="335" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="355" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s1" x="10" y="355" textLength="940" lengthAdjust="spacingAndGlyphs">  but I&apos;d keep it behind a setting so the default stays the same as today.                    </text>
<text class="s0" x="990" y="355" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="375" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="990" y="375" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="395" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s1" x="10" y="395" textLength="230" lengthAdjust="spacingAndGlyphs">  The help panel lists </text>
<text class="s7" x="240" y="395" textLength="10" lengthAdjust="spacingAndGlyphs">j</text>
<text class="s1" x="250" y="395" textLength="740" lengthAdjust="spacingAndGlyphs"> as &quot;Line down&quot; but the footer says &quot;Down&quot;. We should pick one; I&apos;d go    </text>
<text class="s0" x="990" y="395" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="415" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s1" x="10" y="415" textLength="980" lengthAdjust="spacingAndGlyphs">  with the help panel&apos;s wording because it&apos;s more specific.                                       </text>
<text class="s0" x="990" y="415" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="435" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="990" y="435" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="455" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s1" x="10" y="455" textLength="980" lengthAdjust="spacingAndGlyphs">  Steps I ran:                                                                                    </text>
<text class="s0" x="990" y="455" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="475" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="990" y="475" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="495" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s6" x="30" y="495" textLength="40" lengthAdjust="spacingAndGlyphs"> 1. </text>
<text class="s1" x="70" y="495" textLength="920" lengthAdjust="spacingAndGlyphs">Open a file longer than the screen                                                          </text>
<text class="s0" x="990" y="495" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="515" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s6" x="30" y="515" textLength="40" lengthAdjust="spacingAndGlyphs"> 2. </text>
<text class="s1" x="70" y="515" textLength="60" lengthAdjust="spacingAndGlyphs">Press </text>
<text class="s7" x="130" y="515" textLength="10" lengthAdjust="spacingAndGlyphs">G</text>
<text class="s0" x="990" y="515" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="535" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s6" x="30" y="535" textLength="40" lengthAdjust="spacingAndGlyphs"> 3. </text>
<text class="s1" x="70" y="535" textLength="60" lengthAdjust="spacingAndGlyphs">Press </text>
<text class="s7" x="130" y="535" textLength="10" lengthAdjust="spacingAndGlyphs">j</text>
<text class="s1" x="140" y="535" textLength="70" lengthAdjust="spacingAndGlyphs">, then </text>
<text class="s7" x="210" y="535" textLength="10" lengthAdjust="spacingAndGlyphs">k</text>
<text class="s1" x="220" y="535" textLength="70" lengthAdjust="spacingAndGlyphs">, then </text>
<text class="s7" x="290" y="535" textLength="10" lengthAdjust="spacingAndGlyphs">g</text>
<text class="s0" x="990" y="535" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="555" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s6" x="30" y="555" textLength="40" lengthAdjust="spacingAndGlyphs"> 4. </text>
<text class="s1" x="70" y="555" textLength="60" lengthAdjust="spacingAndGlyphs">Press </text>
<text class="s7" x="130" y="555" textLength="10" lengthAdjust="spacingAndGlyphs">J</text>
<text class="s1" x="140" y="555" textLength="50" lengthAdjust="spacingAndGlyphs"> and </text>
<text class="s7" x="190" y="555" textLength="10" lengthAdjust="spacingAndGlyphs">K</text>
<text class="s1" x="200" y="555" textLength="790" lengthAdjust="spacingAndGlyphs"> on a file with three hunks                                                    </text>
<text class="s0" x="990" y="555" textLength="10" lengthAdjust="spacingAndGlyphs">█</text>
<text class="s0" x="0" y="575" textLength="1000" lengthAdjust="spacingAndGlyphs">█▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄█</text>
<text class="s8" x="0" y="595" textLength="40" lengthAdjust="spacingAndGlyphs"> ^s </text>
<text class="s1" x="40" y="595" textLength="120" lengthAdjust="spacingAndGlyphs">Add Comment </text>
<text class="s8" x="160" y="595" textLength="90" lengthAdjust="spacingAndGlyphs"> shift+⏎ </text>
<text class="s1" x="250" y="595" textLength="120" lengthAdjust="spacingAndGlyphs">Add Comment </text>
<text class="s8" x="370" y="595" textLength="40" lengthAdjust="spacingAndGlyphs"> ^t </text>
<text class="s1" x="410" y="595" textLength="60" lengthAdjust="spacingAndGlyphs">Write </text>
