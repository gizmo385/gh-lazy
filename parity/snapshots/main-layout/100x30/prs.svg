<text class="s2" x="990" y="455" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="0" y="475" textLength="410" lengthAdjust="spacingAndGlyphs">┌─ [4] Workflows ──────────────────────┐│</text>
<text class="s1" x="410" y="475" textLength="580" lengthAdjust="spacingAndGlyphs">  You can interact with a PR by viewing its details,      </text>
<text class="s2" x="990" y="475" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="0" y="495" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s4" x="10" y="495" textLength="380" lengthAdjust="spacingAndGlyphs"> Time  Result  Job Name  Run Name  Run</text>
<text class="s2" x="390" y="495" textLength="20" lengthAdjust="spacingAndGlyphs">││</text>
<text class="s1" x="410" y="495" textLength="580" lengthAdjust="spacingAndGlyphs">  viewing the PR diff, and participating in any active    </text>
<text class="s2" x="990" y="495" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="0" y="515" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s7" x="360" y="515" textLength="10" lengthAdjust="spacingAndGlyphs">▎</text>
<text class="s2" x="390" y="515" textLength="20" lengthAdjust="spacingAndGlyphs">││</text>
<text class="s1" x="410" y="515" textLength="580" lengthAdjust="spacingAndGlyphs">  conversations happening on the PR. You can also         </text>
<text class="s2" x="990" y="515" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="0" y="535" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="390" y="535" textLength="20" lengthAdjust="spacingAndGlyphs">││</text>
<text class="s1" x="410" y="535" textLength="580" lengthAdjust="spacingAndGlyphs">  create a new PR for the currently selected repo.        </text>
<text class="s2" x="990" y="535" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="0" y="555" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="390" y="555" textLength="20" lengthAdjust="spacingAndGlyphs">││</text>
<text class="s2" x="990" y="555" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
