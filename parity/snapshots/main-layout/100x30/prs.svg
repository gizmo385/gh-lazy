<text class="s2" x="0" y="435" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="390" y="435" textLength="20" lengthAdjust="spacingAndGlyphs">││</text>
<text class="s11" x="430" y="435" textLength="130" lengthAdjust="spacingAndGlyphs">Pull Requests</text>
<text class="s2" x="990" y="435" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
