<text class="s9" x="430" y="175" textLength="520" lengthAdjust="spacingAndGlyphs">    LazyGithub: A Terminal UI For GitHub (0.1.0)    </text>
<text class="s2" x="990" y="175" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="0" y="195" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s4" x="10" y="195" textLength="380" lengthAdjust="spacingAndGlyphs"> #  Status  Author  Title             </text>
<text class="s8" x="390" y="195" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="400" y="195" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="990" y="195" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="0" y="215" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="390" y="215" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="400" y="215" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s1" x="410" y="215" textLength="560" lengthAdjust="spacingAndGlyphs">  LazyGithub is a terminal UI for interacting with      </text>
<text class="s2" x="990" y="215" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="0" y="235" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="390" y="235" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="400" y="235" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s1" x="410" y="235" textLength="560" lengthAdjust="spacingAndGlyphs">  GitHub. You can get started by selecting one of the   </text>
<text class="s2" x="990" y="235" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="0" y="255" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="390" y="255" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="400" y="255" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s1" x="410" y="255" textLength="560" lengthAdjust="spacingAndGlyphs">  repositories listed in the table on the left. Once    </text>
<text class="s2" x="990" y="255" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="0" y="275" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="390" y="275" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="400" y="275" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s1" x="410" y="275" textLength="560" lengthAdjust="spacingAndGlyphs">  you have selected a repository, any issues, pull      </text>
<text class="s2" x="990" y="275" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="0" y="295" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="390" y="295" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="400" y="295" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s1" x="410" y="295" textLength="560" lengthAdjust="spacingAndGlyphs">  requests, and action workflows will be retrieved and  </text>
<text class="s2" x="990" y="295" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="0" y="315" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="390" y="315" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="400" y="315" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s1" x="410" y="315" textLength="560" lengthAdjust="spacingAndGlyphs">  displayed below it.                                   </text>
<text class="s2" x="990" y="315" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="0" y="335" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="390" y="335" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="400" y="335" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="990" y="335" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s8" x="0" y="355" textLength="400" lengthAdjust="spacingAndGlyphs">└──────────────────────────────────────┘</text>
<text class="s2" x="400" y="355" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s4" x="430" y="355" textLength="510" lengthAdjust="spacingAndGlyphs">Issues, pull requests, and action lists can also be</text>
<text class="s10" x="970" y="355" textLength="20" lengthAdjust="spacingAndGlyphs">▁▁</text>
<text class="s2" x="990" y="355" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
