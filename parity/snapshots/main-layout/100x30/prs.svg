<text class="s4" x="430" y="375" textLength="160" lengthAdjust="spacingAndGlyphs">interacted with!</text>
<text class="s2" x="990" y="375" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="0" y="395" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s4" x="10" y="395" textLength="380" lengthAdjust="spacingAndGlyphs"> #  Status  Author  Title             </text>
<text class="s2" x="390" y="395" textLength="20" lengthAdjust="spacingAndGlyphs">││</text>
<text class="s2" x="990" y="395" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
<text class="s2" x="0" y="415" textLength="10" lengthAdjust="spacingAndGlyphs">│</text>
