<text class="s0" x="10" y="15" textLength="120" lengthAdjust="spacingAndGlyphs">Introduction</text>
<text class="s1" x="0" y="35" textLength="10" lengthAdjust="spacingAndGlyphs">╸</text>
<text class="s2" x="10" y="35" textLength="120" lengthAdjust="spacingAndGlyphs">━━━━━━━━━━━━</text>
<text class="s1" x="130" y="35" textLength="870" lengthAdjust="spacingAndGlyphs">╺━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
<text class="s3" x="20" y="95" textLength="940" lengthAdjust="spacingAndGlyphs">                         LazyGithub: A Terminal UI For GitHub (0.1.0)                         </text>
<text class="s4" x="20" y="135" textLength="930" lengthAdjust="spacingAndGlyphs">LazyGithub is a terminal UI for interacting with GitHub. You can get started by selecting one</text>
<text class="s4" x="20" y="155" textLength="930" lengthAdjust="spacingAndGlyphs">of the repositories listed in the table on the left. Once you have selected a repository, any</text>
<text class="s4" x="20" y="175" textLength="850" lengthAdjust="spacingAndGlyphs">issues, pull requests, and action workflows will be retrieved and displayed below it.</text>
<text class="s5" x="20" y="215" textLength="680" lengthAdjust="spacingAndGlyphs">Issues, pull requests, and action lists can also be interacted with!</text>
<text class="s6" x="20" y="275" textLength="130" lengthAdjust="spacingAndGlyphs">Pull Requests</text>
<text class="s4" x="20" y="315" textLength="920" lengthAdjust="spacingAndGlyphs">You can interact with a PR by viewing its details, viewing the PR diff, and participating in</text>
<text class="s4" x="20" y="335" textLength="920" lengthAdjust="spacingAndGlyphs">any active conversations happening on the PR. You can also create a new PR for the currently</text>
<text class="s4" x="20" y="355" textLength="140" lengthAdjust="spacingAndGlyphs">selected repo.</text>
<text class="s6" x="20" y="415" textLength="60" lengthAdjust="spacingAndGlyphs">Issues</text>
<text class="s4" x="20" y="455" textLength="830" lengthAdjust="spacingAndGlyphs">You can interact with an issue by viewing its details, partipcating in any activate</text>
<text class="s4" x="20" y="475" textLength="940" lengthAdjust="spacingAndGlyphs">conversations happening on the issue, and by editing the issue itself. This means that you can</text>
<text class="s4" x="20" y="495" textLength="380" lengthAdjust="spacingAndGlyphs">close an issue from within LazyGithub.</text>
<text class="s7" x="490" y="495" textLength="10" lengthAdjust="spacingAndGlyphs">▌</text>
<text class="s7" x="490" y="515" textLength="10" lengthAdjust="spacingAndGlyphs">▌</text>
<text class="s8" x="510" y="515" textLength="140" lengthAdjust="spacingAndGlyphs">View Maximized</text>
<text class="s7" x="490" y="535" textLength="10" lengthAdjust="spacingAndGlyphs">▌</text>
<text class="s4" x="500" y="535" textLength="310" lengthAdjust="spacingAndGlyphs"> Current view maximized. Press </text>
<text class="s5" x="810" y="535" textLength="60" lengthAdjust="spacingAndGlyphs">escape</text>
<text class="s4" x="870" y="535" textLength="110" lengthAdjust="spacingAndGlyphs"> to        </text>
<text class="s6" x="20" y="555" textLength="70" lengthAdjust="spacingAndGlyphs">Actions</text>
<text class="s7" x="490" y="555" textLength="10" lengthAdjust="spacingAndGlyphs">▌</text>
<text class="s4" x="500" y="555" textLength="480" lengthAdjust="spacingAndGlyphs"> return.                                        </text>
<text class="s9" x="980" y="555" textLength="20" lengthAdjust="spacingAndGlyphs">▅▅</text>
<text class="s7" x="490" y="575" textLength="10" lengthAdjust="spacingAndGlyphs">▌</text>
<text class="s4" x="20" y="595" textLength="920" lengthAdjust="spacingAndGlyphs">Github action and workflow support is pretty limited. It currently only supports listing the</text>
