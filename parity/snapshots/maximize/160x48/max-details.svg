<text class="s0" x="10" y="15" textLength="120" lengthAdjust="spacingAndGlyphs">Introduction</text>
<text class="s1" x="0" y="35" textLength="10" lengthAdjust="spacingAndGlyphs">╸</text>
<text class="s2" x="10" y="35" textLength="120" lengthAdjust="spacingAndGlyphs">━━━━━━━━━━━━</text>
<text class="s1" x="130" y="35" textLength="1470" lengthAdjust="spacingAndGlyphs">╺━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
<text class="s3" x="20" y="95" textLength="1560" lengthAdjust="spacingAndGlyphs">                                                        LazyGithub: A Terminal UI For GitHub (0.1.0)                                                        </text>
<text class="s4" x="20" y="135" textLength="1550" lengthAdjust="spacingAndGlyphs">LazyGithub is a terminal UI for interacting with GitHub. You can get started by selecting one of the repositories listed in the table on the left. Once you</text>
<text class="s4" x="20" y="155" textLength="1170" lengthAdjust="spacingAndGlyphs">have selected a repository, any issues, pull requests, and action workflows will be retrieved and displayed below it.</text>
<text class="s5" x="20" y="195" textLength="680" lengthAdjust="spacingAndGlyphs">Issues, pull requests, and action lists can also be interacted with!</text>
<text class="s6" x="20" y="255" textLength="130" lengthAdjust="spacingAndGlyphs">Pull Requests</text>
<text class="s4" x="20" y="295" textLength="1510" lengthAdjust="spacingAndGlyphs">You can interact with a PR by viewing its details, viewing the PR diff, and participating in any active conversations happening on the PR. You can also</text>
<text class="s4" x="20" y="315" textLength="480" lengthAdjust="spacingAndGlyphs">create a new PR for the currently selected repo.</text>
<text class="s6" x="20" y="375" textLength="60" lengthAdjust="spacingAndGlyphs">Issues</text>
<text class="s4" x="20" y="415" textLength="1540" lengthAdjust="spacingAndGlyphs">You can interact with an issue by viewing its details, partipcating in any activate conversations happening on the issue, and by editing the issue itself.</text>
<text class="s4" x="20" y="435" textLength="620" lengthAdjust="spacingAndGlyphs">This means that you can close an issue from within LazyGithub.</text>
<text class="s6" x="20" y="495" textLength="70" lengthAdjust="spacingAndGlyphs">Actions</text>
<text class="s4" x="20" y="535" textLength="1530" lengthAdjust="spacingAndGlyphs">Github action and workflow support is pretty limited. It currently only supports listing the workflows and the most recent runs across all actions on the</text>
<text class="s4" x="20" y="555" textLength="890" lengthAdjust="spacingAndGlyphs">currently selected repo, as well as kicking off a workflow that supports manual triggers.</text>
<text class="s7" x="980" y="875" textLength="10" lengthAdjust="spacingAndGlyphs">▌</text>
<text class="s7" x="980" y="895" textLength="10" lengthAdjust="spacingAndGlyphs">▌</text>
<text class="s8" x="1000" y="895" textLength="140" lengthAdjust="spacingAndGlyphs">View Maximized</text>
<text class="s7" x="980" y="915" textLength="10" lengthAdjust="spacingAndGlyphs">▌</text>
<text class="s4" x="990" y="915" textLength="310" lengthAdjust="spacingAndGlyphs"> Current view maximized. Press </text>
<text class="s5" x="1300" y="915" textLength="60" lengthAdjust="spacingAndGlyphs">escape</text>
<text class="s4" x="1360" y="915" textLength="220" lengthAdjust="spacingAndGlyphs"> to return.           </text>
<text class="s7" x="980" y="935" textLength="10" lengthAdjust="spacingAndGlyphs">▌</text>
