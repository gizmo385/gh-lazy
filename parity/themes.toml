# Theme colors the structural check needs, measured from Python screen dumps (see parity/README.md,
# "Structure extraction"). Keyed by the config's appearance.theme; the Python app defaults to textual-dark.
#
# focus: the border color of the focused pane, Textual's $success. Measured from the Python startup dump
# (xtask/tests/grids/python/startup-160x48.grid.json): the focused "[1] Repositories" border.

[textual-dark]
focus = "#4ebf71"

# Measured from the Python dumps of the theme-* scenarios: the focused "[1] Repositories" border at start.
[catppuccin-latte]
focus = "#40a02b"

# ANSI themes draw in the terminal's palette: ANSI green, which the grid dumps as an indexed color.
[ansi-dark]
focus = "idx:2"

# An unknown theme name falls back to textual-dark (theme-unknown).
[no-such-theme]
focus = "#4ebf71"
