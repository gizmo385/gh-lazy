[package]
name = "xtask"
description = "Development tasks for LazyGithub, run with `cargo xtask`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = { workspace = true }
fake-gh = { workspace = true }
portable-pty = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
# `preserve_order` keeps config.json keys in the order the config file lists them.
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
vt100 = { workspace = true }

[dev-dependencies]
# Only for the `echo_tui` test helper, which needs raw mode and terminal events.
crossterm = { workspace = true }

# A tiny TUI the runner integration test (tests/runner.rs) drives. `cargo test` builds examples, so the test finds
# it at target/<profile>/examples/echo_tui.
[[example]]
name = "echo_tui"
path = "tests/bin/echo_tui.rs"
test = false

[lints]
workspace = true
