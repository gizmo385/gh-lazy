[package]
name = "xtask"
description = "Development tasks for LazyGithub, run with `cargo xtask`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = { workspace = true }
# The fixture format, key normalization and lint live in fake-gh; the recorder reuses them. The parity harness uses
# its `install` and request-log types.
fake-gh = { workspace = true }
form_urlencoded = { workspace = true }
# The run timestamp at the top of the parity report's index.html.
jiff = { workspace = true }
portable-pty = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
# `preserve_order` keeps recorded bodies' and config.json keys in their original order.
serde_json = { workspace = true, features = ["preserve_order"] }
# Unified diffs of the two apps' captures in the parity report.
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
vt100 = { workspace = true }

[dev-dependencies]
# Only for the `echo_tui` test helper, which needs raw mode and terminal events.
crossterm = { workspace = true }
# Golden snapshots of structure extraction and the report.
insta = { workspace = true }

# A tiny TUI the runner integration test (tests/runner.rs) drives. `cargo test` builds examples, so the test finds
# it at target/<profile>/examples/echo_tui.
[[example]]
name = "echo_tui"
path = "tests/bin/echo_tui.rs"
test = false

# fake-ssh for tests/local_remote.rs, at target/<profile>/examples/fake-ssh: next to echo_tui, which stands in for
# fake-gh there, so `fake_gh::install` finds it.
[[example]]
name = "fake-ssh"
path = "tests/bin/fake_ssh.rs"
test = false

[lints]
workspace = true
